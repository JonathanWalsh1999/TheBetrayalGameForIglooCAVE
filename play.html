<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a080c">
<title>The Betrayal – player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#D9B45A;--gold2:#F3D98B;--txt:#EEE7DA;--muted:#A79F93;--line:rgba(217,180,90,.3);--card:#17121a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0a080c;color:var(--txt);font-family:Inter,Arial,sans-serif;min-height:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px;position:sticky;top:0;background:#0a080c;z-index:5}
header b{font:900 17px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:2px;white-space:nowrap}
#hdr{text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#net{background:#5a1a22;color:#fff;text-align:center;font-size:15px;padding:8px}
main{padding:18px 16px 110px;max-width:560px;margin:0 auto}
h1{font:900 30px/1.15 Cinzel,Georgia,serif;color:var(--gold2);margin:10px 0 12px;text-align:center}
p{font-size:18px;line-height:1.45;color:var(--muted);text-align:center;margin:10px 0}
.q{font:700 21px/1.35 Inter,Arial;color:var(--txt);margin:6px 0 14px}
.qh{display:flex;justify-content:space-between;font:700 15px Inter;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
#clock{font:900 22px Cinzel,Georgia,serif;color:var(--gold2);text-transform:none}
#clock.low{color:#ff9aa2}
button{font:700 19px Inter,Arial;border:none;border-radius:16px;padding:12px 14px;width:100%;margin:7px 0;cursor:pointer;color:#fff;background:#2b2333;display:flex;align-items:center;gap:14px;text-align:left;min-height:60px;line-height:1.25}
button:active{transform:scale(.98)}
button .L{flex:0 0 54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;font:900 22px Cinzel,Georgia,serif}
button .L.dark{color:#0a0a0a}
button.on{outline:5px solid #fff;outline-offset:2px;background:#3d3349}
button.go{background:#2E8B57;justify-content:center}
button.gold{background:var(--gold);color:#1a1205;justify-content:center}
button.no{background:#B3202F;justify-content:center}
button.alt{background:#3E4A7A;justify-content:center}
button:disabled{opacity:.4}
.two{display:flex;gap:10px}.two button{justify-content:center}
input{font:700 22px Inter;width:100%;padding:16px;border-radius:14px;border:3px solid var(--line);background:#120e15;color:#fff;margin:8px 0;text-align:center}
.big{font:900 64px/1 Cinzel,Georgia,serif;text-align:center;margin:20px 0 6px}
.ok{color:#9FE3B8}.bad{color:#FF9AA2}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;font-size:17px;line-height:1.4}
.hold{height:260px;border-radius:24px;border:3px dashed var(--gold);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font:800 22px Inter;color:var(--gold2);margin:16px 0;touch-action:none}
.hold.down{border-style:solid;background:#120e15;height:auto;min-height:260px;padding:16px;display:block}
.traitor{color:#ff5a66}.faithful{color:#f4f7ff}
#rolebar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px 18px;background:linear-gradient(transparent,#0a080c 35%);z-index:6}
#rolebar button{background:#1d1722;border:2px solid var(--line);justify-content:center;color:var(--muted);font-size:16px;min-height:52px;touch-action:none}
#peek{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
#peek.on{display:flex}
.chip{display:inline-block;font:800 14px Inter;padding:4px 10px;border-radius:999px;background:#2a2433;color:#d9d2ff;margin-left:6px}
.small{font-size:14px;color:var(--muted);text-align:center}
.hide{display:none!important}
</style>
</head>
<body>
<header><b>THE BETRAYAL</b><span id="hdr"></span></header>
<div id="net" class="hide"></div>
<main id="m"></main>
<div id="rolebar" class="hide"><button id="rolebtn">👁 Press and hold to see your role</button></div>
<div id="peek"></div>
<script src="lib/relay.js"></script>
<script src="lib/peerjs.min.js"></script>
<script>
/* The phone: joins the CAVE game over a direct peer link (PeerJS), shows the player's secret role, takes answers, votes and night choices.
   ?r=CODE room code · ?local = same-browser test link (BroadcastChannel) · ?pid= override (testing) · ?peer=host:port own PeerJS server */
const QS=new URLSearchParams(location.search);
const ROOM=(QS.get('r')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
const LOCAL=QS.has('local');
const RELAY=(QS.get('relay')||window.RELAY||'').replace(/\/$/,''),USE_RELAY=!!RELAY&&!QS.has('p2p')&&!LOCAL;
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let PID=QS.get('pid')||LS.get('btrl_pid');if(!PID){PID='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);LS.set('btrl_pid',PID)}
const NKEY='btrl_name_'+ROOM+'_'+PID;
const saved=(()=>{try{const o=JSON.parse(LS.get(NKEY)||'null');return o&&Date.now()-o.t<4*3600e3?o.n:''}catch(e){return ''}})();if(!saved)LS.del(NKEY);
let NAME=saved,V=null,joined=false,linked=false,conn=null,peer=null,bc=null,qEnd=0,heldRole=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'£'+Math.round(v||0).toLocaleString('en-GB');
const ZONE={A:['#0072B2','●',''],B:['#E69F00','▲','dark'],C:['#CC79A7','■','dark'],D:['#56B4E9','★','dark']};

/* ---------- link ---------- */
function peerOpts(){const p=QS.get('peer');if(!p)return {debug:0};const [host,port]=p.split(':');return {host,port:+port||443,path:'/',secure:!/^(localhost|127\.)/.test(host),debug:0}}
function setNet(t){$('net').textContent=t||'';$('net').classList.toggle('hide',!t)}
function connect(){if(!ROOM){render();return}
  if(LOCAL){bc=new BroadcastChannel('betrayal-'+ROOM);bc.onmessage=e=>{const m=e.data;if(m&&m.to===PID)onMsg(m.data)};linked=true;hello();return}
  if(USE_RELAY){relayConnect();return}
  if(!window.Peer){setNet('Could not load the game link. Refresh the page.');return}
  setNet('Connecting to the castle…');
  peer=new Peer(peerOpts());
  peer.on('open',openConn);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{linked=false;if(e.type==='peer-unavailable')setNet(`Room ${ROOM} not found. Check the code on the wall – trying again…`);else setNet('Connection problem – trying again…');retry(3000)})}
function openConn(){try{conn&&conn.close()}catch(e){}
  conn=peer.connect('btrl-'+ROOM.toLowerCase(),{reliable:true});
  conn.on('open',()=>{linked=true;setNet('');hello()});
  conn.on('data',onMsg);
  conn.on('close',()=>{linked=false;setNet('Reconnecting…');retry(1500)});
  conn.on('error',()=>{linked=false;retry(2000)})}
let ws=null,nhT=0;
function relayConnect(){const cid=PID+'.'+Math.random().toString(36).slice(2,7);setNet('Connecting to the castle…');
  const w=new WebSocket(RELAY+'/room/'+ROOM+'?role=phone&id='+encodeURIComponent(cid));ws=w;
  w.onopen=()=>{linked=true;setNet('');hello()};
  w.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(x){return}
    if(d&&d.sys){if(d.sys==='nohost'||d.sys==='hostgone'){setNet(`Waiting for the CAVE… (room ${ROOM} – check the code on the wall)`);clearTimeout(nhT);nhT=setTimeout(hello,3000)}return}
    clearTimeout(nhT);setNet('');onMsg(d)};
  w.onclose=()=>{if(ws!==w)return;linked=false;setNet('Reconnecting…');retry(1500)};w.onerror=()=>{}}
let rT=0;function retry(ms){clearTimeout(rT);rT=setTimeout(()=>{if(linked)return;if(USE_RELAY){relayConnect();return}
  if(peer&&!peer.destroyed&&!peer.disconnected&&peer.open)openConn();else{try{peer&&peer.destroy()}catch(e){}peer=null;connect()}},ms)}
function send(d){if(LOCAL){bc&&bc.postMessage({to:'host',from:PID,data:d});return}
  if(USE_RELAY){if(ws&&ws.readyState===1)try{ws.send(JSON.stringify(d))}catch(e){}return}if(conn&&conn.open)try{conn.send(d)}catch(e){}}
function hello(){if(NAME)send({t:'hello',pid:PID,name:NAME});render()}
setInterval(()=>{if(linked&&joined)send({t:'ping',pid:PID})},8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!LOCAL&&!linked)retry(100)});
function onMsg(d){if(!d||typeof d!=='object')return;
  if(d.s==='cleared'){NAME='';LS.del(NKEY);joined=false;V={s:'msg',title:'Game over',msg:'Thanks for playing. Your name has been deleted from this game. You can close this page.'};$('hdr').textContent='';render();return}
  if(d.s==='kicked'){NAME='';LS.del(NKEY);joined=false;V={s:'msg',title:'Removed',msg:'The tutor removed you. Join again with your first name.'};render();return}
  joined=true;V=d;if(d.s==='q'&&!d.locked)qEnd=Date.now()+(d.left||0)*1000;render()}
function act(d){send(Object.assign({pid:PID},d));if(navigator.vibrate)try{navigator.vibrate(25)}catch(e){}}

/* ---------- role peek (press and hold, so a neighbour can't read it over your shoulder) ---------- */
function roleHTML(){const m=V&&V.me;if(!m||!m.role)return '<h1>No role yet</h1>';const T=m.role==='T';
  return `<div class="big ${T?'traitor':'faithful'}" style="font-size:56px">${T?'🗡 TRAITOR':'🛡 FAITHFUL'}</div>
    <p style="color:#fff;font-size:20px">${T?'Keep your secret. Get questions WRONG – and trick the Faithful into getting them wrong too. If fewer than half get a question right, you get an extra dagger. Survive to the end to win.':'Get questions right, find the Traitors, and vote them out.'}</p>
    ${T?`<div class="box">${m.mates.length?'Your fellow Traitors: <b>'+m.mates.map(esc).join(', ')+'</b>':'You are the only Traitor.'}</div>`:''}<p class="small">Let go to hide this.</p>`}
function holdable(el,onDown,onUp){const dn=e=>{e.preventDefault();onDown()},up=e=>{e.preventDefault();onUp()};
  el.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,up));el.addEventListener('contextmenu',e=>e.preventDefault())}
holdable($('rolebtn'),()=>{$('peek').innerHTML=roleHTML();$('peek').classList.add('on')},()=>$('peek').classList.remove('on'));

/* ---------- screens ---------- */
function opt(o,picked,cb,dis){const z=ZONE[o.L]||['#555','◆',''];
  return `<button class="opt${picked===o.L?' on':''}" ${dis?'disabled':''} data-cb="${cb}" data-v="${o.L}"><span class="L ${z[2]}" style="background:${z[0]}">${z[1]}${o.L}</span><span>${esc(o.text)}</span></button>`}
function names(list,picked,cb){return list.map(c=>`<button class="${picked===c.pid?'on':''}" data-cb="${cb}" data-v="${esc(c.pid)}">${picked===c.pid?'✓ ':''}${esc(c.name)}</button>`).join('')||'<p>Nobody to choose.</p>'}
function render(){const m=$('m');const me=V&&V.me;
  $('hdr').innerHTML=me?`${esc(me.name)}${me.out?'<span class="chip">👻 ghost</span>':''}${me.poisoned?'<span class="chip">☠ poisoned</span>':''}${me.shield?'<span class="chip">🛡 shield</span>':''}`:(ROOM?'Room '+ROOM:'');
  $('rolebar').classList.toggle('hide',!(me&&me.role&&V.s!=='role'&&V.s!=='end'));
  if(!ROOM){m.innerHTML=`<h1>Join the game</h1><p>Type the room code shown on the wall.</p><input id="code" maxlength="4" autocapitalize="characters" placeholder="CODE"><button class="gold" id="go">Next ›</button>`;
    $('go').onclick=()=>{const c=$('code').value.toUpperCase().replace(/[^A-Z]/g,'');if(c.length===4)location.search='?r='+c+(LOCAL?'&local':'')};return}
  if(!NAME){m.innerHTML=`<h1>Welcome to the castle</h1><p>Type your <b>real first name</b> and the first letter of your surname, so everyone knows who you are.</p><input id="nm" maxlength="16" placeholder="e.g. Sam K" autocomplete="off"><button class="gold" id="go">Join the game ›</button><p class="small">🔒 Only used for this game.</p><p class="small">Room ${ROOM}</p>`;
    const go=()=>{const n=$('nm').value.replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16);if(n.length<2){$('nm').focus();return}NAME=n;LS.set(NKEY,JSON.stringify({n,t:Date.now()}));try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}hello()};
    $('go').onclick=go;$('nm').onkeydown=e=>{if(e.key==='Enter')go()};return}
  if(!joined||!V){m.innerHTML=`<h1>Joining…</h1><p>Hang on, ${esc(NAME)}.</p>`;return}
  const s=V.s;let h='';
  if(s==='lobby')h=`<h1>You're in, ${esc(me.name)}!</h1><p>${V.n} player${V.n===1?'':'s'} in the castle.</p><div class="box">Keep this page open. When the game starts you'll find out – secretly – if you are <b class="faithful">Faithful</b> or a <b class="traitor">Traitor</b>.</div><p>Look up at the walls.</p><button class="alt" data-cb="rename">Wrong name? Change it</button>`;
  else if(s==='role'){h=`<h1>Who are you?</h1><p>Hide your screen from everyone around you.</p><div class="hold" id="hold">👁<br>Press and hold here</div>`+(V.seen?`<div class="box" style="text-align:center">Got it. Keep it secret.<br>Put your phone down and look up.</div>`:`<button class="go" data-cb="seen" ${heldRole?'':'disabled'}>I've seen it ✓</button>`)}
  else if(s==='q'){const left=Math.max(0,Math.ceil((qEnd-Date.now())/1000));
    h=`<div class="qh"><span>Question ${V.qn} of ${V.of}</span><span id="clock" class="${left<=10?'low':''}">${V.locked?'🔒':left+'s'}</span></div><div class="q">${esc(V.text)}</div>${V.opts.map(o=>opt(o,V.picked,'ans',V.locked)).join('')}
      <p class="small">${V.locked?'Answers locked.':V.picked?'Answer saved – you can change it until the clock runs out.':'Talk it through… but who can you trust?'}</p>${me.out?'<p class="small">👻 Ghost answers still grow the pot.</p>':''}`}
  else if(s==='self')h=`<h1>The answer</h1><div class="q">${esc(V.text)}</div><div class="box"><b class="ok">✓ ${esc(V.ans)}</b>${V.exp?'<br>'+esc(V.exp):''}</div>`+(V.done==null?`<p>Did you get it right? Be honest.</p><div class="two"><button class="go" data-cb="self" data-v="1">✓ I got it</button><button class="no" data-cb="self" data-v="0">✗ I didn't</button></div>`:`<p>Thanks – marked ${V.done?'✓':'✗'}.</p>`);
  else if(s==='qres')h=(V.ok==null?'<h1>Answer revealed</h1>':`<div class="big ${V.ok?'ok':'bad'}">${V.ok?'✓ Right':'✗ Wrong'}</div>`)+
      `<div class="box"><b class="ok">Answer: ${esc(V.ans)}</b>${V.exp?'<br>'+esc(V.exp):''}</div><p>You have <b style="color:var(--gold2)">${V.score} right</b> · leaderboard place <b style="color:var(--gold2)">${V.rank} of ${V.of}</b></p>${V.dagger?`<div class="box bad">🗡 ${esc(V.dagger)}</div>`:''}`;
  else if(s==='vote')h=`<h1>${V.revote?'Revote':'Vote to banish'}</h1><p>${V.revote?'Only the tied players can be chosen.':'Who do you think is a Traitor?'} You can change your vote until it closes.</p>${names(V.cands,V.picked,'vote')}`;
  else if(s==='nightT'){const mine=V.mine||[];
    h=`<h1>Night falls</h1><p>Choose <b style="color:#fff">${V.n>1?V.n+' victims':'your victim'}</b> to murder.${V.shield?` ${esc(V.shield)} has the 🛡 shield.`:''}</p>
      <p class="small">🗡 You have ${V.n} dagger${V.n>1?'s':''} tonight. Tap a name to choose${V.n>1?' – tap again to undo':''}.</p>${V.cands.map(c=>`<button class="${mine.includes(c.pid)?'on':''}" data-cb="night" data-v="${esc(c.pid)}">${mine.includes(c.pid)?'🗡 ':''}${esc(c.name)}</button>`).join('')||'<p>Nobody to choose.</p>'}
      ${V.mates.length?`<div class="box">${V.mates.map(t=>`${esc(t.name)}: ${t.picks.length?'🗡 '+t.picks.map(esc).join(', '):'choosing…'}`).join('<br>')}<br><span class="small">Agree on the same victim${V.n>1?'s':''}. If you disagree, the most-picked wins.</span></div>`:''}`}
  else if(s==='nightF'){
    h=`<h1>Night falls</h1><p>Secret poll: who do you suspect?</p><p class="small">Nobody can see your choice. Keep your head down.</p>${names(V.cands,V.picked,'sus')}`}
  else if(s==='recruit')h=`<div class="big traitor" style="font-size:44px">🗡 You have been recruited</div><p style="color:#fff;font-size:20px">The castle has chosen you. <b class="traitor">You are now a Traitor.</b></p><div class="box">From now on: get answers <b>wrong</b>, trick the Faithful, and survive to the end. Tell nobody. Next, you will choose tonight's victim.</div><button class="no" data-cb="recruitok" style="justify-content:center">I understand</button>`;
  else if(s==='endvote')h=`<h1>Is it over?</h1><p>Do you believe every Traitor has gone?</p><button class="go ${V.picked==='end'?'on':''}" data-cb="end" data-v="end">End the game</button><button class="no ${V.picked==='again'?'on':''}" data-cb="end" data-v="again">Banish again</button>`;
  else if(s==='end'){const T=me.role==='T';h=`<div class="big ${V.winner==='faithful'?'faithful':'traitor'}" style="font-size:44px">${V.winner==='faithful'?'🛡 The Faithful win':'🗡 The Traitors win'}</div>
      <p style="color:#fff;font-size:22px">You were ${T?'a <b class="traitor">Traitor</b>':'<b class="faithful">Faithful</b>'} – <b>${V.won?'you WON':'you lost'}</b>.</p><div class="box" style="text-align:center">You answered <b>${V.right} of ${V.total}</b> questions right.</div>${V.rank?`<p>Faithful leaderboard: <b style="color:var(--gold2)">${V.rank} of ${V.of}</b></p>`:''}`}
  else h=`<h1>${esc(V.title||'Look up')}</h1><p>${esc(V.msg||'Watch the walls.')}</p>`;
  m.innerHTML=h;
  m.querySelectorAll('[data-cb]').forEach(b=>b.onclick=()=>cb(b.dataset.cb,b.dataset.v));
  const hd=$('hold');if(hd)holdable(hd,()=>{hd.classList.add('down');hd.innerHTML=roleHTML();heldRole=true},()=>{hd.classList.remove('down');hd.innerHTML='👁<br>Press and hold here';const b=m.querySelector('[data-cb="seen"]');if(b)b.disabled=false})}
let NK=null;
function cb(k,v){if(k==='ans'){V.picked=v;act({t:'ans',L:v})}
  else if(k==='seen')act({t:'seen'});
  else if(k==='self'){act({t:'self',ok:v==='1'});V.done=v==='1'}
  else if(k==='vote'){V.picked=v;act({t:'vote',target:v})}
  else if(k==='night'){let m=[...(V.mine||[])];if(m.includes(v))m=m.filter(x=>x!==v);else{m.push(v);if(m.length>V.n)m=m.slice(-V.n)}V.mine=m;act({t:'night',targets:m})}
  else if(k==='sus'){V.picked=v;act({t:'night',target:v})}
  else if(k==='end'){V.picked=v;act({t:'end',v})}
  else if(k==='recruitok'){act({t:'night',ack:true})}
  else if(k==='rename'){NAME='';LS.del(NKEY)}
  render()}
setInterval(()=>{const c=$('clock');if(c&&V&&V.s==='q'&&!V.locked){const left=Math.max(0,Math.ceil((qEnd-Date.now())/1000));c.textContent=left+'s';c.classList.toggle('low',left<=10)}},250);
render();connect();
</script>
</body>
</html>
