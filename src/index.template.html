<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Betrayal – Igloo CAVE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#D9B45A;--gold2:#F3D98B;--blood:#B3202F;--silver:#D7DEE8;--ink:#07060a;--glass:rgba(16,12,18,.88);--line:rgba(217,180,90,.28);--txt:#EEE7DA;--muted:#A79F93}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Inter',Arial,sans-serif;color:var(--txt)}
#stage{position:absolute;left:0;top:0;width:12566px;height:4516px;transform-origin:0 0}
.cin{font-family:'Cinzel',Georgia,serif}
#hall{position:absolute;left:0;top:0;width:12566px;height:1080px}
#floor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;overflow:hidden;background:#050407}
#floorcv{position:absolute;left:0;top:0;width:2847px;height:3436px}
.candle{position:absolute;width:26px;height:90px;background:linear-gradient(#efe4cf,#b9a98c);border-radius:6px 6px 3px 3px;z-index:3}
.candle::before{content:'';position:absolute;left:3px;top:-46px;width:20px;height:44px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#fff6c9,#ffb43a 55%,rgba(255,120,0,0) 72%);animation:flick 1.6s infinite alternate}
.candle::after{content:'';position:absolute;left:-140px;top:-200px;width:306px;height:306px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,70,.22),rgba(255,140,40,0) 65%);animation:glow 2.3s infinite alternate;pointer-events:none}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
@keyframes glow{0%{opacity:.7}100%{opacity:1}}
.panel{position:absolute;background:var(--glass);border:3px solid var(--line);border-radius:28px;box-sizing:border-box;padding:26px 34px;overflow:hidden;z-index:4}
.panel h2{margin:0 0 14px;font:800 40px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:4px}
.walltitle{position:absolute;top:34px;height:140px;display:flex;align-items:center;justify-content:center;font:900 96px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:10px;text-shadow:0 0 40px rgba(217,180,90,.35),0 6px 0 #000;z-index:4;text-align:center}
.walltitle small{display:block;font:600 40px Inter,Arial;letter-spacing:2px;color:var(--muted)}
/* houses */
.house{top:200px;width:530px;height:840px;padding:24px;text-align:center}
.house .crest{width:250px;height:280px;margin:0 auto}
.house .crest svg{width:100%;height:100%}
.house .hn{font:800 46px Cinzel,Georgia,serif;margin-top:6px;line-height:1.05}
.house .st{font-size:34px;color:var(--muted);margin-top:10px;min-height:46px}
.house .rec{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.house .rec div{display:flex;justify-content:space-between;font:700 34px Inter,Arial;padding:6px 16px;border-radius:12px;background:rgba(255,255,255,.05)}
.house .rec .y{color:#9FE3B8}.house .rec .n{color:#FF9AA2}
.house.active{border-color:var(--gold);box-shadow:0 0 0 6px var(--gold),0 0 80px rgba(217,180,90,.5)}
.house.shield{border-color:var(--silver);box-shadow:0 0 0 6px var(--silver),0 0 80px rgba(215,222,232,.45)}
.house.empty{opacity:.12}
.badge{display:inline-block;font:800 30px Inter,Arial;padding:6px 16px;border-radius:12px;margin:4px}
.badge.sh{background:var(--silver);color:#111}.badge.po{background:#3a1a40;color:#f0c8ff;border:2px solid #9a5fb0}
.house.ghost .crest{filter:grayscale(1);opacity:.45}
.house .rec i{font-style:normal}.house .rec i.y,.evt i.y{color:#9FE3B8}.house .rec i.n,.evt i.n{color:#FF9AA2}
.evt{display:flex;flex-direction:column;gap:6px;margin-top:6px}.evt div{display:flex;align-items:center;gap:20px;font:600 36px Inter,Arial;padding:2px 16px;border-radius:12px;background:rgba(255,255,255,.04)}.evt div.gh{opacity:.5}
.evt .mini{width:50px;height:56px}.evt .mini svg{width:100%;height:100%}.evt b{width:200px}.evt .marks{width:260px;font-size:44px;letter-spacing:8px}.evt i{font-style:normal}.evt .tot{width:260px;color:var(--muted)}.evt .tag{color:var(--gold2)}.badge.gh{background:#2a2433;color:#d9d2ff;border:2px solid #6c5f8a}
/* front */
#card{left:3476px;top:200px;width:2767px;height:660px;border-color:var(--gold);padding:36px 50px}
#card.flip{animation:flip .55s cubic-bezier(.2,.9,.3,1.15)}
@keyframes flip{0%{transform:perspective(2500px) rotateX(-70deg);opacity:0}100%{transform:none;opacity:1}}
.qh{font:800 34px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:3px;margin-bottom:12px}
.qq{font:700 64px Inter,Arial;line-height:1.15;margin-bottom:22px}
.big{font:900 120px Cinzel,Georgia,serif;line-height:1.05;text-align:center}
.mid{font:700 58px Inter,Arial;line-height:1.25;text-align:center}
.sub{font:600 44px Inter,Arial;line-height:1.3;color:var(--muted);text-align:center;margin-top:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{background:#1d1620;border:3px solid #4a3b44;border-radius:16px;padding:14px 22px;font-size:42px;cursor:pointer;line-height:1.15;display:flex;gap:18px;align-items:center}
.opt b{flex:0 0 auto;font-family:Cinzel,Georgia,serif;color:var(--gold)}
.opt.right{background:#173323;border-color:#9FE3B8}.opt.wrong{background:#3a1218;border-color:#FF9AA2;animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.exp{margin-top:16px;font-size:38px;line-height:1.3;color:var(--muted)}
.oc{display:flex;gap:16px;margin:0 0 18px}.oc span{flex:1;font:700 36px Inter,Arial;padding:10px 18px;border-radius:16px;border:4px solid;text-align:center}
.qclock{float:right;font:800 80px Cinzel,Georgia,serif;color:var(--gold);margin-top:-18px;font-variant-numeric:tabular-nums}
.qclock.low{color:#FF9AA2;animation:bump .5s infinite}
@keyframes bump{30%{transform:scale(1.15)}}
.dock{position:absolute;top:884px;height:180px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px;z-index:6}
.btn{font:800 46px Cinzel,Georgia,serif;border:none;border-radius:18px;padding:0 40px;height:150px;cursor:pointer;background:var(--gold);color:#1a1205;box-shadow:0 6px 0 rgba(0,0,0,.6)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.6)}
.dock.many .btn{font-size:38px;height:96px;padding:0 24px;border-radius:14px}
.btn.go{background:#2E8B57;color:#fff}.btn.no{background:var(--blood);color:#fff}.btn.alt{background:#3E4A7A;color:#fff}.btn.sil{background:var(--silver);color:#111}
.btn.sm{font-size:32px;height:76px;padding:0 24px;border-radius:12px}
.btn .mini{width:60px;height:66px;display:inline-block;vertical-align:middle;margin-right:10px}
.btn .mini svg{width:100%;height:100%}
.starters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.starters div{font:600 40px Inter,Arial;padding:10px 20px;border-radius:16px;border:3px dashed var(--line);color:var(--gold2)}
.ev{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.ev div{font:700 40px Inter,Arial;padding:10px 20px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.ev .mini{width:56px;height:62px}.ev svg{width:100%;height:100%}
/* right + back */
#pot{left:6323px;top:200px;width:1700px;height:840px;text-align:center;padding-top:50px}
#pot .amt{font:900 260px Cinzel,Georgia,serif;color:var(--gold2);text-shadow:0 0 80px rgba(243,217,139,.45);line-height:1.1;font-variant-numeric:tabular-nums}
#pot .amt.bump{animation:bump .7s}
#status{left:8063px;top:200px;width:1616px;height:840px}
.steps{display:flex;flex-direction:column;gap:12px;margin:10px 0 24px}
.steps div{font:800 48px Cinzel,Georgia,serif;color:#5d5560;padding:8px 20px;border-radius:14px}
.steps div.on{color:#1a1205;background:var(--gold)}
.stat{font:600 40px Inter,Arial;margin:8px 0;color:var(--txt)}.stat b{color:var(--gold2)}
#clock{left:9759px;top:200px;width:1360px;height:420px}
#clock .t{font:900 150px Cinzel,Georgia,serif;line-height:1;font-variant-numeric:tabular-nums}
#chron{left:9759px;top:650px;width:1360px;height:390px}
#chron div{font-size:32px;line-height:1.25;padding:7px 0;border-bottom:1px solid var(--line)}
#rules{left:11159px;top:200px;width:1367px;height:840px}
#rules p{font-size:36px;line-height:1.3;margin:0 0 16px}
#rules b{color:var(--gold2)}
/* setup */
#setup{left:3476px;top:186px;width:2767px;height:880px;border-color:var(--gold);z-index:7}
.pick{display:flex;gap:16px;flex-wrap:wrap}
.co{width:240px;height:240px;border-radius:20px;background:#1d1620;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px 14px;box-sizing:border-box;position:relative;border:5px solid transparent;text-align:center}
.co .mini{width:140px;height:156px;margin-bottom:4px}.co .mini svg{width:100%;height:100%}
.co b{font:800 32px Cinzel,Georgia,serif}
.co.on{border-color:var(--gold);background:#2c2214}
.setrow{font-size:38px;margin:14px 0 10px;color:var(--muted)}
.chooser{display:flex;gap:14px;flex-wrap:wrap}
.hide{display:none!important}
/* floor */
#fzones{position:absolute;inset:0;display:grid;gap:24px;padding:24px;box-sizing:border-box;z-index:2}
.fz{border-radius:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px;box-sizing:border-box;color:#fff;border:16px solid rgba(255,255,255,.35);transition:opacity .5s,transform .5s;cursor:pointer;overflow:hidden}
.fz .fl{font:900 520px/1 Cinzel,Georgia,serif;display:flex;align-items:center;gap:60px}
.fz .fl i{font-style:normal;font-size:300px;opacity:.9}
.fz .ft{font:700 130px/1.15 Inter,Arial;margin-top:40px;max-height:900px;overflow:hidden}
.fz.dark{color:#0a0a0a}.fz.right{border:40px solid #fff;transform:scale(1.03);box-shadow:0 0 200px #fff}
.fz.dim{opacity:.15}.fz.picked{opacity:.55;border-style:dashed}
.fz .fv{font:900 200px Cinzel,Georgia,serif;margin-top:30px}
#fbig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3;pointer-events:none;padding:120px;box-sizing:border-box}
#fbig .big{font-size:330px}#fbig .mid{font-size:150px}
#fbig .crestbig{width:1300px;height:1450px}#fbig .crestbig svg{width:100%;height:100%}
/* night / dark overlay over the walls */
#dark{position:absolute;left:0;top:0;width:12566px;height:4516px;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s;z-index:20}
#dark.on{opacity:.94}
.night #card,.night .dock,.night #floor,.night #ftitle{z-index:21}
.reveal{position:absolute;top:0;height:1080px;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:30;pointer-events:none;text-align:center}
.reveal .big{font-size:260px;letter-spacing:10px;animation:rv 1.4s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rv{0%{transform:scale(2.4);opacity:0;filter:blur(30px)}100%{transform:none;opacity:1;filter:none}}
.traitor{color:#ff5a66;text-shadow:0 0 90px rgba(255,40,60,.7),0 8px 0 #000}
.faithful{color:#f4f7ff;text-shadow:0 0 90px rgba(200,220,255,.7),0 8px 0 #000}
#banner{position:absolute;left:3436px;top:0;width:2847px;height:1080px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40}
#banner div{font:900 180px Cinzel,Georgia,serif;color:var(--gold2);-webkit-text-stroke:6px #000;paint-order:stroke fill;animation:banner 2.6s ease-out forwards;text-align:center;line-height:1}
@keyframes banner{0%{transform:scale(1.5);opacity:0;letter-spacing:50px}18%{transform:scale(1);opacity:1;letter-spacing:6px}85%{opacity:1}100%{opacity:0}}
.count{font:900 600px Cinzel,Georgia,serif;color:var(--gold2);animation:rv .6s}
/* trailer intro */
#intro{position:absolute;left:0;top:0;width:12566px;height:4516px;z-index:85;pointer-events:none}
.iw{position:absolute;top:0;height:1080px;background:rgba(4,3,6,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:40px;overflow:hidden}
#ifloor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(4,3,6,.6)}
.it{font:900 185px Cinzel,Georgia,serif;color:#fff;line-height:1.08;letter-spacing:4px}.it.gold{color:var(--gold2)}
.is{font:600 62px Inter,Arial;color:var(--muted);margin-top:26px;line-height:1.25}
.in{animation:inz .7s cubic-bezier(.2,.9,.3,1.1)}
@keyframes inz{0%{transform:scale(1.4);opacity:0;filter:blur(24px)}100%{transform:none;opacity:1;filter:none}}
.icrests{display:flex;gap:40px;justify-content:center}.icrests span{width:300px;height:336px;animation:inz .6s both}.icrests svg{width:100%;height:100%}
#ipause{position:absolute;left:5440px;top:960px;pointer-events:auto;z-index:90;width:400px}
#iskip{position:absolute;left:5860px;top:960px;pointer-events:auto;z-index:90}
#ipaused{position:absolute;left:3436px;top:0;width:2847px;height:940px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(3,2,5,.88);z-index:89;font:900 220px Cinzel,Georgia,serif;color:#fff;pointer-events:none}
#ipaused div{font:600 64px Inter,Arial;color:var(--muted);margin-top:20px}
#pending{position:absolute;left:40px;top:1040px;transform:translateY(-100%);width:3356px;z-index:30;display:flex;flex-wrap:wrap;gap:16px 30px;align-items:center;background:#2a1418;border:4px solid #FF9AA2;border-radius:22px;padding:16px 24px;font:700 44px Inter,Arial;color:#fff}
#pending span{display:flex;gap:12px;align-items:center}#pending .btn{height:74px;font-size:34px;padding:0 26px}
#pot .lb{display:flex;flex-direction:column;gap:10px;margin-top:10px}
#pot .lb div{display:flex;gap:24px;align-items:center;font:700 52px Inter,Arial;padding:6px 18px;border-radius:14px;background:rgba(255,255,255,.04)}
#pot .lb div:first-child{background:rgba(217,180,90,.18)}#pot .lb b{width:60px;color:var(--gold2)}#pot .lb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pot .lb i{font-style:normal;color:#9FE3B8}#pot .lb small{font-size:34px;color:var(--muted);width:150px;text-align:right}#pot .lb .out{opacity:.5}
/* v4: players wall, join QR, vote lists */
#players{position:absolute;left:40px;top:200px;width:3356px;height:840px;display:grid;gap:14px;z-index:4;align-content:start}
.pl{background:var(--glass);border:3px solid var(--line);border-radius:20px;padding:8px 20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative;cursor:default}
.pl .nm{font:800 50px Inter,Arial;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:110px;line-height:1.15}
.pl .mk{font:800 40px Inter,Arial;letter-spacing:8px;min-height:44px;color:var(--muted)}
.pl .mk .y{color:#9FE3B8}.pl .mk .n{color:#FF9AA2}.pl .mk .u{color:#6a6270}
.pl .mk small{font:600 30px Inter;letter-spacing:0;color:var(--muted);margin-left:14px}
.pl .tg{position:absolute;right:16px;top:10px;font-size:46px;letter-spacing:4px}
.pl.out{opacity:.4}.pl.out .nm{text-decoration:line-through}
.pl.sh{border-color:var(--silver);box-shadow:0 0 0 5px var(--silver)}
.pl.done{border-color:#9FE3B8;box-shadow:0 0 0 4px #2E8B57}
.pl.off .nm{color:#8d8592}
.pl.kick{cursor:pointer}.pl.kick:hover{border-color:#ff6b75}
.pl .role{font:800 34px Cinzel,Georgia,serif}
.pl.small .nm{font-size:40px}.pl.small .mk{font-size:32px;min-height:34px}.pl.small .tg{font-size:36px}
#noplayers{position:absolute;left:40px;top:200px;width:3356px;height:840px;display:flex;align-items:center;justify-content:center;flex-direction:column;font:700 64px Inter;color:var(--muted);text-align:center;z-index:4}
.qrbox{background:#fff;border-radius:24px;padding:18px;display:inline-block;line-height:0}
.qrbox svg{display:block;width:100%;height:100%}
.joinurl{font:700 40px Inter,Arial;color:var(--gold2);word-break:break-all}
.code{font:900 130px Cinzel,Georgia,serif;color:#fff;letter-spacing:24px;line-height:1}
.vlist{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 30px;margin-top:10px}
.vlist div{font:700 38px Inter,Arial;padding:4px 14px;border-radius:12px;background:rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:inz .5s}
.vlist div b{color:var(--gold2)}
.tally{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:16px}
.tally span{font:800 46px Inter,Arial;padding:10px 24px;border-radius:16px;background:#3a1218;border:3px solid #FF9AA2}
.prog{font:800 64px Inter,Arial;color:var(--gold2);text-align:center;margin-top:16px}
.opt .cnt{margin-left:auto;font:800 40px Inter;color:var(--gold2);white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div id="stage">
  <canvas id="hall" width="3142" height="270"></canvas>
  <div id="floor"><canvas id="floorcv" width="1424" height="1718"></canvas><div id="fzones" class="hide"></div><div id="fbig"></div></div>
  <div id="candles"></div>

  <div class="walltitle" style="left:0;width:3436px" id="ptitle">THE PLAYERS</div>
  <div id="players"></div>

  <div class="walltitle" id="ftitle" style="left:3436px;width:2847px">THE BETRAYAL</div>
  <div class="panel" id="card"></div>
  <div class="dock" id="dockA" style="left:3476px;width:1344px"></div>
  <div class="dock" id="dockB" style="left:4900px;width:1343px"></div>
  <div class="panel" id="setup"></div>

  <div class="walltitle" style="left:6283px;width:3436px">THE LEADERBOARD</div>
  <div class="panel" id="pot"></div>
  <div class="panel" id="status"></div>

  <div class="walltitle" style="left:9719px;width:2847px">THE CASTLE</div>
  <div class="panel" id="clock"></div>
  <div class="panel" id="chron"></div>
  <div class="panel" id="rules"></div>

  <div id="dark"></div>
  <div id="reveals"></div>
  <div id="banner"></div>
  <div id="intro" class="hide"><div class="iw" style="left:0;width:3436px"></div><div class="iw" style="left:3436px;width:2847px"></div><div class="iw" style="left:6283px;width:3436px"></div><div class="iw" style="left:9719px;width:2847px"></div><div id="ifloor"></div>
    <button id="ipause" class="btn sm" onclick="pauseIntro()">❚❚ Pause</button><button id="iskip" class="btn sm alt" onclick="endIntro(true)">Skip intro ›</button><div id="ipaused" class="hide">PAUSED<div>Press ▶ Play to carry on</div></div></div>
</div>
<input type="file" id="file" accept=".xlsx" class="hide">
<script src="lib/relay.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="lib/qrcode.js"></script>
<script>
const SAMPLE = /*__SAMPLE_DATA__*/null;
const WALLS=[{x:0,w:3436},{x:3436,w:2847},{x:6283,w:3436},{x:9719,w:2847}];

/* ---------- state: every student is a player on their own phone ---------- */
let BANK=JSON.parse(JSON.stringify(SAMPLE)),BANKSRC='Built-in sample questions';
const S={phase:'setup',minutes:45,tPick:0,P:{},order:[],round:1,rounds:3,pot:0,traitors:0,daggers:1,used:new Set(),log:[],chron:[],mq:0,q:null,qLeft:0,qT0:0,ans:{},revealed:false,
  actA:[],actB:[],disc:0,discOn:false,paused:false,elapsed:0,final:false,step:'',winner:null,votes:{},among:null,revote:false,night:{},sus:{},nLeft:0,nightRes:null,shield:null,ban:null,
  hidden:[],endv:{},room:'',lastRes:null,daggerEarned:false,cardFn:null,vshown:0};
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'£'+Math.round(v).toLocaleString('en-GB');
const act=(label,fn,cls='')=>({label,fn,cls});
function setActs(a,b){S.actA=a||[];S.actB=b||[]}
function chron(t){S.chron.unshift(t);S.chron=S.chron.slice(0,14)}
const potStep=()=>+BANK.settings.pot||100;
const roundsFor=m=>Math.max(1,Math.round((m-6)/12));

  peer.on('open',()=>{NET.ok=true;NET.err='';render()});

function qrSVG(text){try{const q=qrcode(0,'M');q.addData(text);q.make();let s=q.createSvgTag({cellSize:4,margin:0});const n=q.getModuleCount()*4;

/* ---------- what each phone shows: the CAVE sends every player their own screen ---------- */
function me(p){return {name:p.name,role:p.role,out:p.out,shield:S.shield===p.pid,

function sync(only){(only?[only]:players()).forEach(p=>{if(p.bot)botAct(p);else if(p.cid)send(p.cid,Object.assign(screenFor(p),{me:me(p),phase:S.phase}))})}
/* ---------- test bots (?test): pretend players so one person can try a whole game ---------- */
const TESTMODE=QSP.has('test'),BOTN=['Ash','Bree','Cole','Dot','Elm','Fern','Gus','Hope'];
function addBots(k){for(let i=0;i<k&&S.order.length<40;i++){const pid='bot'+Math.random().toString(36).slice(2,8);
  const p={pid,name:uniqueName('🤖 '+BOTN[S.order.filter(id=>S.P[id].bot).length%BOTN.length]),role:'',out:false,how:'',poisoned:false,seen:false,rec:[],online:true,cid:null,bot:true};S.P[pid]=p;S.order.push(pid)}render();sync()}
function botAct(p){const ph=S.phase,key=ph+':'+S.round+':'+S.mq+':'+(S.among?'r':'');if(p.botKey===key)return;p.botKey=key;
  const later=(f,a=1200,b=4500)=>setTimeout(()=>{if(S.phase===ph&&S.P[p.pid])f()},a+Math.random()*(b-a));const pick=a=>a[rnd(a.length)];
  if(ph==='roles')later(()=>{if(!p.seen){p.seen=true;render();autoCheck()}});
  else if(ph==='question'&&S.q.opts.length)later(()=>answer(p,p.role==='T'?pick(S.q.opts.filter(o=>o.L!==S.q.ans)).L:Math.random()<.6?S.q.ans:pick(S.q.opts).L),2000,9000);
  else if(ph==='self')later(()=>selfMark(p,p.role!=='T'&&Math.random()<.6));
  else if(ph==='vote'&&!p.out){const c=voteCands().filter(q=>q!==p);if(c.length)later(()=>castVote(p,pick(c).pid),1500,6000)}
  else if(ph==='night'&&!p.out){if(p.role==='T'){const v=victims();if(v.length){const mate=living().find(q=>q.role==='T'&&q!==p&&S.night[q.pid]);
      later(()=>nightPick(p,{targets:mate?S.night[mate.pid]:[...v].sort(()=>Math.random()-.5).slice(0,S.nightD).map(q=>q.pid)}),2000,6000)}}
    else{const c=living().filter(q=>q!==p);if(c.length)later(()=>nightPick(p,{target:pick(c).pid}),1500,6000)}}
  else if(ph==='endvote'&&!p.out)later(()=>endPick(p,Math.random()<.7?'end':'again'))}
function screenFor(p){const ph=S.phase,W=(title,msg)=>({s:'wait',title,msg});

  if(ph==='question'||ph==='lock'){if(!S.q.opts.length)return W('Answer out loud','This question has no options. Work out your answer – you will mark yourself when it is revealed.');
    const a=S.ans[p.pid];return {s:'q',qn:S.mq+1,of:QPER(),text:S.q.q,opts:S.q.opts,picked:a?a.L:null,locked:ph==='lock',left:S.qLeft}}

    if(p.role==='T')return {s:'nightT',cands:victims().map(q=>({pid:q.pid,name:q.name})),n:S.nightD,mine:S.night[p.pid]||[],shield:S.shield&&S.P[S.shield]?S.P[S.shield].name:null,
      mates:living().filter(q=>q.role==='T'&&q!==p).map(q=>({name:q.name,picks:(S.night[q.pid]||[]).map(id=>S.P[id]?S.P[id].name:'?')}))};
    return {s:'nightF',cands:living().filter(q=>q!==p).map(q=>({pid:q.pid,name:q.name})),picked:S.sus[p.pid]||null}}

    roundtable:['The Round Table','Look at the walls. Who got answers wrong? Who is lying? When it is time, you will vote here.'],
    vreveal:['The votes','Look at the walls.'],vtally:['The votes','Look at the walls.'],banish:['Banished…','Look at the centre.'],banished:['Banished…','Look at the walls.'],breakfast:['Good morning','Look at the walls. Who made it through the night?'],finale:['The truth','Look at the walls.']}[ph];

/* ---------- sound: ElevenLabs clips in assets/audio, with built-in fallbacks ---------- */
const SFX=['sfx_gong','sfx_heartbeat','sfx_bell','sfx_drumroll','sfx_traitor','sfx_faithful','sfx_gasp','sfx_door','sfx_wolf','sfx_tick','sfx_correct','sfx_wrong','sfx_scroll','sfx_whoosh'];
const V=(b,n)=>[b].concat(Array.from({length:n-1},(_,i)=>b+'_'+(i+2)));
const HOST={roles:['host_roles'],allopen:['host_all_open'],mission:V('host_mission',2),correct:V('host_correct',2),dagger:V('host_dagger',2),shield:['host_shield'],roundtable:V('host_roundtable',2),
  vote:['host_vote'],votes:['host_votes_in'],stand:['host_stand'],wastraitor:V('host_was_traitor',2),wasfaithful:V('host_was_faithful',2),secret:['host_secret'],night:['host_night'],breakfast:['host_breakfast'],
  murdered:V('host_murdered',2),nomurder:['host_no_murder'],finalrt:['host_final_rt'],endvote:['host_endvote'],revealyou:['host_reveal_yourselves'],tie:['host_tie'],lockin:['host_lockin'],
  faithfulwin:['host_faithful_win'],traitorwin:['host_traitor_win'],outnumber:['host_outnumber']};
const AUD={},OK={};let muted=false,hostNow=null,loopNow={},actx=null;
const INTRO=Array.from({length:11},(_,i)=>'intro_'+(i+1));
[...SFX,...Object.values(HOST).flat(),...INTRO].forEach(k=>{const a=new Audio();a.preload='auto';a.oncanplaythrough=()=>OK[k]=1;a.onerror=()=>OK[k]=0;a.src=`assets/audio/${k}.mp3`;AUD[k]=a});
function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
function beep(freqs,dur=.15,type='sine',vol=.25){if(muted||!ac())return;let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.85})}
const FALLBACK={sfx_gong:()=>beep([98,73],1.6,'sine',.4),sfx_bell:()=>beep([392,196],1.4,'sine',.3),sfx_traitor:()=>beep([147,139,131],.6,'sawtooth',.18),sfx_faithful:()=>beep([294,370,440,587],.35,'triangle',.2),
  sfx_correct:()=>beep([440,554,659],.15,'triangle',.2),sfx_wrong:()=>beep([196,147],.35,'sawtooth',.14),sfx_tick:()=>beep([1200],.04,'square',.08),sfx_scroll:()=>beep([300,500],.08,'sine',.12),sfx_gasp:()=>{},sfx_whoosh:()=>beep([200,600],.12,'sine',.1)};
function talking(){return hostGap||(hostNow&&!hostNow.paused&&!hostNow.ended)}
function play(k,{vol=.8,max=0}={}){if(muted)return null;if(OK[k]!==1){FALLBACK[k]&&FALLBACK[k]();return null}
  if(talking())vol*=.45;const a=AUD[k].cloneNode();a.volume=vol;a.play().catch(()=>{});if(max)setTimeout(()=>a.pause(),max*1000);return a}
function loop(k,on,vol=.6){if(on){if(loopNow[k]||muted)return;if(OK[k]!==1){if(k==='sfx_heartbeat')loopNow[k]=setInterval(()=>beep([60,52],.18,'sine',.35),1000);return}
    const a=AUD[k];a.loop=true;a.volume=vol;a.currentTime=0;a.play().catch(()=>{});loopNow[k]=a}
  else{const a=loopNow[k];if(!a)return;if(typeof a==='number')clearInterval(a);else a.pause();delete loopNow[k]}}
function stopLoops(){Object.keys(loopNow).forEach(k=>loop(k,false))}
/* the host never talks over himself: lines queue; big moments first; stale small comments are dropped */
const RECENT=[],HQ=[];let hostGap=false;
const PRIO={wastraitor:3,wasfaithful:3,faithfulwin:4,traitorwin:4,outnumber:4,murdered:3,roles:3,allopen:3,night:3,breakfast:3,stand:3,vote:3,votes:3,secret:3,endvote:3,revealyou:3,shield:2,roundtable:2,finalrt:3,mission:2,correct:2,dagger:3,nomurder:3,tie:3,lockin:3};
function host(ev,delay=0,chance=1){const list=HOST[ev];if(!list||Math.random()>chance)return;
  setTimeout(()=>{if(muted)return;if(talking()){HQ.push({ev,p:PRIO[ev]||1,t:Date.now()});HQ.sort((a,b)=>b.p-a.p||a.t-b.t);if(HQ.length>3)HQ.length=3;return}sayNow(ev)},delay)}
function sayNow(ev){const list=HOST[ev];let pool=list.filter(k=>OK[k]&&!RECENT.includes(k));if(!pool.length)pool=list.filter(k=>OK[k]);if(!pool.length){nextHost();return}
  const k=pool[rnd(pool.length)];RECENT.push(k);if(RECENT.length>10)RECENT.shift();hostNow=AUD[k];hostNow.currentTime=0;hostNow.volume=1;duck(true);
  hostNow.onended=()=>{duck(false);nextHost()};hostNow.play().catch(()=>nextHost())}
function nextHost(){if(muted){HQ.length=0;return}while(HQ.length){const h=HQ.shift();if(Date.now()-h.t<(h.p>=3?15000:h.p===2?7000:3500)){hostGap=true;setTimeout(()=>{hostGap=false;sayNow(h.ev)},450);return}}}
function hush(){HQ.length=0;hostGap=false;if(hostNow)hostNow.pause()}

/* ---------- music: generative dark castle score (no file needed). Moods: day, tense, night ---------- */
const MUS={on:true,gain:null,bus:null,next:0,step:0,timer:0,base:.22,mood:'day'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[50,53,57,62],[46,50,53,58],[43,46,50,55],[45,49,52,57]]; // Dm  Bb  Gm  A
function startMusic(){if(!MUS.on||muted||MUS.gain||!ac())return;
  MUS.gain=actx.createGain();MUS.gain.gain.value=.0001;MUS.gain.connect(actx.destination);
  MUS.bus=actx.createBiquadFilter();MUS.bus.type='lowpass';MUS.bus.frequency.value=1400;MUS.bus.connect(MUS.gain);
  MUS.gain.gain.setTargetAtTime(MUS.base,actx.currentTime,2);MUS.next=actx.currentTime+.2;MUS.step=0;MUS.timer=setInterval(schedMusic,60)}
function stopMusic(){if(!MUS.gain)return;clearInterval(MUS.timer);const g=MUS.gain;g.gain.setTargetAtTime(.0001,actx.currentTime,.4);setTimeout(()=>g.disconnect(),2000);MUS.gain=null}
function duck(on){if(MUS.gain)MUS.gain.gain.setTargetAtTime(on?MUS.base*.15:MUS.base,actx.currentTime,.4)}
function mood(m){MUS.mood=m;if(MUS.bus)MUS.bus.frequency.setTargetAtTime(m==='tense'?2200:m==='night'?700:1400,actx.currentTime,1)}
function schedMusic(){const beat=1;while(MUS.next<actx.currentTime+.4){musStep(MUS.step,MUS.next);MUS.next+=beat/2;MUS.step++}}
function pad(f,t,dur,vol,type='sawtooth'){const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();o.type=type;o2.type=type;o.frequency.value=f;o2.frequency.value=f;o2.detune.value=9;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.35);g.gain.setTargetAtTime(.0001,t+dur*.7,dur*.25);o.connect(g);o2.connect(g);g.connect(MUS.bus);o.start(t);o2.start(t);o.stop(t+dur*1.6);o2.stop(t+dur*1.6)}
function thud(t,vol,f0=90,f1=38,dur=.5){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MUS.gain);o.start(t);o.stop(t+dur)}
function musStep(s,t){const b=s%16,ch=PROG[Math.floor(s/16)%4],m=MUS.mood;
  if(b===0){ch.forEach((n,i)=>pad(mtof(n),t,8.5,m==='night'?.012:.02,i?'triangle':'sawtooth'));pad(mtof(ch[0]-24),t,8.5,.05,'sine')}

  S.used.clear();const q=qs[rnd(qs.length)];if(q)S.used.add(q.id);return q}

function startVote(){S.discOn=false;S.phase='vote';S.votes={};mood('tense');
  scene({title:S.revote?'THE REVOTE':'THE VOTE',cardFn:()=>{const v=voters(),n=v.filter(p=>S.votes[p.pid]).length;
      return `<div class="big" style="font-size:100px">Vote on your phone.</div><div class="mid" style="margin-top:16px">${S.among?'Revote: only '+S.among.map(id=>nm(S.P[id])).join(' or ')+' can be chosen.':'Who do you vote to banish?'}</div>
      <div class="sub">You can change your vote until it closes. 👻 Ghosts can't vote.</div><div class="prog">Votes in: ${n} of ${v.length}</div>`},
    say:S.revote?null:'vote',mood:'tense',loops:['sfx_heartbeat'],btns:[act('Close the vote now ›',closeVote,'go')]});autoCheck()}
function castVote(p,target){if(S.phase!=='vote'||p.out||p.poisoned||target===p.pid)return;const t=S.P[target];if(!t||!voteCands().includes(t))return;S.votes[p.pid]=target;render();autoCheck()}
function closeVote(){if(S.phase!=='vote')return;S.phase='vreveal';stopLoops();host('votes');S.vshown=0;
  const list=voters().filter(p=>S.votes[p.pid]&&S.P[S.votes[p.pid]]),show=()=>`<div class="qh">How everyone voted</div><div class="vlist" style="grid-template-columns:repeat(${list.length>18?4:3},1fr)">${list.slice(0,S.vshown).map(p=>`<div>${nm(p)} → <b>${nm(S.P[S.votes[p.pid]])}</b></div>`).join('')}</div>`;
  scene({title:'THE VOTES',cardFn:show,mood:'tense',loops:['sfx_drumroll'],btns:[act('Show all ›',()=>{S.vshown=list.length;tally(list)},'alt')]});
  const step=()=>{if(S.phase!=='vreveal')return;if(S.vshown>=list.length){tally(list);return}S.vshown++;play('sfx_bell',{vol:.3});render();setTimeout(step,list.length>16?700:1100)};setTimeout(step,2200)}
function tally(list){if(S.phase!=='vreveal')return;S.phase='vtally';stopLoops();const c={};list.forEach(p=>{const t=S.votes[p.pid];c[t]=(c[t]||0)+1});
  const ranked=Object.entries(c).sort((a,b)=>b[1]-a[1]),top=ranked.length?ranked[0][1]:0,tied=ranked.filter(r=>r[1]===top).map(r=>r[0]);
  const board=`<div class="qh">How everyone voted</div><div class="vlist" style="grid-template-columns:repeat(${list.length>18?4:3},1fr)">${list.map(p=>`<div>${nm(p)} → <b>${nm(S.P[S.votes[p.pid]])}</b></div>`).join('')}</div><div class="tally">${ranked.slice(0,6).map(([id,k])=>`<span>${nm(S.P[id])}: ${k}</span>`).join('')}</div>`;
  if(!top){scene({title:'THE VOTE',card:board+`<div class="mid">No votes were cast.</div>`,next:{label:'Next ›',fn:noBanish}});return}
  if(tied.length>1){if(!S.revote){host('tie');scene({title:'A TIE',card:board+`<div class="mid" style="margin-top:14px">A tie between ${tied.map(id=>nm(S.P[id])).join(' and ')}. Vote again – only they can be chosen.</div>`,
      btns:[act('Revote ›',()=>{S.revote=true;S.among=tied;startVote()},'go')]});return}
    scene({title:'A TIE AGAIN',card:board+`<div class="mid" style="margin-top:14px">Still tied. Nobody is banished.</div>`,next:{label:'Next ›',fn:noBanish}});return}
  scene({title:'THE VOTE',card:board+`<div class="mid" style="margin-top:14px">The most votes: <b style="color:#ff6b75">${nm(S.P[tied[0]])}</b></div>`,btns:[act(`Banish ${nm(S.P[tied[0]])} ›`,()=>banish(tied[0]),'no')]})}
function clearPoison(){players().forEach(p=>p.poisoned=false)}
function noBanish(){clearPoison();S.revote=false;S.among=null;chron('No one was banished.');
  scene({title:'THE VOTE',card:`<div class="big" style="font-size:100px">No decision.</div><div class="mid">Nobody is banished this time.</div>`,mood:'day',next:afterBanishNext()})}
function banish(pid){S.ban=pid;S.phase='banish';const p=S.P[pid];
  if(S.final){scene({title:'BANISHED',card:`<div class="big" style="font-size:110px">${nm(p)}</div><div class="mid" style="margin-top:20px">You have been banished… but this is the final round.</div><div class="sub"><b>Don't say if you are a Traitor or Faithful.</b> The castle keeps your secret until the very end.</div>`,
      floor:`<div class="big">${nm(p)}</div>`,say:'secret',mood:'tense',loops:['sfx_drumroll'],next:{label:'Next ›',fn:revealBan,cls:'go'}});return}
  scene({title:'BANISHED',card:`<div class="big" style="font-size:110px">${nm(p)}</div><div class="mid" style="margin-top:20px">Stand up. Tell everyone… are you a <span style="color:#ff6b75">Traitor</span>… or <span style="color:#f4f7ff">Faithful</span>?</div>`,
    floor:`<div class="big">${nm(p)}</div>`,say:'stand',mood:'tense',loops:['sfx_drumroll'],next:{label:'Reveal the truth ›',fn:revealBan,cls:'go'}})}
function revealBan(){if(S.phase!=='banish')return;const p=S.P[S.ban];S.phase='banished';p.out=true;p.how='banished';S.revote=false;S.among=null;stopLoops();
  if(S.final){p.hidden=true;S.hidden.push(p.pid);chron(`Banished: ${p.name} – role kept secret.`);
    scene({title:'BANISHED',card:`<div class="big" style="font-size:110px">${nm(p)} leaves the castle…</div><div class="mid" style="margin-top:20px">…and takes their secret with them.</div><div class="sub">Traitor or Faithful? You will find out at the very end.</div>`,
      floor:'<div class="big">?</div>',mood:'tense',next:afterBanishNext()});return}
  const isT=p.role==='T';
  if(isT){play('sfx_traitor',{vol:.9});play('sfx_gasp',{vol:.6});host('wastraitor',600);revealAll('🗡 TRAITOR','traitor');chron(`Banished: ${p.name} – a TRAITOR!`)}
  else{play('sfx_faithful',{vol:.9});play('sfx_gasp',{vol:.6});host('wasfaithful',600);revealAll('🛡 FAITHFUL','faithful');chron(`Banished: ${p.name} – Faithful.`)}
  const left=tLeft(),over=left<=0,outn=!over&&left>=fLeft();
  scene({title:isT?'A TRAITOR!':'FAITHFUL…',card:`<div class="big ${isT?'traitor':'faithful'}">${isT?'🗡 TRAITOR':'🛡 FAITHFUL'}</div><div class="mid" style="margin-top:20px">${nm(p)} ${isT?`was a Traitor. ${over?'That was the last one!':`${left} Traitor${left>1?'s':''} still hide${left>1?'':'s'} among you.`}`:'was Faithful. The Traitors are still out there.'}</div><div class="sub">${nm(p)} becomes a 👻 ghost: they still answer questions, but can never vote.</div>`,
    floor:`<div class="big ${isT?'traitor':'faithful'}">${isT?'TRAITOR':'FAITHFUL'}</div>`,mood:'day',
    next:over?{label:'The Traitors are gone ›',fn:()=>winners(true),cls:'go'}:outn?{label:'Next ›',fn:()=>winners(false,'outnumber'),cls:'no'}:afterBanishNext()})}
function afterBanishNext(){return S.final?{label:'Next ›',fn:endVote,cls:'go'}:{label:'Night falls ›',fn:night1,cls:'alt'}}

/* ---------- night: every phone gets a screen, so nobody can spot the Traitors by who is tapping ---------- */
const victims=()=>living().filter(p=>p.role!=='T'&&p.pid!==S.shield);
function traitorsAgree(){const k=living().filter(p=>p.role==='T').map(p=>S.night[p.pid]).filter(Boolean).map(x=>[...x].sort().join('|'));return new Set(k).size<=1}
function night1(){S.phase='night';S.night={};S.sus={};S.nLeft=75;S.nightD=Math.min(S.nightD||1,victims().length)||1;play('sfx_bell',{vol:.7});setTimeout(()=>play('sfx_wolf',{vol:.5}),2500);
  scene({title:'NIGHT',cardFn:()=>{const L=living(),n=L.filter(p=>p.role==='T'?(S.night[p.pid]||[]).length:S.sus[p.pid]).length;
      return `<div class="big">Night falls on the castle.</div><div class="mid" style="margin-top:20px">Heads down. Eyes on your phone.<br>Traitors… choose your victim${S.nightD>1?'s':''}.</div><div class="sub">🗡 The Traitors have <b>${S.nightD}</b> dagger${S.nightD>1?'s':''} tonight. Everyone else: a secret poll – who do you suspect?</div><div class="prog">Choices in: ${n} of ${L.length} · <span id="nclock">${S.nLeft}</span>s</div>`},
    floor:'',say:'night',dark:true,mood:'night',loops:['sfx_heartbeat'],btns:[act('Morning ›',dawn,'alt')]})}
function nightPick(p,d){if(S.phase!=='night'||p.out)return;
  if(p.role==='T'){const ok=new Set(victims().map(q=>q.pid));const t=[...new Set((Array.isArray(d.targets)?d.targets:[d.target]).filter(id=>ok.has(id)))].slice(0,S.nightD);
    if(t.length)S.night[p.pid]=t;else delete S.night[p.pid];living().filter(q=>q.role==='T').forEach(q=>sync(q))}
  else{const t=S.P[d.target];if(!t||t.out||t===p)return;S.sus[p.pid]=t.pid}
  render();autoCheck()}
function dawn(){if(S.phase!=='night')return;const c={};
  Object.values(S.night).forEach(arr=>arr.forEach(id=>{const t=S.P[id];if(t&&!t.out&&id!==S.shield)c[id]=(c[id]||0)+1}));
  const ranked=Object.entries(c).sort((a,b)=>b[1]-a[1]||Math.random()-.5);S.nightRes=ranked.slice(0,S.nightD).map(r=>r[0]);
  const sc={};Object.values(S.sus).forEach(id=>{sc[id]=(sc[id]||0)+1});const sr=Object.entries(sc).sort((a,b)=>b[1]-a[1]);S.suspect=sr.length?{pid:sr[0][0],n:sr[0][1]}:null;
  S.phase='breakfast';play('sfx_door',{vol:.7});
  scene({title:'BREAKFAST',card:`<div class="big">Good morning.</div><div class="mid" style="margin-top:20px">Breakfast is served…</div><div class="mid" style="color:#ff6b75">Let's see who made it through the night.</div>`,say:'breakfast',dark:false,mood:'day',next:{label:'Reveal ›',fn:nightReveal,cls:'go'}})}
function nightReveal(){const V2=(S.nightRes||[]).map(id=>S.P[id]).filter(p=>p&&!p.out);
  const sus=S.suspect&&S.P[S.suspect.pid]?`<div class="sub">Last night's secret poll – most suspected: <b style="color:var(--gold2)">${nm(S.P[S.suspect.pid])}</b> (${S.suspect.n} vote${S.suspect.n>1?'s':''}).</div>`:'';
  if(!V2.length){host('nomurder');chron('Nobody was murdered in the night.');
    scene({title:'A QUIET NIGHT',card:`<div class="big" style="font-size:110px">Everyone survived.</div><div class="mid">The Traitors did not strike… this time.</div>${sus}`,next:{label:'Next mission ›',fn:nextRound,cls:'go'}});return}
  V2.forEach(p=>{p.out=true;p.how='murdered'});play('sfx_gasp',{vol:.8});host('murdered',300);revealAll('🗡 MURDERED','traitor');chron(`Murdered in the night: ${V2.map(p=>p.name).join(' and ')}.`);
  const outn=tLeft()>=fLeft(),names=V2.map(nm).join(' and ');
  scene({title:'MURDERED',card:`<div class="big traitor" style="font-size:${V2.length>1?100:120}px">${names}</div><div class="mid" style="margin-top:14px">${V2.length>1?'were':'was'} murdered in the night.</div><div class="sub">${V2.length>1?'They are':'They are'} now 👻 ghost${V2.length>1?'s':''}: still answering questions, but never voting.</div>${sus}`,floor:`<div class="big traitor">${V2.map(nm).join('<br>')}</div>`,
    next:outn?{label:'Next ›',fn:()=>winners(false,'outnumber'),cls:'no'}:{label:'Next mission ›',fn:nextRound,cls:'go'}})}
function nextRound(){S.round++;startMission()}

/* ---------- the end ---------- */
function endVote(){if(living().length<=2){endGame();return}S.phase='endvote';S.endv={};
  scene({title:'THE END?',cardFn:()=>{const L=living(),n=L.filter(p=>S.endv[p.pid]).length;return `<div class="mid">Do you believe every Traitor is gone?</div><div class="sub" style="font-size:52px;color:var(--txt)">Vote on your phone: <b style="color:var(--gold2)">END THE GAME</b>… or <b style="color:#ff6b75">BANISH AGAIN</b>.</div><div class="sub">If more want to end than banish, the game ends.</div><div class="prog">Votes in: ${n} of ${L.length}</div>`},
    say:'endvote',mood:'tense',btns:[act('Close the vote ›',resolveEnd,'go')]});autoCheck()}
function endPick(p,v){if(S.phase!=='endvote'||p.out||!['end','again'].includes(v))return;S.endv[p.pid]=v;render();autoCheck()}
function resolveEnd(){if(S.phase!=='endvote')return;const v=Object.values(S.endv),e=v.filter(x=>x==='end').length,a=v.length-e;chron(`End vote: ${e} to end, ${a} to banish again.`);
  if(e>=a){endGame();return}S.phase='again';banner('BANISH<br>AGAIN');setTimeout(()=>startRT(true),2600)}
function endGame(){S.phase='finale';stopLoops();S.revi=0;host('revealyou');
  const H=S.hidden.map(id=>S.P[id]).filter(Boolean),card=()=>`<div class="big" style="font-size:100px">The truth.</div>${H.length?`<div class="mid" style="margin-top:14px">The banished in the final round were…</div><div class="tally">${H.slice(0,S.revi).map(p=>`<span style="${p.role==='T'?'':'background:#1d2433;border-color:#f4f7ff'}">${nm(p)}: ${p.role==='T'?'🗡 Traitor':'🛡 Faithful'}</span>`).join('')}</div>`:''}`;
  scene({title:'THE REVEAL',cardFn:card,mood:'tense',loops:['sfx_drumroll'],btns:H.length?[]:[act('Reveal the winners ›',()=>winners(tLeft()<=0),'go')]});
  if(H.length){const step=()=>{if(S.phase!=='finale')return;const p=H[S.revi];S.revi++;play(p.role==='T'?'sfx_traitor':'sfx_faithful',{vol:.8});render();
    if(S.revi<H.length)setTimeout(step,3200);else{stopLoops();setActs([act('Reveal the winners ›',()=>winners(tLeft()<=0),'go')],[]);render()}};setTimeout(step,3000)}}
function winners(faithful,reason){stopLoops();setDark(false);S.phase='end';S.winner=faithful?'faithful':'traitor';const T=players().filter(p=>p.role==='T'),left=tLeft();
  play(faithful?'sfx_faithful':'sfx_traitor',{vol:.9});play('sfx_gong',{vol:.8});host(reason==='outnumber'?'outnumber':faithful?'faithfulwin':'traitorwin',700);
  revealAll(faithful?'THE FAITHFUL WIN':'THE TRAITORS WIN',faithful?'faithful':'traitor');
  chron(faithful?'The Faithful win!':'The Traitors win!');
  const why=faithful?'Every Traitor was found.':reason==='outnumber'?'The Traitors now outnumber the Faithful. The castle is theirs.':`${left} Traitor${left>1?'s':''} stayed hidden to the end.`;
  const top=board(true).slice(0,5);
  scene({title:faithful?'THE FAITHFUL WIN':'THE TRAITORS WIN',card:`<div class="big ${faithful?'faithful':'traitor'}" style="font-size:110px">${faithful?'🛡 The Faithful win':'🗡 The Traitors win'}</div>
    <div class="sub" style="margin-top:6px">${why} The Traitors were: <b style="color:#ff6b75">${T.map(nm).join(', ')}</b>.</div>
    <div class="qh" style="margin-top:20px">🏆 Faithful leaderboard</div><div class="tally">${top.map((r,i)=>`<span style="background:#1d2433;border-color:${i?'#9FE3B8':'var(--gold)'}">${['🥇','🥈','🥉','4.','5.'][i]} ${nm(r.p)} · ${r.ok} right</span>`).join('')||'<span>No right answers</span>'}</div>`,
    floor:`<div class="big ${faithful?'faithful':'traitor'}" style="font-size:260px">${faithful?'FAITHFUL':'TRAITORS'}<br>WIN</div>`,mood:'day',
    btns:[act('Most-missed questions',toggleReview,'alt'),act('Export results',exportCSV,'alt'),act('Play again',newGame,''),act('Finish & delete names',finishClear,'no')]})}
/* end of session: tell every phone to forget its name, then wipe all players, answers and the log from this page */
function finishClear(){if(S.log.length&&!S.exported&&!S.clearArm){S.clearArm=true;banner('NOT EXPORTED<br>TAP AGAIN TO DELETE');setTimeout(()=>S.clearArm=false,6000);return}
  players().forEach(p=>send(p.cid,{s:'cleared'}));S.P={};S.order=[];S.log=[];S.chron=[];S.hidden=[];S.exported=false;S.clearArm=false;newGame();chron('Names and answers deleted.');render()}
function missedList(){const n={};S.log.forEach(r=>{if(r.correct==='No'&&r.qid!=='none')n[r.qid]=(n[r.qid]||0)+1});
  return Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,c])=>({q:BANK.questions.find(x=>x.id===id),c})).filter(r=>r.q)}
function toggleReview(){const L=missedList();S.cardFn=null;
  $('card').innerHTML=`<div class="qh">Class debrief · the questions most people got wrong</div>`+(L.length?L.map((r,n)=>{const a=r.q.opts.find(o=>o.L===r.q.ans);return `<div style="font-size:38px;line-height:1.25;margin:16px 0"><b style="color:#ff9aa2">${n+1}. (${r.c} wrong)</b> ${esc(r.q.q)}<br><span style="color:#9FE3B8">✓ ${esc(a?a.L+': '+a.text:r.q.ans)}</span></div>`}).join(''):'<div class="mid">No wrong answers. Impressive… or very good Traitors.</div>')}
function newGame(){S.pending={};hush();stopLoops();setDark(false);floorBig('');FL.mode='table';S.phase='setup';S.cardFn=null;S.shield=null;
  players().forEach(p=>Object.assign(p,{role:'',out:false,how:'',poisoned:false,seen:false,rec:[],hidden:false}));
  $('setup').classList.remove('hide');$('ftitle').innerHTML=esc(BANK.settings.name||'THE BETRAYAL').toUpperCase();setActs([],[]);render();sync()}
function exportCSV(){const cols=['time','round','player','role','question','answer','correct'];
  const csv=[cols.join(',')].concat(S.log.map(r=>cols.map(c=>`"${String(r[c]).replace(/"/g,'""')}"`).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`betrayal-results-${new Date().toISOString().slice(0,10)}.csv`;a.click();S.exported=true}
function endNow(){if(['setup','end','finale','roles'].includes(S.phase))return;hush();stopLoops();setDark(false);S.final=true;S.rounds=S.round;startRT()}

/* ---------- timers ---------- */
setInterval(()=>{if(S.paused||S.phase==='setup'||S.phase==='end')return;S.elapsed++;
  if(S.phase==='question'&&S.qLeft>0){S.qLeft--;const c=$('qclock');if(c){c.textContent=S.qLeft+'s';c.classList.toggle('low',S.qLeft<=10)}if(S.qLeft<=5&&S.qLeft>0)play('sfx_tick',{vol:.5});if(S.qLeft===0)lockIn()}
  if(S.phase==='roundtable'&&S.discOn&&S.disc>0){S.disc--;renderDisc();if(S.disc===0){play('sfx_gong',{vol:.8});banner('TIME TO VOTE')}}
  if(S.phase==='night'&&S.nLeft>0){S.nLeft--;const c=$('nclock');if(c)c.textContent=S.nLeft;if(S.nLeft===0)dawn()}
  renderClock()},1000);

function kickTap(pid){if(S.kickArm===pid){S.kickArm=null;kick(pid);return}S.kickArm=pid;render();setTimeout(()=>{if(S.kickArm===pid){S.kickArm=null;render()}},4000)}
/* ---------- rendering ---------- */
const QPH=['question','lock','self','mresult'];
function nameRing(){const L=players();if(S.phase==='setup'||!L.length)return '';const n=L.length,R=n>20?1250:1150,fs=n>24?62:n>14?76:90;
  return '<div data-ring style="position:absolute;inset:0">'+L.map((p,k)=>{const a=k/n*6.283-1.5708,x=1423+Math.cos(a)*R,y=1718+Math.sin(a)*R*1.12;
    const tag=(p.out?'👻':'')+(S.shield===p.pid?'🛡':'');
    return `<div style="position:absolute;left:${x-300}px;top:${y-60}px;width:600px;text-align:center;font:800 ${fs}px Inter,Arial;${p.out?'opacity:.4;text-decoration:line-through;':''}white-space:nowrap;text-shadow:0 4px 0 #000">${tag}${esc(p.name)}</div>`}).join('')+'</div>'}
function tileTags(p){const t=[];if(S.phase==='end'||(p.how==='banished'&&!p.hidden))t.push(p.role==='T'?'🗡':'🛡');if(p.how==='murdered')t.push('☠️');else if(p.out)t.push('👻');
  if(S.shield===p.pid)t.push('🛡');if(!p.online&&!p.bot)t.push('📵');return t.join('')}
function renderPending(){let el=$('pending');const Q=Object.values(S.pending||{});if(!Q.length){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='pending';$('stage').appendChild(el)}
  el.innerHTML=`<b>🔒 Waiting at the door:</b>`+Q.map(q=>`<span>${esc(q.name)} <button class="btn sm go" onclick="admit('${q.pid}')">Let in</button><button class="btn sm no" onclick="refuse('${q.pid}')">No</button></span>`).join('')}
function renderPlayers(){renderPending();const L=players(),n=L.length,el=$('players');$('noplayers')&&$('noplayers').remove();
  $('ptitle').innerHTML=n?`THE PLAYERS <small style="display:inline;margin-left:30px">${living().length} left of ${n}</small>`:'THE PLAYERS';
  if(!n){el.innerHTML='';el.insertAdjacentHTML('afterend','<div id="noplayers">📱 Scan the QR code on the front wall to join.</div>');return}
  const cols=n<=8?4:n<=15?5:n<=24?6:n<=32?8:8,rows=Math.ceil(n/cols),h=Math.floor((840-14*(rows-1))/rows);el.style.gridTemplateColumns=`repeat(${cols},1fr)`;el.style.gridAutoRows=h+'px';
  const ph=S.phase,setup=ph==='setup';
  el.innerHTML=L.map(p=>{const r=roundRec(p),marks=r.map(x=>x.ok?'<i class="y">✓</i>':'<i class="n">✗</i>').join('');const all=p.rec.filter(x=>!x.ghost),pc=all.length?Math.round(all.filter(x=>x.ok).length/all.length*100):null;
    const done=(ph==='question'&&S.ans[p.pid])||(ph==='self'&&S.ans[p.pid])||(ph==='roles'&&p.seen)||(ph==='vote'&&S.votes[p.pid])||(ph==='endvote'&&S.endv[p.pid]);
    const cls=['pl',p.out?'out':'',S.shield===p.pid?'sh':'',done?'done':'',p.online?'':'off',setup?'kick':'',h<150?'small':''].join(' ');
    return `<div class="${cls}" ${setup?`onclick="kickTap('${p.pid}')"`:''}><div class="tg">${tileTags(p)}</div><div class="nm">${esc(p.name)}</div>
      <div class="mk">${setup?`<small style="margin:0;${S.kickArm===p.pid?'color:#ff6b75;font-weight:800':''}">${S.kickArm===p.pid?'tap again to remove':'tap to remove'}</small>`:`${marks}${pc!=null&&h>=150?`<small>${pc}% overall</small>`:''}`}</div></div>`}).join('')}
/* leaderboard: most right answers, then fastest total time on those right answers */
function scoreOf(p){const r=p.rec.filter(x=>x.ok);return {p,ok:r.length,t:r.reduce((s,x)=>s+x.t,0)}}
function board(faithfulOnly){return players().filter(p=>!faithfulOnly||p.role==='F').map(scoreOf).sort((a,b)=>b.ok-a.ok||a.t-b.t)}

function renderStatus(){const steps=['Mission','Round Table','Night','Breakfast'],cur={mission:0,question:0,lock:0,self:0,mresult:0,missionend:0,roundtable:1,vote:1,vreveal:1,vtally:1,banish:1,banished:1,endvote:1,again:1,finale:1,night:2,breakfast:3}[S.phase];
  if(S.phase==='setup'){$('status').innerHTML=`<h2>The game</h2><div class="stat">1. <b>Your phone</b> secretly tells you your role.</div><div class="stat">2. <b>Mission</b> – answer on your phone.</div><div class="stat">3. <b>Round Table</b> – argue, then vote on your phone.</div><div class="stat">4. <b>Night</b> – the Traitors murder.</div><div class="stat">5. Repeat… then the <b>final reveal</b>.</div>`;return}

function renderQ(){if(!S.q||!QPH.includes(S.phase))return;const q=S.q,R=S.lastRes,show=S.phase==='mresult';
  const opts=q.opts.length?`<div class="opts">${q.opts.map(o=>{let c='opt',mark='';if(S.revealed&&o.L===q.ans){c+=' right';mark=' ✓'}const z=ZONE[q.opts.indexOf(o)%4];
    return `<div class="${c}"><b style="color:${z[0]}">${z[1]}${o.L}</b><span>${esc(o.text)}${mark}</span>${show?`<span class="cnt">${R.counts[o.L]||0}</span>`:''}</div>`}).join('')}</div>`:'';
  const ans=S.revealed&&!q.opts.length&&q.ans?`<div class="exp"><b>Answer:</b> ${esc(q.ans)}</div>`:'';const exp=S.revealed&&q.exp?`<div class="exp">${esc(q.exp)}</div>`:'';
  const P=players(),inN=P.filter(p=>S.ans[p.pid]).length;
  const top=S.phase==='question'?`<div class="oc"><span style="border-color:#9FE3B8;color:#9FE3B8">✓ Right answers climb the leaderboard</span><span style="border-color:var(--gold);color:var(--gold2)">📱 Answers in: ${inN} of ${P.length}</span></div>`
    :S.phase==='lock'?`<div class="oc"><span style="border-color:var(--gold);color:var(--gold2)">🔒 Answers locked…</span></div>`
    :S.phase==='self'?`<div class="oc"><span style="border-color:var(--gold);color:var(--gold2)">📱 Mark yourself on your phone – be honest! (${inN} of ${P.length})</span></div>`
    :`<div class="oc"><span style="border-color:#9FE3B8;color:#9FE3B8">✓ ${R.right} of ${R.n} right</span>${S.daggerNow?`<span style="border-color:#FF9AA2;color:#FF9AA2">🗡 Nobody right: the Traitors get an extra dagger tonight</span>`:''}</div>`;
  $('card').innerHTML=`<div class="qh">${S.phase==='question'?`<span class="qclock${S.qLeft<=10?' low':''}" id="qclock">${S.qLeft}s</span>`:''}Question ${Math.min(S.mq+(S.phase==='mresult'?0:1),QPER())} of ${QPER()} · answer on your phone</div>${top}<div class="qq" id="qq">${esc(q.q)}</div>${opts}${ans}${exp}`;
  const el=$('card'),qq=$('qq');let f=64;qq.style.fontSize=f+'px';while(el.scrollHeight>el.clientHeight&&f>36){f-=3;qq.style.fontSize=f+'px'}}
const ZONE=[['#0072B2','●',''],['#E69F00','▲','dark'],['#CC79A7','■','dark'],['#56B4E9','★','dark']];
function renderFloorQ(){const el=$('fzones'),q=S.q,on=q&&q.opts&&q.opts.length&&QPH.includes(S.phase);
  if(!on){el.className='hide';el.innerHTML='';if(FL.mode==='zones')FL.mode='table';return}FL.mode='zones';
  const n=q.opts.length;el.className='';el.style.gridTemplateColumns=n===4?'1fr 1fr':`repeat(${n},1fr)`;el.style.gridTemplateRows=n===4?'1fr 1fr':'1fr';
  el.innerHTML=q.opts.map((o,k)=>{const [c,sh,d]=ZONE[k%4];let cls='fz '+d,v='';if(S.revealed&&S.phase==='mresult'){if(o.L===q.ans){cls+=' right';v='<div class="fv">✓ CORRECT</div>'}else cls+=' dim'}
    return `<div class="${cls}" style="background:${c}"><div class="fl"><i>${sh}</i>${o.L}</div><div class="ft">${esc(o.text)}</div>${v}</div>`}).join('');
  el.querySelectorAll('.fz').forEach(z=>{const t=z.querySelector('.ft');let f=130;t.style.fontSize=f+'px';while(t.scrollHeight>t.clientHeight+2&&f>60){f-=8;t.style.fontSize=f+'px'}})}
function renderDock(id,acts){const el=$(id);el.classList.toggle('many',acts.length>3);
  el.innerHTML=acts.map((a,n)=>`<button class="btn ${a.cls}" data-n="${n}">${a.label}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=acts[+b.dataset.n];if(a&&a.fn){play('sfx_whoosh',{vol:.25});a.fn()}})}
function renderSetup(){if(S.phase!=='setup')return;autoCfg();const n=S.order.length,url=S.room?joinURL():'',auto=autoT(n);
  $('setup').innerHTML=`<h2 style="font-size:60px">${esc(BANK.settings.name||'The Betrayal')} · join on your phone</h2>
   <div style="display:flex;gap:50px;align-items:flex-start">
    <div class="qrbox" style="width:470px;height:470px;flex:0 0 auto">${url&&(NET.ok||LOCAL)?qrSVG(url):''}</div>

     <div class="setrow" style="margin-top:0">1. Scan the code with your phone camera (or go to the address below).<br>2. Type your first name and the first letter of your surname.</div>

     <div style="display:flex;gap:50px;margin-top:10px"><div><div class="setrow">Traitors</div><div class="chooser"><button class="btn sm ${S.tPick===0?'go':''}" style="height:90px;font-size:38px" onclick="S.tPick=0;render()">Auto (${auto})</button>${[1,2,3,4].map(k=>`<button class="btn sm ${k===S.tPick?'go':''}" style="width:100px;height:90px;font-size:46px" onclick="S.tPick=${k};render()">${k}</button>`).join('')}</div></div>
</div>
     <div style="display:flex;gap:44px;margin-top:6px;align-items:flex-end"><div><div class="setrow">Rounds</div><div class="chooser" style="align-items:center"><button class="btn sm alt" style="width:90px;height:90px;font-size:50px" onclick="cfgStep('rounds',-1)">−</button><b style="font:800 60px Inter;min-width:110px;text-align:center">${S.cfg.rounds}</b><button class="btn sm alt" style="width:90px;height:90px;font-size:50px" onclick="cfgStep('rounds',1)">+</button></div></div><div><div class="setrow">Questions / round</div><div class="chooser" style="align-items:center"><button class="btn sm alt" style="width:90px;height:90px;font-size:50px" onclick="cfgStep('qper',-1)">−</button><b style="font:800 60px Inter;min-width:110px;text-align:center">${S.cfg.qper}</b><button class="btn sm alt" style="width:90px;height:90px;font-size:50px" onclick="cfgStep('qper',1)">+</button></div></div><div><div class="setrow">Round Table</div><div class="chooser" style="align-items:center"><button class="btn sm alt" style="width:90px;height:90px;font-size:50px" onclick="cfgStep('disc',-1)">−</button><b style="font:800 60px Inter;min-width:110px;text-align:center">${S.cfg.disc}m</b><button class="btn sm alt" style="width:90px;height:90px;font-size:50px" onclick="cfgStep('disc',1)">+</button></div></div><div style="font:800 48px Inter;color:var(--gold2);padding-bottom:14px">≈ ${estMins()} min<div style="font:600 28px Inter;color:var(--muted)">${S.cfg.auto?'set for '+n+' players':'custom'}</div></div></div></div>

   <button class="btn alt sm" style="height:90px" onclick="$('file').click()">Load Excel questions</button>${TESTMODE?`<button class="btn sm" style="height:90px;background:#6b4fa0" onclick="addBots(3)">+ 3 test bots 🤖</button>`:''}<span style="font-size:30px;color:var(--muted)">${esc(BANKSRC)} · ${BANK.questions.length} questions</span></div>
   <div style="position:absolute;left:30px;bottom:16px;font-size:26px;color:var(--muted)">🔒 Names stay on this computer only and are deleted with <b>Finish &amp; delete names</b> (or by closing this page).</div><div style="position:absolute;right:30px;bottom:16px;font-size:26px;color:var(--muted)">Version 5.0</div>`;
  if(n>=MIN_PLAYERS||!url||!(NET.ok||LOCAL))floorBig('');else floorBig(`<div class="qrbox" style="width:1500px;height:1500px">${qrSVG(url)}</div><div class="code" style="font-size:260px;margin-top:80px">${esc(S.room)}</div><div class="mid" style="margin-top:40px">📱 Scan to join</div>`)}
function render(){renderSetup();renderPlayers();renderPot();renderStatus();renderClock();renderChron();renderRules();renderFloorQ();
  if(QPH.includes(S.phase))renderQ();else if(S.cardFn)$('card').innerHTML=S.cardFn();
  if(S.phase==='roundtable')renderDisc();
  if(S.phase!=='setup'&&!QPH.includes(S.phase)&&FL.mode!=='night'&&(!$('fbig').innerHTML||$('fbig').innerHTML.includes('data-ring')))floorBig(nameRing());

function toggleSound(){muted=!muted;if(muted){hush();stopLoops();stopMusic()}else startMusic();render()}

/* ---------- Excel loading (same format as the Monopoly-style game) ---------- */
async function unzip(buf){const d=new DataView(buf),u8=new Uint8Array(buf),files={};let e=buf.byteLength-22;
  while(e>=0&&d.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Not an Excel file');
  let p=d.getUint32(e+16,true);const n=d.getUint16(e+10,true);const td=new TextDecoder();
  for(let k=0;k<n;k++){const method=d.getUint16(p+10,true),cs=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),xl=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),off=d.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;const ds=off+30+d.getUint16(off+26,true)+d.getUint16(off+28,true);files[name]={method,raw:u8.slice(ds,ds+cs)}}
  return async name=>{const f=files[name];if(!f)return null;if(f.method===0)return new TextDecoder().decode(f.raw);
    const s=new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()}}
async function readXlsx(buf){const get=await unzip(buf),X=t=>new DOMParser().parseFromString(t,'application/xml');
  const wb=X(await get('xl/workbook.xml')),rels=X(await get('xl/_rels/workbook.xml.rels'));const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const ssx=await get('xl/sharedStrings.xml');const ss=ssx?[...X(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};const out={};
  for(const sh of wb.getElementsByTagName('sheet')){let t=relMap[sh.getAttribute('r:id')]||'';t=t.startsWith('/')?t.slice(1):'xl/'+t;const x=await get(t);if(!x)continue;const grid=[];
    for(const row of X(x).getElementsByTagName('row')){const r=[];for(const c of row.getElementsByTagName('c')){const ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
      if(ty==='s'&&v)val=ss[+v.textContent]||'';else if(ty==='inlineStr')val=[...c.getElementsByTagName('t')].map(z=>z.textContent).join('');else if(v)val=v.textContent;r[col(c.getAttribute('r'))]=val}
      grid[(+row.getAttribute('r')||grid.length+1)-1]=r}
    const head=(grid[0]||[]).map(h=>String(h||'').trim());out[sh.getAttribute('name').trim().toLowerCase()]=grid.slice(1).filter(Boolean).map(r=>{const o={};head.forEach((h,i)=>{if(h)o[h]=r[i]==null?'':r[i]});return o})}
  return out}
function parseWorkbook(sheets){const get=n=>sheets[n]||[];const out=JSON.parse(JSON.stringify(SAMPLE));
  get('settings').forEach(r=>{const k=String(r.Setting||'').trim().toLowerCase(),v=r.Value;if(k==='game name'&&String(v).trim())out.settings.name=String(v).trim();if(k==='pot per correct answer')out.settings.pot=+v||100;if(k==='discussion minutes')out.settings.discuss=+v||3;if(k==='questions per mission')out.settings.qper=+v||3;if(k==='seconds per question')out.settings.secs=+v||45});
  const qs=get('questions').filter(r=>String(r.Question||'').trim()).map((r,n)=>{const opts=['A','B','C','D'].map(L=>({L,text:String(r['Option '+L]||'').trim()})).filter(o=>o.text);
    let ans=String(r.Answer||'').trim();if(opts.length&&/^[a-d]$/i.test(ans))ans=ans.toUpperCase();return {id:'x'+n,topic:String(r.Topic||'ANY').trim().toUpperCase()||'ANY',level:parseInt(r.Level)||1,q:String(r.Question).trim(),opts,ans,exp:String(r.Explanation||'').trim()}});
  if(qs.length)out.questions=qs;return out}
async function useWorkbook(buf,src){try{BANK=parseWorkbook(await readXlsx(buf));BANKSRC=src;render()}catch(e){console.warn(e);BANKSRC='Could not read that file (is it .xlsx?). Still using the previous questions.';render()}}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>useWorkbook(r.result,'Loaded: '+f.name);r.readAsArrayBuffer(f);e.target.value=''};
(function autoLoad(){if(!/^https?:/.test(location.protocol))return;const url=new URLSearchParams(location.search).get('q')||'questions.xlsx';
  fetch(url,{cache:'no-store'}).then(r=>r.ok?r.arrayBuffer():null).then(b=>{if(b&&S.phase==='setup')useWorkbook(b,'Loaded from '+url.split('/').pop())}).catch(()=>{})})();

let CAL={sy:1,oy:0};try{Object.assign(CAL,JSON.parse(localStorage.getItem('cal2')||'{}'))}catch(e){}
function scaleStage(){const q=new URLSearchParams(location.search);let sx=innerWidth/12566,sy=sx;if(q.has('native'))sx=sy=1;else if(q.has('preview'))sx=sy=Math.min(innerWidth/12566,innerHeight/4516);

function toggleGrid(){let g=$('calib');if(g){g.remove();$('calpanel').remove();return}g=document.createElement('div');g.id='calib';g.style.cssText='position:absolute;left:0;top:0;width:12566px;height:4516px;z-index:999;pointer-events:none';

  const B=(t,f)=>`<button class="btn" style="font-size:64px;height:170px;margin:12px" onclick="${f}">${t}</button>`;
  c.innerHTML=`<div style="font-size:80px;font-weight:600;color:#ffd23f">Alignment</div><div>The pink line should sit where the walls meet the floor.</div><div id="calread" style="margin:24px 0;color:#cfd8ff"></div><div>Wall height</div>${B('Taller +','setCal(.005,0)')}${B('Shorter −','setCal(-.005,0)')}<div style="margin-top:20px">Move</div>${B('Down +','setCal(0,10)')}${B('Up −','setCal(0,-10)')}<div style="margin-top:20px">${B('Reset','setCal(0,0,true)')}${B('Close grid','toggleGrid()')}</div>`;
  $('stage').appendChild(c);showCal()}
