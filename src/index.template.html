<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Betrayal – Igloo CAVE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#D9B45A;--gold2:#F3D98B;--blood:#B3202F;--silver:#D7DEE8;--ink:#07060a;--glass:rgba(16,12,18,.88);--line:rgba(217,180,90,.28);--txt:#EEE7DA;--muted:#A79F93}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Inter',Arial,sans-serif;color:var(--txt)}
#stage{position:absolute;left:0;top:0;width:12566px;height:4516px;transform-origin:0 0}
.cin{font-family:'Cinzel',Georgia,serif}
#hall{position:absolute;left:0;top:0;width:12566px;height:1080px}
#floor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;overflow:hidden;background:#050407}
#floorcv{position:absolute;left:0;top:0;width:2847px;height:3436px}
.candle{position:absolute;width:26px;height:90px;background:linear-gradient(#efe4cf,#b9a98c);border-radius:6px 6px 3px 3px;z-index:3}
.candle::before{content:'';position:absolute;left:3px;top:-46px;width:20px;height:44px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#fff6c9,#ffb43a 55%,rgba(255,120,0,0) 72%);animation:flick 1.6s infinite alternate}
.candle::after{content:'';position:absolute;left:-140px;top:-200px;width:306px;height:306px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,70,.22),rgba(255,140,40,0) 65%);animation:glow 2.3s infinite alternate;pointer-events:none}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
@keyframes glow{0%{opacity:.7}100%{opacity:1}}
.panel{position:absolute;background:var(--glass);border:3px solid var(--line);border-radius:28px;box-sizing:border-box;padding:26px 34px;overflow:hidden;z-index:4}
.panel h2{margin:0 0 14px;font:800 40px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:4px}
.walltitle{position:absolute;top:34px;height:140px;display:flex;align-items:center;justify-content:center;font:900 96px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:10px;text-shadow:0 0 40px rgba(217,180,90,.35),0 6px 0 #000;z-index:4;text-align:center}
.walltitle small{display:block;font:600 40px Inter,Arial;letter-spacing:2px;color:var(--muted)}
/* houses */
.house{top:200px;width:530px;height:840px;padding:24px;text-align:center}
.house .crest{width:250px;height:280px;margin:0 auto}
.house .crest svg{width:100%;height:100%}
.house .hn{font:800 46px Cinzel,Georgia,serif;margin-top:6px;line-height:1.05}
.house .st{font-size:34px;color:var(--muted);margin-top:10px;min-height:46px}
.house .rec{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.house .rec div{display:flex;justify-content:space-between;font:700 34px Inter,Arial;padding:6px 16px;border-radius:12px;background:rgba(255,255,255,.05)}
.house .rec .y{color:#9FE3B8}.house .rec .n{color:#FF9AA2}
.house.active{border-color:var(--gold);box-shadow:0 0 0 6px var(--gold),0 0 80px rgba(217,180,90,.5)}
.house.shield{border-color:var(--silver);box-shadow:0 0 0 6px var(--silver),0 0 80px rgba(215,222,232,.45)}
.house.empty{opacity:.12}
.badge{display:inline-block;font:800 30px Inter,Arial;padding:6px 16px;border-radius:12px;margin:4px}
.badge.sh{background:var(--silver);color:#111}.badge.gh{background:#2a2433;color:#d9d2ff;border:2px solid #6c5f8a}
/* front */
#card{left:3476px;top:200px;width:2767px;height:660px;border-color:var(--gold);padding:36px 50px}
#card.flip{animation:flip .55s cubic-bezier(.2,.9,.3,1.15)}
@keyframes flip{0%{transform:perspective(2500px) rotateX(-70deg);opacity:0}100%{transform:none;opacity:1}}
.qh{font:800 34px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:3px;margin-bottom:12px}
.qq{font:700 64px Inter,Arial;line-height:1.15;margin-bottom:22px}
.big{font:900 120px Cinzel,Georgia,serif;line-height:1.05;text-align:center}
.mid{font:700 58px Inter,Arial;line-height:1.25;text-align:center}
.sub{font:600 44px Inter,Arial;line-height:1.3;color:var(--muted);text-align:center;margin-top:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{background:#1d1620;border:3px solid #4a3b44;border-radius:16px;padding:14px 22px;font-size:42px;cursor:pointer;line-height:1.15;display:flex;gap:18px;align-items:center}
.opt b{flex:0 0 auto;font-family:Cinzel,Georgia,serif;color:var(--gold)}
.opt.right{background:#173323;border-color:#9FE3B8}.opt.wrong{background:#3a1218;border-color:#FF9AA2;animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.exp{margin-top:16px;font-size:38px;line-height:1.3;color:var(--muted)}
.oc{display:flex;gap:16px;margin:0 0 18px}.oc span{flex:1;font:700 36px Inter,Arial;padding:10px 18px;border-radius:16px;border:4px solid;text-align:center}
.qclock{float:right;font:800 80px Cinzel,Georgia,serif;color:var(--gold);margin-top:-18px;font-variant-numeric:tabular-nums}
.qclock.low{color:#FF9AA2;animation:bump .5s infinite}
@keyframes bump{30%{transform:scale(1.15)}}
.dock{position:absolute;top:884px;height:180px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px;z-index:6}
.btn{font:800 46px Cinzel,Georgia,serif;border:none;border-radius:18px;padding:0 40px;height:150px;cursor:pointer;background:var(--gold);color:#1a1205;box-shadow:0 6px 0 rgba(0,0,0,.6)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.6)}
.dock.many .btn{font-size:38px;height:96px;padding:0 24px;border-radius:14px}
.btn.go{background:#2E8B57;color:#fff}.btn.no{background:var(--blood);color:#fff}.btn.alt{background:#3E4A7A;color:#fff}.btn.sil{background:var(--silver);color:#111}
.btn.sm{font-size:32px;height:76px;padding:0 24px;border-radius:12px}
.btn .mini{width:60px;height:66px;display:inline-block;vertical-align:middle;margin-right:10px}
.btn .mini svg{width:100%;height:100%}
.starters{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px}
.starters div{font:600 50px Inter,Arial;padding:16px 22px;border-radius:16px;border:3px dashed var(--line);color:var(--gold2)}
.ev{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.ev div{font:700 40px Inter,Arial;padding:10px 20px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.ev .mini{width:56px;height:62px}.ev svg{width:100%;height:100%}
/* right + back */
#pot{left:6323px;top:200px;width:1700px;height:840px;text-align:center;padding-top:50px}
#pot .amt{font:900 260px Cinzel,Georgia,serif;color:var(--gold2);text-shadow:0 0 80px rgba(243,217,139,.45);line-height:1.1;font-variant-numeric:tabular-nums}
#pot .amt.bump{animation:bump .7s}
#status{left:8063px;top:200px;width:1616px;height:840px}
.steps{display:flex;flex-direction:column;gap:12px;margin:10px 0 24px}
.steps div{font:800 48px Cinzel,Georgia,serif;color:#5d5560;padding:8px 20px;border-radius:14px}
.steps div.on{color:#1a1205;background:var(--gold)}
.stat{font:600 40px Inter,Arial;margin:8px 0;color:var(--txt)}.stat b{color:var(--gold2)}
#clock{left:9759px;top:200px;width:1360px;height:420px}
#clock .t{font:900 150px Cinzel,Georgia,serif;line-height:1;font-variant-numeric:tabular-nums}
#chron{left:9759px;top:650px;width:1360px;height:390px}
#chron div{font-size:32px;line-height:1.25;padding:7px 0;border-bottom:1px solid var(--line)}
#rules{left:11159px;top:200px;width:1367px;height:840px}
#rules p{font-size:36px;line-height:1.3;margin:0 0 16px}
#rules b{color:var(--gold2)}
/* setup */
#setup{left:3476px;top:200px;width:2767px;height:850px;border-color:var(--gold);z-index:7}
.pick{display:flex;gap:16px;flex-wrap:wrap}
.co{width:250px;height:300px;border-radius:20px;background:#1d1620;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px 14px;box-sizing:border-box;position:relative;border:5px solid transparent;text-align:center}
.co .mini{width:170px;height:190px;margin-bottom:6px}.co .mini svg{width:100%;height:100%}
.co b{font:800 32px Cinzel,Georgia,serif}
.co.on{border-color:var(--gold);background:#2c2214}
.setrow{font-size:40px;margin:22px 0 12px;color:var(--muted)}
.chooser{display:flex;gap:14px;flex-wrap:wrap}
.hide{display:none!important}
/* floor */
#fzones{position:absolute;inset:0;display:grid;gap:24px;padding:24px;box-sizing:border-box;z-index:2}
.fz{border-radius:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px;box-sizing:border-box;color:#fff;border:16px solid rgba(255,255,255,.35);transition:opacity .5s,transform .5s;cursor:pointer;overflow:hidden}
.fz .fl{font:900 520px/1 Cinzel,Georgia,serif;display:flex;align-items:center;gap:60px}
.fz .fl i{font-style:normal;font-size:300px;opacity:.9}
.fz .ft{font:700 130px/1.15 Inter,Arial;margin-top:40px;max-height:900px;overflow:hidden}
.fz.dark{color:#0a0a0a}.fz.right{border:40px solid #fff;transform:scale(1.03);box-shadow:0 0 200px #fff}
.fz.dim{opacity:.15}.fz.picked{opacity:.55;border-style:dashed}
.fz .fv{font:900 200px Cinzel,Georgia,serif;margin-top:30px}
#fbig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3;pointer-events:none;padding:120px;box-sizing:border-box}
#fbig .big{font-size:330px}#fbig .mid{font-size:150px}
#fbig .crestbig{width:1300px;height:1450px}#fbig .crestbig svg{width:100%;height:100%}
/* night / dark overlay over the walls */
#dark{position:absolute;left:0;top:0;width:12566px;height:4516px;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s;z-index:20}
#dark.on{opacity:.82}
.night #card,.night .dock,.night #floor,.night #ftitle{z-index:21}
.reveal{position:absolute;top:0;height:1080px;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:30;pointer-events:none;text-align:center}
.reveal .big{font-size:260px;letter-spacing:10px;animation:rv 1.4s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rv{0%{transform:scale(2.4);opacity:0;filter:blur(30px)}100%{transform:none;opacity:1;filter:none}}
.traitor{color:#ff5a66;text-shadow:0 0 90px rgba(255,40,60,.7),0 8px 0 #000}
.faithful{color:#f4f7ff;text-shadow:0 0 90px rgba(200,220,255,.7),0 8px 0 #000}
#banner{position:absolute;left:3436px;top:0;width:2847px;height:1080px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40}
#banner div{font:900 180px Cinzel,Georgia,serif;color:var(--gold2);-webkit-text-stroke:6px #000;paint-order:stroke fill;animation:banner 2.6s ease-out forwards;text-align:center;line-height:1}
@keyframes banner{0%{transform:scale(1.5);opacity:0;letter-spacing:50px}18%{transform:scale(1);opacity:1;letter-spacing:6px}85%{opacity:1}100%{opacity:0}}
.count{font:900 600px Cinzel,Georgia,serif;color:var(--gold2);animation:rv .6s}
</style>
</head>
<body>
<div id="stage">
  <canvas id="hall" width="3142" height="270"></canvas>
  <div id="floor"><canvas id="floorcv" width="1424" height="1718"></canvas><div id="fzones" class="hide"></div><div id="fbig"></div></div>
  <div id="candles"></div>

  <div class="walltitle" style="left:0;width:3436px">THE HOUSES</div>
  <div id="houses"></div>

  <div class="walltitle" id="ftitle" style="left:3436px;width:2847px">THE BETRAYAL</div>
  <div class="panel" id="card"></div>
  <div class="dock" id="dockA" style="left:3476px;width:1344px"></div>
  <div class="dock" id="dockB" style="left:4900px;width:1343px"></div>
  <div class="panel" id="setup"></div>

  <div class="walltitle" style="left:6283px;width:3436px">THE PRIZE POT</div>
  <div class="panel" id="pot"></div>
  <div class="panel" id="status"></div>

  <div class="walltitle" style="left:9719px;width:2847px">THE CASTLE</div>
  <div class="panel" id="clock"></div>
  <div class="panel" id="chron"></div>
  <div class="panel" id="rules"></div>

  <div id="dark"></div>
  <div id="reveals"></div>
  <div id="banner"></div>
</div>
<input type="file" id="file" accept=".xlsx" class="hide">
<script>
const SAMPLE = /*__SAMPLE_DATA__*/null;
const WALLS=[{x:0,w:3436},{x:3436,w:2847},{x:6283,w:3436},{x:9719,w:2847}];

/* ---------- houses: crest = colour + emblem shape, so colour-blind players can tell them apart ---------- */
const HOUSES=[
 {id:'moon',name:'House of the Moon',short:'Moon',color:'#0072B2',e:'#fff'},
 {id:'tower',name:'House of the Tower',short:'Tower',color:'#E69F00',e:'#1a1205'},
 {id:'key',name:'House of the Key',short:'Key',color:'#56B4E9',e:'#06202e'},
 {id:'crown',name:'House of the Crown',short:'Crown',color:'#F0E442',e:'#1a1205'},
 {id:'rose',name:'House of the Rose',short:'Rose',color:'#CC79A7',e:'#fff'},
 {id:'flame',name:'House of the Flame',short:'Flame',color:'#D55E00',e:'#fff'}];
const hById=id=>HOUSES.find(h=>h.id===id);
function crest(id){const h=hById(id),E=h.e,C=h.color;let g='';
  if(id==='moon')g=`<path d="M122 62 A52 52 0 1 0 122 158 A40 40 0 1 1 122 62 Z" fill="${E}"/>`;
  else if(id==='tower')g=`<path d="M66 168 V92 H56 V64 H74 V78 H90 V64 H110 V78 H126 V64 H144 V92 H134 V168 Z" fill="${E}"/><path d="M90 168 V136 Q100 122 110 136 V168 Z" fill="${C}"/>`;
  else if(id==='key')g=`<circle cx="100" cy="78" r="26" fill="none" stroke="${E}" stroke-width="14"/><rect x="93" y="100" width="14" height="70" fill="${E}"/><rect x="107" y="146" width="22" height="11" fill="${E}"/><rect x="107" y="160" width="15" height="10" fill="${E}"/>`;
  else if(id==='crown')g=`<path d="M52 150 L58 78 L82 112 L100 70 L118 112 L142 78 L148 150 Z" fill="${E}"/><rect x="52" y="154" width="96" height="14" fill="${E}"/>`;
  else if(id==='rose')g=[0,72,144,216,288].map(a=>`<circle cx="${100+Math.cos((a-90)*Math.PI/180)*26}" cy="${112+Math.sin((a-90)*Math.PI/180)*26}" r="25" fill="${E}"/>`).join('')+`<circle cx="100" cy="112" r="15" fill="${C}"/>`;
  else g=`<path d="M100 56 C132 98 142 120 130 150 Q120 174 100 174 Q80 174 70 150 C60 122 84 108 88 84 C96 102 106 104 100 56 Z" fill="${E}"/>`;
  return `<svg viewBox="0 0 200 224" xmlns="http://www.w3.org/2000/svg"><path d="M16 12 H184 V100 Q184 176 100 214 Q16 176 16 100 Z" fill="${C}" stroke="#D9B45A" stroke-width="8"/>${g}</svg>`}

/* ---------- state ---------- */
let BANK=JSON.parse(JSON.stringify(SAMPLE)),BANKSRC='Built-in sample questions';
const S={phase:'setup',picked:['moon','tower','key','crown','rose'],minutes:45,traitorsStart:2,teams:[],round:1,rounds:3,pot:0,traitors:2,bannedT:0,bannedF:0,murdered:0,shield:-1,
  used:new Set(),log:[],chron:[],mq:0,order:[],q:null,qLeft:0,revealed:false,chosen:null,qTeam:-1,actA:[],actB:[],disc:0,discOn:false,paused:false,elapsed:0,final:false,recruited:false,step:'',review:false,winner:null};
const ANSWER_SECS=60;
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'£'+Math.round(v).toLocaleString('en-GB');
const act=(label,fn,cls='')=>({label,fn,cls});
function setActs(a,b){S.actA=a||[];S.actB=b||[]}
function chron(t){S.chron.unshift(t);S.chron=S.chron.slice(0,14)}
const potStep=()=>+BANK.settings.pot||1000;
const roundsFor=m=>Math.max(1,Math.round((m-6)/12));

/* ---------- sound: ElevenLabs clips in assets/audio, with built-in fallbacks ---------- */
const SFX=['sfx_gong','sfx_heartbeat','sfx_bell','sfx_drumroll','sfx_traitor','sfx_faithful','sfx_gasp','sfx_door','sfx_wolf','sfx_tick','sfx_correct','sfx_wrong','sfx_scroll','sfx_whoosh'];
const V=(b,n)=>[b].concat(Array.from({length:n-1},(_,i)=>b+'_'+(i+2)));
const HOST={close:['host_close_eyes'],choosing:['host_choosing'],topen:['host_traitors_open'],tclose:['host_traitors_close'],allopen:['host_all_open'],
  mission:V('host_mission',2),correct:V('host_correct',3),wrong:V('host_wrong',3),shield:['host_shield'],roundtable:V('host_roundtable',2),vote:['host_vote'],
  stand:['host_stand'],wastraitor:V('host_was_traitor',2),wasfaithful:V('host_was_faithful',2),night:['host_night'],nighttraitors:['host_night_traitors'],nightclose:['host_night_close'],
  recruit:['host_recruit'],breakfast:['host_breakfast'],murdered:V('host_murdered',2),nomurder:['host_no_murder'],finalrt:['host_final_rt'],endvote:['host_endvote'],
  revealyou:['host_reveal_yourselves'],faithfulwin:['host_faithful_win'],traitorwin:['host_traitor_win'],allfound:['host_all_found']};
const AUD={},OK={};let muted=false,hostNow=null,loopNow={},actx=null;
[...SFX,...Object.values(HOST).flat()].forEach(k=>{const a=new Audio();a.preload='auto';a.oncanplaythrough=()=>OK[k]=1;a.onerror=()=>OK[k]=0;a.src=`assets/audio/${k}.mp3`;AUD[k]=a});
function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
function beep(freqs,dur=.15,type='sine',vol=.25){if(muted||!ac())return;let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.85})}
const FALLBACK={sfx_gong:()=>beep([98,73],1.6,'sine',.4),sfx_bell:()=>beep([392,196],1.4,'sine',.3),sfx_traitor:()=>beep([147,139,131],.6,'sawtooth',.18),sfx_faithful:()=>beep([294,370,440,587],.35,'triangle',.2),
  sfx_correct:()=>beep([440,554,659],.15,'triangle',.2),sfx_wrong:()=>beep([196,147],.35,'sawtooth',.14),sfx_tick:()=>beep([1200],.04,'square',.08),sfx_scroll:()=>beep([300,500],.08,'sine',.12),sfx_gasp:()=>{},sfx_whoosh:()=>beep([200,600],.12,'sine',.1)};
function talking(){return hostGap||(hostNow&&!hostNow.paused&&!hostNow.ended)}
function play(k,{vol=.8,max=0}={}){if(muted)return null;if(OK[k]!==1){FALLBACK[k]&&FALLBACK[k]();return null}
  if(talking())vol*=.45;const a=AUD[k].cloneNode();a.volume=vol;a.play().catch(()=>{});if(max)setTimeout(()=>a.pause(),max*1000);return a}
function loop(k,on,vol=.35){if(on){if(loopNow[k]||muted)return;if(OK[k]!==1){if(k==='sfx_heartbeat')loopNow[k]=setInterval(()=>beep([60,52],.18,'sine',.35),1000);return}
    const a=AUD[k];a.loop=true;a.volume=vol;a.currentTime=0;a.play().catch(()=>{});loopNow[k]=a}
  else{const a=loopNow[k];if(!a)return;if(typeof a==='number')clearInterval(a);else a.pause();delete loopNow[k]}}
function stopLoops(){Object.keys(loopNow).forEach(k=>loop(k,false))}
/* the host never talks over himself: lines queue; big moments first; stale small comments are dropped */
const RECENT=[],HQ=[];let hostGap=false;
const PRIO={wastraitor:3,wasfaithful:3,faithfulwin:4,traitorwin:4,allfound:4,murdered:3,close:3,topen:3,tclose:3,allopen:3,night:3,nighttraitors:3,nightclose:3,breakfast:3,stand:3,vote:3,point:3,endvote:3,revealyou:3,recruit:3,shield:2,roundtable:2,finalrt:3,mission:2,correct:2,wrong:2};
function host(ev,delay=0,chance=1){const list=HOST[ev];if(!list||Math.random()>chance)return;
  setTimeout(()=>{if(muted)return;if(talking()){HQ.push({ev,p:PRIO[ev]||1,t:Date.now()});HQ.sort((a,b)=>b.p-a.p||a.t-b.t);if(HQ.length>3)HQ.length=3;return}sayNow(ev)},delay)}
function sayNow(ev){const list=HOST[ev];let pool=list.filter(k=>OK[k]&&!RECENT.includes(k));if(!pool.length)pool=list.filter(k=>OK[k]);if(!pool.length){nextHost();return}
  const k=pool[rnd(pool.length)];RECENT.push(k);if(RECENT.length>10)RECENT.shift();hostNow=AUD[k];hostNow.currentTime=0;hostNow.volume=1;duck(true);
  hostNow.onended=()=>{duck(false);nextHost()};hostNow.play().catch(()=>nextHost())}
function nextHost(){if(muted){HQ.length=0;return}while(HQ.length){const h=HQ.shift();if(Date.now()-h.t<(h.p>=3?15000:h.p===2?7000:3500)){hostGap=true;setTimeout(()=>{hostGap=false;sayNow(h.ev)},450);return}}}
function hush(){HQ.length=0;hostGap=false;if(hostNow)hostNow.pause()}

/* ---------- music: generative dark castle score (no file needed). Moods: day, tense, night ---------- */
const MUS={on:true,gain:null,bus:null,next:0,step:0,timer:0,base:.22,mood:'day'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[50,53,57,62],[46,50,53,58],[43,46,50,55],[45,49,52,57]]; // Dm  Bb  Gm  A
function startMusic(){if(!MUS.on||muted||MUS.gain||!ac())return;
  MUS.gain=actx.createGain();MUS.gain.gain.value=.0001;MUS.gain.connect(actx.destination);
  MUS.bus=actx.createBiquadFilter();MUS.bus.type='lowpass';MUS.bus.frequency.value=1400;MUS.bus.connect(MUS.gain);
  MUS.gain.gain.setTargetAtTime(MUS.base,actx.currentTime,2);MUS.next=actx.currentTime+.2;MUS.step=0;MUS.timer=setInterval(schedMusic,60)}
function stopMusic(){if(!MUS.gain)return;clearInterval(MUS.timer);const g=MUS.gain;g.gain.setTargetAtTime(.0001,actx.currentTime,.4);setTimeout(()=>g.disconnect(),2000);MUS.gain=null}
function duck(on){if(MUS.gain)MUS.gain.gain.setTargetAtTime(on?MUS.base*.15:MUS.base,actx.currentTime,.4)}
function mood(m){MUS.mood=m;if(MUS.bus)MUS.bus.frequency.setTargetAtTime(m==='tense'?2200:m==='night'?700:1400,actx.currentTime,1)}
function schedMusic(){const beat=1;while(MUS.next<actx.currentTime+.4){musStep(MUS.step,MUS.next);MUS.next+=beat/2;MUS.step++}}
function pad(f,t,dur,vol,type='sawtooth'){const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();o.type=type;o2.type=type;o.frequency.value=f;o2.frequency.value=f;o2.detune.value=9;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.35);g.gain.setTargetAtTime(.0001,t+dur*.7,dur*.25);o.connect(g);o2.connect(g);g.connect(MUS.bus);o.start(t);o2.start(t);o.stop(t+dur*1.6);o2.stop(t+dur*1.6)}
function thud(t,vol,f0=90,f1=38,dur=.5){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MUS.gain);o.start(t);o.stop(t+dur)}
function musStep(s,t){const b=s%16,ch=PROG[Math.floor(s/16)%4],m=MUS.mood;
  if(b===0){ch.forEach((n,i)=>pad(mtof(n),t,8.5,m==='night'?.012:.02,i?'triangle':'sawtooth'));pad(mtof(ch[0]-24),t,8.5,.05,'sine')}
  if(m!=='night'&&b===0)thud(t,.5,70,32,1.2);
  if(m==='tense'&&(b%2===0)){thud(t,.45,62,40,.22);thud(t+.22,.3,58,38,.2)}
  if(m==='day'&&(b===6||b===12)&&Math.random()<.6)pad(mtof(ch[3]+12+[0,2,3][rnd(3)]),t,1.8,.012,'sine');
  if(m==='night'&&b===8&&Math.random()<.5)pad(mtof(ch[0]+36),t,3,.008,'sine')}
addEventListener('pointerdown',()=>{ac();startMusic()},{once:true});

(function floorLoop(){FL.t++;const W=1424,H=1718,cx=W/2,cy=H/2;fc.clearRect(0,0,W,H);

function pickQ(){const pref=Math.min(3,S.round);const qs=BANK.questions;
  const tiers=[qs.filter(q=>q.level===pref),qs.filter(q=>Math.abs(q.level-pref)===1),qs];
  for(const t of tiers){const fresh=t.filter(q=>!S.used.has(q.id));if(fresh.length){const q=fresh[rnd(fresh.length)];S.used.add(q.id);return q}}
  S.used.clear();const q=qs[rnd(qs.length)];if(q)S.used.add(q.id);return q}

  scene({title:'NIGHT',card:`<div class="big">Night falls on the castle.</div><div class="mid" style="margin-top:20px">Everyone, close your eyes.</div>`,say:'night',dark:true,mood:'night',next:{label:'Next ›',fn:night2}})}
function night2(){const sh=S.shield>=0?S.teams[S.shield]:null,canRecruit=S.bannedT>0;
  scene({title:'NIGHT',card:`<div class="big" style="color:#ff6b75;font-size:100px">Traitors… open your eyes.</div><div class="mid" style="margin-top:16px">Silently choose your victim. Point at them.</div>
    <div class="sub">${sh?`Not ${esc(sh.name)} – they have the 🛡 shield. `:''}Not another Traitor.</div>${tutor(`remember who they point at.${canRecruit?' Or, as a Traitor has been banished, they may <b>recruit</b> a Faithful instead.':''}`)}`,
    say:'nighttraitors',dark:true,loops:['sfx_heartbeat'],btns:[act('Victim chosen ›',()=>night3(false),'no')].concat(canRecruit?[act('Recruit instead',recruit,'alt')]:[])})}
function recruit(){scene({title:'NIGHT',card:`<div class="mid">${tutor('tap the chosen Faithful on the shoulder and whisper: <b>“You are now a Traitor.”</b>')}</div><div class="mid" style="margin-top:20px">New recruit: open your eyes and see your fellow Traitors.</div>`,
  say:'recruit',dark:true,loops:['sfx_heartbeat'],next:{label:'Done ›',fn:()=>{S.traitors++;S.recruited=true;chron('Something happened in the night…');night3(true)}}})}
function night3(rec){S.recruitedTonight=rec;scene({title:'NIGHT',card:`<div class="big">Traitors, close your eyes.</div><div class="mid" style="margin-top:20px">Sleep well… if you can.</div>`,say:'nightclose',dark:true,auto:{ms:5000,fn:breakfast},next:{label:'Morning ›',fn:breakfast,cls:'alt'}})}
function breakfast(){S.phase='breakfast';play('sfx_door',{vol:.7});
  const opts=S.teams.map((t,k)=>k===S.shield?null:act(`<span class="mini">${crest(t.id)}</span>${t.short}`,()=>murder(k),'')).filter(Boolean);
  scene({title:'BREAKFAST',card:`<div class="big">Good morning.</div><div class="mid" style="margin-top:20px">Everyone, open your eyes. Breakfast is served…</div><div class="mid" style="color:#ff6b75">but someone is missing.</div>${tutor(S.recruitedTonight?'nobody was murdered tonight (the Traitors recruited) – tap “Nobody”.':'tap the house of the person the Traitors pointed at.')}`,
    say:'breakfast',dark:false,mood:'day',btns:opts.concat([act('Nobody',noMurder,'alt')])})}
function murder(k){const t=S.teams[k];t.ghosts++;S.murdered++;play('sfx_gasp',{vol:.8});host('murdered',400);chron(`Murdered in the night: a member of ${t.short}.`);
  revealAll('MURDERED','traitor');
  scene({title:'MURDERED',card:`<div class="mid"><b>${esc(t.name)}</b> has lost someone.</div><div class="big traitor" style="font-size:110px;margin-top:20px">They were murdered in the night.</div><div class="sub">They are now a 👻 ghost: they still answer mission questions with their house, but can't vote.</div>`,
    floor:`<div class="crestbig">${crest(t.id)}</div>`,next:{label:'Next mission ›',fn:nextRound,cls:'go'}})}
function noMurder(){host('nomurder');chron('Nobody was murdered. Suspicious…');
  scene({title:'BREAKFAST',card:`<div class="big" style="font-size:100px">Everyone survived the night.</div><div class="mid" style="margin-top:20px">So why would the Traitors spare you…?</div>`,next:{label:'Next mission ›',fn:nextRound,cls:'go'}})}
function nextRound(){S.round++;startMission()}

/* ---------- the end ---------- */
function endVote(){S.phase='endvote';
  scene({title:'THE END?',card:`<div class="mid">Do you believe every Traitor is gone?</div><div class="sub" style="font-size:52px;color:var(--txt)">Hands up to <b style="color:var(--gold2)">END THE GAME</b>…<br>or hands up to <b style="color:#ff6b75">BANISH AGAIN</b>.</div>${tutor('count the hands. Everyone must agree to end – one hand for “banish again” means another vote.')}`,
    floor:crestRing(),say:'endvote',mood:'tense',btns:[act('End the game ›',()=>endGame(false),'go'),act('Banish again',()=>startRT(true),'no')]})}
function endGame(allFound){S.phase='finale';stopLoops();
  scene({title:'THE REVEAL',card:`<div class="big">Traitors…</div><div class="mid" style="margin-top:20px">${allFound?'Every Traitor has been found.':'If you are still hiding… stand up now.'}</div>`,say:allFound?'allfound':'revealyou',mood:'tense',loops:['sfx_drumroll'],
    next:{label:'Reveal the winners ›',fn:()=>winners(S.traitors-S.bannedT<=0),cls:'go'}})}
function winners(faithful){stopLoops();S.phase='end';S.winner=faithful?'faithful':'traitor';const left=S.traitors-S.bannedT;
  play(faithful?'sfx_faithful':'sfx_traitor',{vol:.9});play('sfx_gong',{vol:.8});host(faithful?'faithfulwin':'traitorwin',700);
  revealAll(faithful?'THE FAITHFUL WIN':'THE TRAITORS WIN',faithful?'faithful':'traitor');
  chron(faithful?`The Faithful win ${money(S.pot)}.`:`${left} Traitor${left>1?'s':''} survived and steal ${money(S.pot)}.`);
  scene({title:faithful?'THE FAITHFUL WIN':'THE TRAITORS WIN',card:`<div class="big ${faithful?'faithful':'traitor'}" style="font-size:110px">${faithful?'🛡 The Faithful win':'🗡 The Traitors win'}</div><div class="big" style="color:var(--gold2);font-size:150px">${money(S.pot)}</div>
    <div class="sub">${faithful?'Every Traitor was found. The pot is shared by the Faithful.':`${left} Traitor${left>1?'s':''} stayed hidden to the end and steal the whole pot.`}<br>Mission answers: ${S.log.filter(l=>l.correct==='Yes').length} right out of ${S.log.length}.</div>`,
    floor:`<div class="big ${faithful?'faithful':'traitor'}" style="font-size:260px">${faithful?'FAITHFUL':'TRAITORS'}<br>WIN</div>`,mood:'day',
    btns:[act('Most-missed questions',toggleReview,'alt'),act('Export results',exportCSV,'alt'),act('New game',newGame,'')]})}
function missedList(){const n={};S.log.forEach(r=>{if(r.correct==='No'&&r.qid!=='none')n[r.qid]=(n[r.qid]||0)+1});
  return Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,c])=>({q:BANK.questions.find(x=>x.id===id),c})).filter(r=>r.q)}
function toggleReview(){const L=missedList();
  $('card').innerHTML=`<div class="qh">Class debrief · questions the houses got wrong</div>`+(L.length?L.map((r,n)=>{const a=r.q.opts.find(o=>o.L===r.q.ans);return `<div style="font-size:38px;line-height:1.25;margin:16px 0"><b style="color:#ff9aa2">${n+1}.</b> ${esc(r.q.q)}<br><span style="color:#9FE3B8">✓ ${esc(a?a.L+': '+a.text:r.q.ans)}</span></div>`}).join(''):'<div class="mid">No wrong answers. Impressive… or very good Traitors.</div>')}
function newGame(){hush();stopLoops();setDark(false);floorBig('');FL.mode='table';S.phase='setup';$('setup').classList.remove('hide');$('ftitle').innerHTML=esc(BANK.settings.name||'THE BETRAYAL').toUpperCase();setActs([],[]);render()}
function exportCSV(){const cols=['time','round','house','question','correct','secs'];
  const csv=[cols.join(',')].concat(S.log.map(r=>cols.map(c=>`"${String(r[c]).replace(/"/g,'""')}"`).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`betrayal-results-${new Date().toISOString().slice(0,10)}.csv`;a.click()}
function endNow(){if(S.phase==='setup'||S.phase==='end'||S.phase==='finale')return;hush();stopLoops();setDark(false);S.final=true;S.rounds=S.round;startRT()}

/* ---------- timers ---------- */
setInterval(()=>{if(S.paused||S.phase==='setup'||S.phase==='end')return;S.elapsed++;
  if(S.phase==='question'&&S.qLeft>0){S.qLeft--;const c=$('qclock');if(c){c.textContent=S.qLeft+'s';c.classList.toggle('low',S.qLeft<=10)}if(S.qLeft<=10&&S.qLeft>0)play('sfx_tick',{vol:.5});if(S.qLeft===0){S.timedOut=true;judgeM(false)}}
  if(S.phase==='roundtable'&&S.discOn&&S.disc>0){S.disc--;renderDisc();if(S.disc===0){play('sfx_gong',{vol:.8});banner('TIME TO VOTE')}}
  renderClock()},1000);

/* ---------- rendering ---------- */
function renderHouses(){let h='';for(let k=0;k<6;k++){const t=S.teams[k],x=40+k*560;
  if(S.phase==='setup'){const id=S.picked[k];if(!id){h+=`<div class="panel house empty" style="left:${x}px"></div>`;continue}const c=hById(id);
    h+=`<div class="panel house" style="left:${x}px"><div class="crest">${crest(id)}</div><div class="hn">${esc(c.name)}</div><div class="st">Ready</div></div>`;continue}
  if(!t){h+=`<div class="panel house empty" style="left:${x}px"></div>`;continue}
  const cls=(S.phase==='question'||S.phase==='mresult')&&S.qTeam===k?' active':S.shield===k?' shield':'';
  h+=`<div class="panel house${cls}" style="left:${x}px"><div class="crest">${crest(t.id)}</div><div class="hn">${esc(t.name)}</div>
    <div class="st">${S.shield===k?'<span class="badge sh">🛡 Shield</span>':''}${t.ghosts?`<span class="badge gh">👻 ${t.ghosts} ghost${t.ghosts>1?'s':''}</span>`:''}</div>
    <div class="rec">${t.rec.map(r=>`<div class="${r.ok?'y':'n'}"><span>Round ${r.r}</span><span>${r.ok?'✓ right':'✗ wrong'}</span></div>`).join('')}</div></div>`}
  $('houses').innerHTML=h}
function renderPot(){$('pot').innerHTML=`<h2>Prize pot</h2><div class="amt">${money(S.pot)}</div><div class="sub" style="font-size:46px">Every right mission answer adds <b style="color:var(--gold2)">${money(potStep())}</b>.<br>At the end, if every Traitor is found, the Faithful win it.<br>If any Traitor survives… <b style="color:#ff6b75">they steal it all.</b></div>`}
function renderStatus(){const steps=['Mission','Round Table','Night','Breakfast'],cur={mission:0,question:0,mresult:0,roundtable:1,vote:1,banish:1,night:2,breakfast:3,endvote:1,finale:1,end:-1}[S.phase];
  if(S.phase==='setup'){$('status').innerHTML=`<h2>The game</h2><div class="stat">1. <b>The Choosing</b> – eyes closed, Traitors are picked.</div><div class="stat">2. <b>Mission</b> – answer questions, grow the pot.</div><div class="stat">3. <b>Round Table</b> – argue, then vote someone out.</div><div class="stat">4. <b>Night</b> – the Traitors strike.</div><div class="stat">5. Repeat… then the <b>final reveal</b>.</div>`;return}
  $('status').innerHTML=`<h2>Round ${Math.min(S.round,S.rounds)} of ${S.rounds}${S.final?' · FINAL':''}</h2><div class="steps">${steps.map((s,i)=>`<div class="${i===cur?'on':''}">${s}</div>`).join('')}</div>
    <div class="stat">🗡 Traitors banished: <b>${S.bannedT} of ${S.traitors}</b></div><div class="stat">🛡 Faithful banished: <b>${S.bannedF}</b></div><div class="stat">☠ Murdered: <b>${S.murdered}</b></div>`}
function renderClock(){const m=Math.floor(S.elapsed/60),s=S.elapsed%60;
  $('clock').innerHTML=`<div style="display:flex;gap:30px;align-items:center"><div><h2 style="margin:0">Time played</h2><div class="t">${m}:${String(s).padStart(2,'0')}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-left:auto">
    <button class="btn sm alt" onclick="S.paused=!S.paused;renderClock()">${S.paused?'Resume':'Pause'}</button><button class="btn sm no" onclick="endNow()">End now</button>
    <button class="btn sm alt" onclick="toggleSound()">${muted?'Sound: off':'Sound: on'}</button><button class="btn sm alt" onclick="toggleMusic()">${MUS.on?'Music: on':'Music: off'}</button>
    <button class="btn sm" onclick="exportCSV()">Export</button></div></div>`}
function renderChron(){$('chron').innerHTML='<h2>The chronicle</h2>'+S.chron.slice(0,8).map(c=>`<div>${esc(c)}</div>`).join('')}
function renderRules(){$('rules').innerHTML=`<h2>How to play</h2><p><b>Faithful:</b> answer questions right to grow the pot. Find the Traitors and vote them out.</p><p><b>Traitors:</b> blend in. Quietly steer your house to wrong answers. Each night, choose someone to murder.</p><p><b>Round Table:</b> use evidence. Who pushed for the wrong answer? Whose story doesn't add up?</p><p><b>👻 Ghosts</b> (banished or murdered) still answer questions with their house, but can't vote.</p><p><b>🛡 Shield:</b> fastest right answer in a mission. That house is safe tonight.</p>`}
function renderQ(){if(!S.q||(S.phase!=='question'&&S.phase!=='mresult'))return;const q=S.q,t=S.teams[S.qTeam];
  const opts=q.opts.length?`<div class="opts">${q.opts.map(o=>{let c='opt',mark='';if(S.revealed&&o.L===q.ans){c+=' right';mark=' ✓'}else if(S.revealed&&o.L===S.chosen){c+=' wrong';mark=' ✗'}return `<div class="${c}" data-l="${o.L}"><b>${o.L}</b><span>${esc(o.text)}${mark}</span></div>`}).join('')}</div>`:'';
  const ans=S.revealed&&!q.opts.length&&q.ans?`<div class="exp"><b>Answer:</b> ${esc(q.ans)}</div>`:'';const exp=S.revealed&&q.exp?`<div class="exp">${esc(q.exp)}</div>`:'';
  const oc=S.revealed?'':`<div class="oc"><span style="border-color:#9FE3B8;color:#9FE3B8">✓ ${money(potStep())} into the pot</span><span style="border-color:#FF9AA2;color:#FF9AA2">✗ Nothing added</span></div>`;
  $('card').innerHTML=`<div class="qh">${S.revealed?'':`<span class="qclock${S.qLeft<=10?' low':''}" id="qclock">${S.qLeft}s</span>`}${esc(t.name)} · question ${S.mq+(S.revealed?0:1)} of ${S.order.length}</div>${oc}<div class="qq" id="qq">${esc(q.q)}</div>${opts}${ans}${exp}`;
  $('card').querySelectorAll('.opt').forEach(o=>o.onclick=()=>chooseOpt(o.dataset.l));
  const el=$('card'),qq=$('qq');let f=64;qq.style.fontSize=f+'px';while(el.scrollHeight>el.clientHeight&&f>36){f-=3;qq.style.fontSize=f+'px'}}
const ZONE=[['#0072B2','●',''],['#E69F00','▲','dark'],['#CC79A7','■','dark'],['#56B4E9','★','dark']];
function renderFloorQ(){const el=$('fzones'),q=S.q,on=FLOORQ&&q&&q.opts&&q.opts.length&&(S.phase==='question'||S.phase==='mresult');
  if(!on){el.className='hide';el.innerHTML='';if(FL.mode==='zones')FL.mode='table';return}FL.mode='zones';
  const n=q.opts.length;el.className='';el.style.gridTemplateColumns=n===4?'1fr 1fr':`repeat(${n},1fr)`;el.style.gridTemplateRows=n===4?'1fr 1fr':'1fr';
  el.innerHTML=q.opts.map((o,k)=>{const [c,sh,d]=ZONE[k%4];let cls='fz '+d,v='';if(S.revealed){if(o.L===q.ans){cls+=' right';v='<div class="fv">✓ CORRECT</div>'}else if(o.L===S.chosen){cls+=' picked';v='<div class="fv">✗ WRONG</div>'}else cls+=' dim'}
    return `<div class="${cls}" style="background:${c}" data-l="${o.L}"><div class="fl"><i>${sh}</i>${o.L}</div><div class="ft">${esc(o.text)}</div>${v}</div>`}).join('');
  el.querySelectorAll('.fz').forEach(z=>{z.onclick=()=>chooseOpt(z.dataset.l);const t=z.querySelector('.ft');let f=130;t.style.fontSize=f+'px';while(t.scrollHeight>t.clientHeight+2&&f>60){f-=8;t.style.fontSize=f+'px'}})}
let FLOORQ=true;try{FLOORQ=localStorage.getItem('floorq')!=='0'}catch(e){}
function renderDock(id,acts){const el=$(id);el.classList.toggle('many',acts.length>3);
  el.innerHTML=acts.map((a,n)=>`<button class="btn ${a.cls}" data-n="${n}">${a.label}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=acts[+b.dataset.n];if(a&&a.fn){play('sfx_whoosh',{vol:.25});a.fn()}})}
function renderSetup(){if(S.phase!=='setup')return;const r=roundsFor(S.minutes);
  $('setup').innerHTML=`<h2 style="font-size:60px">${esc(BANK.settings.name||'The Betrayal')} · setup</h2>
   <div class="setrow">Tap the houses playing (3–6). Each team is one house.</div>
   <div class="pick">${HOUSES.map(h=>`<div class="co${S.picked.includes(h.id)?' on':''}" onclick="togglePick('${h.id}')"><span class="mini">${crest(h.id)}</span><b>${h.short}</b></div>`).join('')}</div>
   <div style="display:flex;gap:80px"><div><div class="setrow">How many Traitors?</div><div class="chooser">${[1,2,3].map(n=>`<button class="btn sm ${n===S.traitorsStart?'go':''}" style="width:130px;height:100px;font-size:50px" onclick="S.traitorsStart=${n};render()">${n}</button>`).join('')}</div><div style="font-size:30px;color:var(--muted);margin-top:8px">About 1 per 7 students: 2 for up to 15, 3 for more.</div></div>
   <div><div class="setrow">Game length (minutes) → <b style="color:var(--gold2)">${r} round${r>1?'s':''}</b></div><div class="chooser">${[20,30,45,60].map(n=>`<button class="btn sm ${n===S.minutes?'go':''}" style="width:150px;height:100px;font-size:46px" onclick="S.minutes=${n};render()">${n}</button>`).join('')}</div></div></div>
   <div style="display:flex;gap:20px;margin-top:40px;align-items:center"><button class="btn go" style="height:150px;font-size:58px" onclick="startGame()">▶ Begin – The Choosing</button>
   <button class="btn alt sm" style="height:100px" onclick="$('file').click()">Load Excel questions</button>
   <button class="btn sm ${FLOORQ?'':'alt'}" style="height:100px" onclick="FLOORQ=!FLOORQ;try{localStorage.setItem('floorq',FLOORQ?'1':'0')}catch(e){};render()">${FLOORQ?'✓ ':''}Answers on floor</button></div>
   <div style="font-size:30px;color:var(--muted);margin-top:16px">${esc(BANKSRC)} · ${BANK.questions.length} questions</div>
   <div style="position:absolute;right:30px;bottom:20px;font-size:26px;color:var(--muted)">Version 1</div>`}
function render(){renderSetup();renderHouses();renderPot();renderStatus();renderClock();renderChron();renderRules();renderFloorQ();
  if(S.phase==='question'||S.phase==='mresult')renderQ();
  if(S.phase!=='setup'&&S.phase!=='question'&&S.phase!=='mresult'&&FL.mode!=='night'&&!$('fbig').innerHTML&&S.teams.length)floorBig(crestRing());
  renderDock('dockA',S.actA);renderDock('dockB',S.actB);['card','dockA','dockB'].forEach(id=>$(id).classList.toggle('hide',S.phase==='setup'))}
function toggleSound(){muted=!muted;if(muted){hush();stopLoops();stopMusic()}else startMusic();render()}
function toggleMusic(){MUS.on=!MUS.on;if(MUS.on)startMusic();else stopMusic();render()}

/* ---------- Excel loading (same format as the Monopoly-style game) ---------- */
async function unzip(buf){const d=new DataView(buf),u8=new Uint8Array(buf),files={};let e=buf.byteLength-22;
  while(e>=0&&d.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Not an Excel file');
  let p=d.getUint32(e+16,true);const n=d.getUint16(e+10,true);const td=new TextDecoder();
  for(let k=0;k<n;k++){const method=d.getUint16(p+10,true),cs=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),xl=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),off=d.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;const ds=off+30+d.getUint16(off+26,true)+d.getUint16(off+28,true);files[name]={method,raw:u8.slice(ds,ds+cs)}}
  return async name=>{const f=files[name];if(!f)return null;if(f.method===0)return new TextDecoder().decode(f.raw);
    const s=new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()}}
async function readXlsx(buf){const get=await unzip(buf),X=t=>new DOMParser().parseFromString(t,'application/xml');
  const wb=X(await get('xl/workbook.xml')),rels=X(await get('xl/_rels/workbook.xml.rels'));const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const ssx=await get('xl/sharedStrings.xml');const ss=ssx?[...X(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};const out={};
  for(const sh of wb.getElementsByTagName('sheet')){let t=relMap[sh.getAttribute('r:id')]||'';t=t.startsWith('/')?t.slice(1):'xl/'+t;const x=await get(t);if(!x)continue;const grid=[];
    for(const row of X(x).getElementsByTagName('row')){const r=[];for(const c of row.getElementsByTagName('c')){const ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
      if(ty==='s'&&v)val=ss[+v.textContent]||'';else if(ty==='inlineStr')val=[...c.getElementsByTagName('t')].map(z=>z.textContent).join('');else if(v)val=v.textContent;r[col(c.getAttribute('r'))]=val}
      grid[(+row.getAttribute('r')||grid.length+1)-1]=r}
    const head=(grid[0]||[]).map(h=>String(h||'').trim());out[sh.getAttribute('name').trim().toLowerCase()]=grid.slice(1).filter(Boolean).map(r=>{const o={};head.forEach((h,i)=>{if(h)o[h]=r[i]==null?'':r[i]});return o})}
  return out}
function parseWorkbook(sheets){const get=n=>sheets[n]||[];const out=JSON.parse(JSON.stringify(SAMPLE));
  get('settings').forEach(r=>{const k=String(r.Setting||'').trim().toLowerCase(),v=r.Value;if(k==='game name'&&String(v).trim())out.settings.name=String(v).trim();if(k==='pot per correct answer')out.settings.pot=+v||1000;if(k==='discussion minutes')out.settings.discuss=+v||3});
  const qs=get('questions').filter(r=>String(r.Question||'').trim()).map((r,n)=>{const opts=['A','B','C','D'].map(L=>({L,text:String(r['Option '+L]||'').trim()})).filter(o=>o.text);
    let ans=String(r.Answer||'').trim();if(opts.length&&/^[a-d]$/i.test(ans))ans=ans.toUpperCase();return {id:'x'+n,topic:String(r.Topic||'ANY').trim().toUpperCase()||'ANY',level:parseInt(r.Level)||1,q:String(r.Question).trim(),opts,ans,exp:String(r.Explanation||'').trim()}});
  if(qs.length)out.questions=qs;return out}
async function useWorkbook(buf,src){try{BANK=parseWorkbook(await readXlsx(buf));BANKSRC=src;render()}catch(e){console.warn(e);BANKSRC='Could not read that file (is it .xlsx?). Still using the previous questions.';render()}}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>useWorkbook(r.result,'Loaded: '+f.name);r.readAsArrayBuffer(f);e.target.value=''};
(function autoLoad(){if(!/^https?:/.test(location.protocol))return;const url=new URLSearchParams(location.search).get('q')||'questions.xlsx';
  fetch(url,{cache:'no-store'}).then(r=>r.ok?r.arrayBuffer():null).then(b=>{if(b&&S.phase==='setup')useWorkbook(b,'Loaded from '+url.split('/').pop())}).catch(()=>{})})();

/* ---------- scaling + calibration (same as the Monopoly-style game) ---------- */
let CAL={sy:1,oy:0};try{Object.assign(CAL,JSON.parse(localStorage.getItem('cal2')||'{}'))}catch(e){}
function scaleStage(){const q=new URLSearchParams(location.search);let sx=innerWidth/12566,sy=sx;if(q.has('native'))sx=sy=1;else if(q.has('preview'))sx=sy=Math.min(innerWidth/12566,innerHeight/4516);
  $('stage').style.transform=`translate(0px,${CAL.oy*sy}px) scale(${sx},${sy*CAL.sy})`;showCal()}
function setCal(dsy,doy,reset){if(reset)CAL={sy:1,oy:0};else{CAL.sy=Math.round((CAL.sy+dsy)*1000)/1000;CAL.oy+=doy}try{localStorage.setItem('cal2',JSON.stringify(CAL))}catch(e){}scaleStage()}
function showCal(){const r=$('calread');if(r)r.innerHTML=`Webview size: <b>${innerWidth} × ${innerHeight}</b> px<br>Height scale: <b>${CAL.sy.toFixed(3)}</b> · Vertical shift: <b>${CAL.oy}</b> px`}
const PROJ=[[1,0,0,1718,1080],[2,1718,0,1718,1080],[3,3436,0,1424,1080],[4,4860,0,1423,1080],[5,6283,0,1718,1080],[6,8001,0,1718,1080],[7,9719,0,1424,1080],[8,11143,0,1423,1080],[9,3436,1080,2847,1718],[10,3436,2798,2847,1718]];
function toggleGrid(){let g=$('calib');if(g){g.remove();$('calpanel').remove();return}g=document.createElement('div');g.id='calib';g.style.cssText='position:absolute;left:0;top:0;width:12566px;height:4516px;z-index:999;pointer-events:none';
  g.innerHTML=PROJ.map(([n,x,y,w,h])=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;border:6px solid #fff;background:repeating-linear-gradient(0deg,transparent 0 98px,rgba(255,255,255,.5) 98px 100px),repeating-linear-gradient(90deg,transparent 0 98px,rgba(255,255,255,.5) 98px 100px)"><div style="position:absolute;left:30px;top:30px;font-size:44px;line-height:1.3;background:rgba(0,0,0,.7);padding:10px 18px;color:#fff">Projector ${n}<br>${x},${y} · ${w}×${h}</div></div>`).join('')+`<div style="position:absolute;left:0;top:1074px;width:12566px;height:12px;background:#ff2e88"></div>`;
  $('stage').appendChild(g);const c=document.createElement('div');c.id='calpanel';c.style.cssText='position:absolute;left:3536px;top:1300px;width:2647px;z-index:1000;background:rgba(10,14,40,.92);border:8px solid #ff2e88;border-radius:40px;padding:40px;box-sizing:border-box;color:#fff;font-size:60px;line-height:1.3';
  const B=(t,f)=>`<button class="btn" style="font-size:64px;height:170px;margin:12px" onclick="${f}">${t}</button>`;
  c.innerHTML=`<div style="font-size:80px;font-weight:600;color:#ffd23f">Alignment</div><div>The pink line should sit where the walls meet the floor.</div><div id="calread" style="margin:24px 0;color:#cfd8ff"></div><div>Wall height</div>${B('Taller +','setCal(.005,0)')}${B('Shorter −','setCal(-.005,0)')}<div style="margin-top:20px">Move</div>${B('Down +','setCal(0,10)')}${B('Up −','setCal(0,-10)')}<div style="margin-top:20px">${B('Reset','setCal(0,0,true)')}${B('Close grid','toggleGrid()')}</div>`;
  $('stage').appendChild(c);showCal()}
addEventListener('keydown',e=>{if(e.key==='g'||e.key==='G')toggleGrid()});
if(new URLSearchParams(location.search).has('grid'))setTimeout(toggleGrid,50);
addEventListener('resize',scaleStage);scaleStage();
$('ftitle').innerHTML='THE BETRAYAL';render();
</script>
