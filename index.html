<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Betrayal – Igloo CAVE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#D9B45A;--gold2:#F3D98B;--blood:#B3202F;--silver:#D7DEE8;--ink:#07060a;--glass:rgba(16,12,18,.88);--line:rgba(217,180,90,.28);--txt:#EEE7DA;--muted:#A79F93}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Inter',Arial,sans-serif;color:var(--txt)}
#stage{position:absolute;left:0;top:0;width:12566px;height:4516px;transform-origin:0 0}
.cin{font-family:'Cinzel',Georgia,serif}
#hall{position:absolute;left:0;top:0;width:12566px;height:1080px}
#floor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;overflow:hidden;background:#050407}
#floorcv{position:absolute;left:0;top:0;width:2847px;height:3436px}
.candle{position:absolute;width:26px;height:90px;background:linear-gradient(#efe4cf,#b9a98c);border-radius:6px 6px 3px 3px;z-index:3}
.candle::before{content:'';position:absolute;left:3px;top:-46px;width:20px;height:44px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#fff6c9,#ffb43a 55%,rgba(255,120,0,0) 72%);animation:flick 1.6s infinite alternate}
.candle::after{content:'';position:absolute;left:-140px;top:-200px;width:306px;height:306px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,70,.22),rgba(255,140,40,0) 65%);animation:glow 2.3s infinite alternate;pointer-events:none}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
@keyframes glow{0%{opacity:.7}100%{opacity:1}}
.panel{position:absolute;background:var(--glass);border:3px solid var(--line);border-radius:28px;box-sizing:border-box;padding:26px 34px;overflow:hidden;z-index:4}
.panel h2{margin:0 0 14px;font:800 40px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:4px}
.walltitle{position:absolute;top:34px;height:140px;display:flex;align-items:center;justify-content:center;font:900 96px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:10px;text-shadow:0 0 40px rgba(217,180,90,.35),0 6px 0 #000;z-index:4;text-align:center}
.walltitle small{display:block;font:600 40px Inter,Arial;letter-spacing:2px;color:var(--muted)}
/* houses */
.house{top:200px;width:530px;height:840px;padding:24px;text-align:center}
.house .crest{width:250px;height:280px;margin:0 auto}
.house .crest svg{width:100%;height:100%}
.house .hn{font:800 46px Cinzel,Georgia,serif;margin-top:6px;line-height:1.05}
.house .st{font-size:34px;color:var(--muted);margin-top:10px;min-height:46px}
.house .rec{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.house .rec div{display:flex;justify-content:space-between;font:700 34px Inter,Arial;padding:6px 16px;border-radius:12px;background:rgba(255,255,255,.05)}
.house .rec .y{color:#9FE3B8}.house .rec .n{color:#FF9AA2}
.house.active{border-color:var(--gold);box-shadow:0 0 0 6px var(--gold),0 0 80px rgba(217,180,90,.5)}
.house.shield{border-color:var(--silver);box-shadow:0 0 0 6px var(--silver),0 0 80px rgba(215,222,232,.45)}
.house.empty{opacity:.12}
.badge{display:inline-block;font:800 30px Inter,Arial;padding:6px 16px;border-radius:12px;margin:4px}
.badge.sh{background:var(--silver);color:#111}.badge.po{background:#3a1a40;color:#f0c8ff;border:2px solid #9a5fb0}
.house.ghost .crest{filter:grayscale(1);opacity:.45}
.house .rec i{font-style:normal}.house .rec i.y,.evt i.y{color:#9FE3B8}.house .rec i.n,.evt i.n{color:#FF9AA2}
.evt{display:flex;flex-direction:column;gap:6px;margin-top:6px}.evt div{display:flex;align-items:center;gap:20px;font:600 36px Inter,Arial;padding:2px 16px;border-radius:12px;background:rgba(255,255,255,.04)}.evt div.gh{opacity:.5}
.evt .mini{width:50px;height:56px}.evt .mini svg{width:100%;height:100%}.evt b{width:200px}.evt .marks{width:260px;font-size:44px;letter-spacing:8px}.evt i{font-style:normal}.evt .tot{width:260px;color:var(--muted)}.evt .tag{color:var(--gold2)}.badge.gh{background:#2a2433;color:#d9d2ff;border:2px solid #6c5f8a}
/* front */
#card{left:3476px;top:200px;width:2767px;height:660px;border-color:var(--gold);padding:36px 50px}
#card.flip{animation:flip .55s cubic-bezier(.2,.9,.3,1.15)}
@keyframes flip{0%{transform:perspective(2500px) rotateX(-70deg);opacity:0}100%{transform:none;opacity:1}}
.qh{font:800 34px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:3px;margin-bottom:12px}
.qq{font:700 64px Inter,Arial;line-height:1.15;margin-bottom:22px}
.big{font:900 120px Cinzel,Georgia,serif;line-height:1.05;text-align:center}
.mid{font:700 58px Inter,Arial;line-height:1.25;text-align:center}
.sub{font:600 44px Inter,Arial;line-height:1.3;color:var(--muted);text-align:center;margin-top:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{background:#1d1620;border:3px solid #4a3b44;border-radius:16px;padding:14px 22px;font-size:42px;cursor:pointer;line-height:1.15;display:flex;gap:18px;align-items:center}
.opt b{flex:0 0 auto;font-family:Cinzel,Georgia,serif;color:var(--gold)}
.opt.right{background:#173323;border-color:#9FE3B8}.opt.wrong{background:#3a1218;border-color:#FF9AA2;animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.exp{margin-top:16px;font-size:38px;line-height:1.3;color:var(--muted)}
.oc{display:flex;gap:16px;margin:0 0 18px}.oc span{flex:1;font:700 36px Inter,Arial;padding:10px 18px;border-radius:16px;border:4px solid;text-align:center}
.qclock{float:right;font:800 80px Cinzel,Georgia,serif;color:var(--gold);margin-top:-18px;font-variant-numeric:tabular-nums}
.qclock.low{color:#FF9AA2;animation:bump .5s infinite}
@keyframes bump{30%{transform:scale(1.15)}}
.dock{position:absolute;top:884px;height:180px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px;z-index:6}
.btn{font:800 46px Cinzel,Georgia,serif;border:none;border-radius:18px;padding:0 40px;height:150px;cursor:pointer;background:var(--gold);color:#1a1205;box-shadow:0 6px 0 rgba(0,0,0,.6)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.6)}
.dock.many .btn{font-size:38px;height:96px;padding:0 24px;border-radius:14px}
.btn.go{background:#2E8B57;color:#fff}.btn.no{background:var(--blood);color:#fff}.btn.alt{background:#3E4A7A;color:#fff}.btn.sil{background:var(--silver);color:#111}
.btn.sm{font-size:32px;height:76px;padding:0 24px;border-radius:12px}
.btn .mini{width:60px;height:66px;display:inline-block;vertical-align:middle;margin-right:10px}
.btn .mini svg{width:100%;height:100%}
.starters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.starters div{font:600 40px Inter,Arial;padding:10px 20px;border-radius:16px;border:3px dashed var(--line);color:var(--gold2)}
.ev{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.ev div{font:700 40px Inter,Arial;padding:10px 20px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.ev .mini{width:56px;height:62px}.ev svg{width:100%;height:100%}
/* right + back */
#pot{left:6323px;top:200px;width:1700px;height:840px;text-align:center;padding-top:50px}
#pot .amt{font:900 260px Cinzel,Georgia,serif;color:var(--gold2);text-shadow:0 0 80px rgba(243,217,139,.45);line-height:1.1;font-variant-numeric:tabular-nums}
#pot .amt.bump{animation:bump .7s}
#status{left:8063px;top:200px;width:1616px;height:840px}
.steps{display:flex;flex-direction:column;gap:12px;margin:10px 0 24px}
.steps div{font:800 48px Cinzel,Georgia,serif;color:#5d5560;padding:8px 20px;border-radius:14px}
.steps div.on{color:#1a1205;background:var(--gold)}
.stat{font:600 40px Inter,Arial;margin:8px 0;color:var(--txt)}.stat b{color:var(--gold2)}
#clock{left:9759px;top:200px;width:1360px;height:420px}
#clock .t{font:900 150px Cinzel,Georgia,serif;line-height:1;font-variant-numeric:tabular-nums}
#chron{left:9759px;top:650px;width:1360px;height:390px}
#chron div{font-size:32px;line-height:1.25;padding:7px 0;border-bottom:1px solid var(--line)}
#rules{left:11159px;top:200px;width:1367px;height:840px}
#rules p{font-size:36px;line-height:1.3;margin:0 0 16px}
#rules b{color:var(--gold2)}
/* setup */
#setup{left:3476px;top:186px;width:2767px;height:880px;border-color:var(--gold);z-index:7}
.pick{display:flex;gap:16px;flex-wrap:wrap}
.co{width:240px;height:240px;border-radius:20px;background:#1d1620;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px 14px;box-sizing:border-box;position:relative;border:5px solid transparent;text-align:center}
.co .mini{width:140px;height:156px;margin-bottom:4px}.co .mini svg{width:100%;height:100%}
.co b{font:800 32px Cinzel,Georgia,serif}
.co.on{border-color:var(--gold);background:#2c2214}
.setrow{font-size:38px;margin:14px 0 10px;color:var(--muted)}
.chooser{display:flex;gap:14px;flex-wrap:wrap}
.hide{display:none!important}
/* floor */
#fzones{position:absolute;inset:0;display:grid;gap:24px;padding:24px;box-sizing:border-box;z-index:2}
.fz{border-radius:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px;box-sizing:border-box;color:#fff;border:16px solid rgba(255,255,255,.35);transition:opacity .5s,transform .5s;cursor:pointer;overflow:hidden}
.fz .fl{font:900 520px/1 Cinzel,Georgia,serif;display:flex;align-items:center;gap:60px}
.fz .fl i{font-style:normal;font-size:300px;opacity:.9}
.fz .ft{font:700 130px/1.15 Inter,Arial;margin-top:40px;max-height:900px;overflow:hidden}
.fz.dark{color:#0a0a0a}.fz.right{border:40px solid #fff;transform:scale(1.03);box-shadow:0 0 200px #fff}
.fz.dim{opacity:.15}.fz.picked{opacity:.55;border-style:dashed}
.fz .fv{font:900 200px Cinzel,Georgia,serif;margin-top:30px}
#fbig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3;pointer-events:none;padding:120px;box-sizing:border-box}
#fbig .big{font-size:330px}#fbig .mid{font-size:150px}
#fbig .crestbig{width:1300px;height:1450px}#fbig .crestbig svg{width:100%;height:100%}
/* night / dark overlay over the walls */
#dark{position:absolute;left:0;top:0;width:12566px;height:4516px;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s;z-index:20}
#dark.on{opacity:.82}
.night #card,.night .dock,.night #floor,.night #ftitle{z-index:21}
.reveal{position:absolute;top:0;height:1080px;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:30;pointer-events:none;text-align:center}
.reveal .big{font-size:260px;letter-spacing:10px;animation:rv 1.4s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rv{0%{transform:scale(2.4);opacity:0;filter:blur(30px)}100%{transform:none;opacity:1;filter:none}}
.traitor{color:#ff5a66;text-shadow:0 0 90px rgba(255,40,60,.7),0 8px 0 #000}
.faithful{color:#f4f7ff;text-shadow:0 0 90px rgba(200,220,255,.7),0 8px 0 #000}
#banner{position:absolute;left:3436px;top:0;width:2847px;height:1080px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40}
#banner div{font:900 180px Cinzel,Georgia,serif;color:var(--gold2);-webkit-text-stroke:6px #000;paint-order:stroke fill;animation:banner 2.6s ease-out forwards;text-align:center;line-height:1}
@keyframes banner{0%{transform:scale(1.5);opacity:0;letter-spacing:50px}18%{transform:scale(1);opacity:1;letter-spacing:6px}85%{opacity:1}100%{opacity:0}}
.count{font:900 600px Cinzel,Georgia,serif;color:var(--gold2);animation:rv .6s}
/* trailer intro */
#intro{position:absolute;left:0;top:0;width:12566px;height:4516px;z-index:85;pointer-events:none}
.iw{position:absolute;top:0;height:1080px;background:rgba(4,3,6,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:40px;overflow:hidden}
#ifloor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(4,3,6,.6)}
.it{font:900 185px Cinzel,Georgia,serif;color:#fff;line-height:1.08;letter-spacing:4px}.it.gold{color:var(--gold2)}
.is{font:600 62px Inter,Arial;color:var(--muted);margin-top:26px;line-height:1.25}
.in{animation:inz .7s cubic-bezier(.2,.9,.3,1.1)}
@keyframes inz{0%{transform:scale(1.4);opacity:0;filter:blur(24px)}100%{transform:none;opacity:1;filter:none}}
.icrests{display:flex;gap:40px;justify-content:center}.icrests span{width:300px;height:336px;animation:inz .6s both}.icrests svg{width:100%;height:100%}
#ipause{position:absolute;left:5440px;top:960px;pointer-events:auto;z-index:90;width:400px}
#iskip{position:absolute;left:5860px;top:960px;pointer-events:auto;z-index:90}
#ipaused{position:absolute;left:3436px;top:0;width:2847px;height:940px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(3,2,5,.88);z-index:89;font:900 220px Cinzel,Georgia,serif;color:#fff;pointer-events:none}
#ipaused div{font:600 64px Inter,Arial;color:var(--muted);margin-top:20px}
</style>
</head>

rying to trick you into giving information"}, {"L": "B", "text": "A type of computer fan"}, {"L": "C", "text": "A fast internet connection"}, {"L": "D", "text": "A way to back up files"}], "ans": "A", "exp": "Phishing messages pretend to be trusted organisations."}, {"id": "s32", "topic": "U4", "level": 2, "q": "Which of these is an input device?", "opts": [{"L": "A", "text": "Monitor"}, {"L": "B", "text": "Printer"}, {"L": "C", "text": "Keyboard"}, {"L": "D", "text": "Speaker"}], "ans": "C", "exp": "Input devices send data into the computer."}, {"id": "s33", "topic": "U4", "level": 3, "q": "Why should you install software updates?", "opts": [{"L": "A", "text": "They make the screen brighter"}, {"L": "B", "text": "They fix security weaknesses"}, {"L": "C", "text": "They delete old files"}, {"L": "D", "text": "They slow down hackers' internet"}], "ans": "B", "exp": "Updates patch known vulnerabilities."}, {"id": "s34", "topic": "U5", "level": 2, "q": "What does CPR stand for?", "opts": [{"L": "A", "text": "Cardiopulmonary resuscitation"}, {"L": "B", "text": "Central pulse recovery"}, {"L": "C", "text": "Chest pressure routine"}, {"L": "D", "text": "Cardiac pressure relief"}], "ans": "A", "exp": "CPR keeps blood and oxygen moving until help arrives."}, {"id": "s35", "topic": "U5", "level": 2, "q": "Which nutrient is the body's main source of energy?", "opts": [{"L": "A", "text": "Carbohydrates"}, {"L": "B", "text": "Vitamins"}, {"L": "C", "text": "Minerals"}, {"L": "D", "text": "Fibre"}], "ans": "A", "exp": "Carbohydrates are broken down into glucose for energy."}, {"id": "s36", "topic": "U5", "level": 3, "q": "Why is warming up before exercise important?", "opts": [{"L": "A", "text": "It burns more calories"}, {"L": "B", "text": "It prepares muscles and reduces injury risk"}, {"L": "C", "text": "It makes you taller"}, {"L": "D", "text": "It isn't important"}], "ans": "B", "exp": "Warm muscles are more flexible and less likely to strain."}, {"id": "s37", "topic": "U6", "level": 2, "q": "What is the difference between gross and net pay?", "opts": [{"L": "A", "text": "Gross is after deductions"}, {"L": "B", "text": "Net is after deductions"}, {"L": "C", "text": "They're the same"}, {"L": "D", "text": "Net includes bonuses"}], "ans": "B", "exp": "Net pay is what actually reaches your bank account."}, {"id": "s38", "topic": "U6", "level": 2, "q": "What does APR show you?", "opts": [{"L": "A", "text": "The yearly cost of borrowing"}, {"L": "B", "text": "Your account number"}, {"L": "C", "text": "Your credit score"}, {"L": "D", "text": "Your monthly salary"}], "ans": "A", "exp": "APR helps you compare loans and credit cards."}, {"id": "s39", "topic": "U6", "level": 3, "q": "Why is an emergency fund useful?", "opts": [{"L": "A", "text": "It covers unexpected costs without borrowing"}, {"L": "B", "text": "It earns the highest interest"}, {"L": "C", "text": "It improves your payslip"}, {"L": "D", "text": "It replaces insurance"}], "ans": "A", "exp": "Savings for emergencies stop surprise bills becoming debt."}, {"id": "s40", "topic": "U7", "level": 2, "q": "What does 'carbon footprint' mean?", "opts": [{"L": "A", "text": "Total greenhouse gases caused by a person or activity"}, {"L": "B", "text": "The size of your shoes"}, {"L": "C", "text": "The amount of coal in the UK"}, {"L": "D", "text": "A type of tree"}], "ans": "A", "exp": "It measures the climate impact of what we do."}, {"id": "s41", "topic": "U7", "level": 2, "q": "Which light bulb uses the least energy?", "opts": [{"L": "A", "text": "Incandescent"}, {"L": "B", "text": "Halogen"}, {"L": "C", "text": "LED"}, {"L": "D", "text": "Candle"}], "ans": "C", "exp": "LEDs use a fraction of the energy of older bulbs."}, {"id": "s42", "topic": "U7", "level": 3, "q": "Why does reducing food waste help the environment?", "opts": [{"L": "A", "text": "It saves the energy, water and emissions used to produce food"}, {"L": "B", "text": "Food waste is radioactive"}, {"L": "C", "text": "It makes ecieve"}, {"L": "B", "text": "Receive"}, {"L": "C", "text": "Receeve"}, {"L": "D", "text": "Riceive"}], "ans": "B", "exp": "'I before e except after c'."}, {"id": "s55", "topic": "ENGLISH", "level": 1, "q": "Fill the gap: '___ going to be late.'", "opts": [{"L": "A", "text": "Their"}, {"L": "B", "text": "There"}, {"L": "C", "text": "They're"}, {"L": "D", "text": "Thier"}], "ans": "C", "exp": "They're = they are."}, {"id": "s56", "topic": "ENGLISH", "level": 1, "q": "Which is the best greeting for a formal email to someone you don't know?", "opts": [{"L": "A", "text": "Hiya"}, {"L": "B", "text": "Dear Sir or Madam"}, {"L": "C", "text": "Yo"}, {"L": "D", "text": "Alright?"}], "ans": "B", "exp": "Formal emails need a formal greeting."}, {"id": "s57", "topic": "ENGLISH", "level": 1, "q": "Which punctuation mark ends a question?", "opts": [{"L": "A", "text": "Full stop"}, {"L": "B", "text": "Exclamation mark"}, {"L": "C", "text": "Question mark"}, {"L": "D", "text": "Comma"}], "ans": "C", "exp": "Questions end with a question mark."}, {"id": "s58", "topic": "POPQUIZ", "level": 1, "q": "True or false: the Great Wall of China is easily visible from the Moon.", "opts": [{"L": "A", "text": "True"}, {"L": "B", "text": "False"}], "ans": "B", "exp": "It's far too narrow to see from the Moon."}, {"id": "s59", "topic": "POPQUIZ", "level": 1, "q": "True or false: lightning can strike the same place twice.", "opts": [{"L": "A", "text": "True"}, {"L": "B", "text": "False"}], "ans": "A", "exp": "Tall buildings are struck many times a year."}, {"id": "s60", "topic": "POPQUIZ", "level": 1, "q": "True or false: bats are blind.", "opts": [{"L": "A", "text": "True"}, {"L": "B", "text": "False"}], "ans": "B", "exp": "Bats can see; many also use echolocation."}, {"id": "s61", "topic": "POPQUIZ", "level": 1, "q": "True or false: botanically, a tomato is a fruit.", "opts": [{"L": "A", "text": "True"}, {"L": "B", "text": "False"}], "ans": "A", "exp": "It develops from the flower and contains seeds."}, {"id": "s62", "topic": "POPQUIZ", "level": 1, "q": "True or false: goldfish only have a three-second memory.", "opts": [{"L": "A", "text": "True"}, {"L": "B", "text": "False"}], "ans": "B", "exp": "Studies show goldfish can remember things for months."}, {"id": "s63", "topic": "REALWORLD", "level": 1, "q": "You're running 10 minutes late for work. What should you do?", "opts": [{"L": "A", "text": "Say nothing"}, {"L": "B", "text": "Let your manager know as soon as possible"}, {"L": "C", "text": "Go home"}, {"L": "D", "text": "Post about it online"}], "ans": "B", "exp": "Telling your manager early shows reliability."}, {"id": "s64", "topic": "REALWORLD", "level": 1, "q": "A colleague offers you their login to 'save time'. What should you do?", "opts": [{"L": "A", "text": "Use it"}, {"L": "B", "text": "Politely refuse and use your own login"}, {"L": "C", "text": "Share it with others"}, {"L": "D", "text": "Write it on a sticky note"}], "ans": "B", "exp": "Sharing logins breaks security policies."}, {"id": "s65", "topic": "REALWORLD", "level": 1, "q": "You make a mistake that affects a customer. What's the best approach?", "opts": [{"L": "A", "text": "Hide it"}, {"L": "B", "text": "Own it, apologise and fix it"}, {"L": "C", "text": "Blame a colleague"}, {"L": "D", "text": "Wait to see if they notice"}], "ans": "B", "exp": "Owning mistakes builds trust."}, {"id": "s66", "topic": "REALWORLD", "level": 1, "q": "An email from 'IT' urgently asks for your password. What do you do?", "opts": [{"L": "A", "text": "Reply with it"}, {"L": "B", "text": "Report it as phishing"}, {"L": "C", "text": "Forward it to friends"}, {"L": "D", "text": "Ignore all IT emails forever"}], "ans": "B", "exp": "Real IT teams never ask for your password."}, {"id": "s67", "topic": "REALWORLD", "level": 1, "q": "Your manager gives feedback you disagree with. Best response?", "opts": [{"L": "A", "text": "Walk out"}, {"L": "B", "text": "Listen, ask questions and discuss calmly"}, {"L": "C", "te iverpool."}, {"id": "s82", "topic": "2B", "level": 1, "q": "Which river flows through London?", "opts": [{"L": "A", "text": "Severn"}, {"L": "B", "text": "Thames"}, {"L": "C", "text": "Mersey"}, {"L": "D", "text": "Tyne"}], "ans": "B", "exp": "The Thames flows through London."}, {"id": "s83", "topic": "2B", "level": 1, "q": "Which ocean lies between Europe and North America?", "opts": [{"L": "A", "text": "Pacific"}, {"L": "B", "text": "Indian"}, {"L": "C", "text": "Atlantic"}, {"L": "D", "text": "Arctic"}], "ans": "C", "exp": "The Atlantic separates them."}, {"id": "s84", "topic": "2C", "level": 1, "q": "What is the capital of France?", "opts": [{"L": "A", "text": "Lyon"}, {"L": "B", "text": "Paris"}, {"L": "C", "text": "Marseille"}, {"L": "D", "text": "Nice"}], "ans": "B", "exp": "Paris is the capital of France."}, {"id": "s85", "topic": "2C", "level": 1, "q": "What is the capital of Japan?", "opts": [{"L": "A", "text": "Osaka"}, {"L": "B", "text": "Kyoto"}, {"L": "C", "text": "Tokyo"}, {"L": "D", "text": "Hiroshima"}], "ans": "C", "exp": "Tokyo is Japan's capital."}, {"id": "s86", "topic": "3A", "level": 1, "q": "Which Tudor queen was known as the Virgin Queen?", "opts": [{"L": "A", "text": "Mary I"}, {"L": "B", "text": "Elizabeth I"}, {"L": "C", "text": "Anne Boleyn"}, {"L": "D", "text": "Jane Grey"}], "ans": "B", "exp": "Elizabeth I never married."}, {"id": "s87", "topic": "3A", "level": 1, "q": "Which Tudor king founded the Church of England?", "opts": [{"L": "A", "text": "Henry VII"}, {"L": "B", "text": "Henry VIII"}, {"L": "C", "text": "Edward VI"}, {"L": "D", "text": "Richard III"}], "ans": "B", "exp": "Henry VIII broke from Rome in the 1530s."}, {"id": "s88", "topic": "3B", "level": 1, "q": "Who was the UK Prime Minister for most of World War II?", "opts": [{"L": "A", "text": "Neville Chamberlain"}, {"L": "B", "text": "Winston Churchill"}, {"L": "C", "text": "Clement Attlee"}, {"L": "D", "text": "David Lloyd George"}], "ans": "B", "exp": "Churchill led the pic": "4B", "level": 1, "q": "Which part stores files permanently?", "opts": [{"L": "A", "text": "RAM"}, {"L": "B", "text": "CPU"}, {"L": "C", "text": "Hard drive / SSD"}, {"L": "D", "text": "Monitor"}], "ans": "C", "exp": "Hard drives and SSDs keep data when the power is off."}, {"id": "s96", "topic": "4C", "level": 1, "q": "What does a web browser do?", "opts": [{"L": "A", "text": "Displays web pages"}, {"L": "B", "text": "Prints documents"}, {"L": "C", "text": "Cools the computer"}, {"L": "D", "text": "Stores electricity"}], "ans": "A", "exp": "Browsers like Chrome display websites."}, {"id": "s97", "topic": "4C", "level": 1, "q": "What does 'URL' mean?", "opts": [{"L": "A", "text": "Universal Resource Locator (a web address)"}, {"L": "B", "text": "User Request Line"}, {"L": "C", "text": "Unified Router Link"}, {"L": "D", "text": "Upload Rate Limit"}], "ans": "A", "exp": "A URL is the address of a web page."}, {"id": "s98", "topic": "5A", "level": 1, "q": "Which food group mainly helps build muscle?", "opts": [{"L": "A", "text": "Protein"}, {"L": "B", "text": "Sugar"}, {"L": "C", "text": "Fat"}, {"L": "D", "text": "Salt"}], "ans": "A", "exp": "Protein helps the body build and repair muscle."}, {"id": "s99", "topic": "5A", "level": 1, "q": "How much water should adults aim to drink a day (NHS)?", "opts": [{"L": "A", "text": "1–2 glasses"}, {"L": "B", "text": "6–8 glasses"}, {"L": "C", "text": "15 glasses"}, {"L": "D", "text": "20 glasses"}], "ans": "B", "exp": "The NHS suggests 6 to 8 glasses a day."}, {"id": "s100", "topic": "5B", "level": 1, "q": "What position should an unconscious, breathing person be put in?", "opts": [{"L": "A", "text": "Sitting up"}, {"L": "B", "text": "Recovery position"}, {"L": "C", "text": "Standing"}, {"L": "D", "text": "Face down"}], "ans": "B", "exp": "The recovery position keeps the airway open."}, {"id": "s101", "topic": "5B", "level": 1, "q": "What should you do first for a minor burn?", "opts": [{"L": "A", "text": "Apply butter"}, {"L": "B", "text": "Cool it under running water"}, {"L": "C", "text": "Pop any blisters"}, {"L": "D", "text": "Cover with ice"}], "ans": "B", "exp": "Cool running water for 20 minutes."}, {"id": "s102", "topic": "5C", "level": 1, "q": "What does 'cardio' exercise mainly improve?", "opts": [{"L": "A", "text": "Heart and lungs"}, {"L": "B", "text": "Hair growth"}, {"L": "C", "text": "Eyesight"}, {"L": "D", "text": "Memory only"}], "ans": "A", "exp": "Cardio strengthens the heart and lungs."}, {"id": "s103", "topic": "5C", "level": 1, "q": "Why is rest important after exercise?", "opts": [{"L": "A", "text": "Muscles repair and grow"}, {"L": "B", "text": "It isn't"}, {"L": "C", "text": "To lose fitness"}, {"L": "D", "text": "To burn more calories"}], "ans": "A", "exp": "Recovery lets muscles repair."}, {"id": "s104", "topic": "6A", "level": 1, "q": "If you earn £1,200 a month and spend £1,350, what happens?", "opts": [{"L": "A", "text": "You save £150"}, {"L": "B", "text": "You're £150 short"}, {"L": "C", "text": "You break even"}, {"L": "D", "text": "You get a bonus"}], "ans": "B", "exp": "Spending more than you earn means a shortfall."}, {"id": "s105", "topic": "6A", "level": 1, "q": "Which is a 'need' rather than a 'want'?", "opts": [{"L": "A", "text": "New trainers"}, {"L": "B", "text": "Rent"}, {"L": "C", "text": "Concert tickets"}, {"L": "D", "text": "Takeaway"}], "ans": "B", "exp": "Housing is an essential need."}, {"id": "s106", "topic": "6B", "level": 1, "q": "What is income tax?", "opts": [{"L": "A", "text": "Tax on what you earn"}, {"L": "B", "text": "Tax on food"}, {"L": "C", "text": "A savings account"}, {"L": "D", "text": "A loan"}], "ans": "A", "exp": "Income tax is taken from your earnings."}, {"id": "s107", "topic": "6B", "level": 1, "q": "What is a P60?", "opts": [{"L": "A", "text": "A summary of your yearly pay and tax"}, {"L": "B", "text": "A bank card"}, {"L": "C", "text": "A job advert"}, {"L": "D", "text": "A type of loan"}], "ans": "A", "exp": "Employers give you a P60 each tax year."}, {"id": "s108", "topic": "6C", "level": 1, "q": "Which account usually pays the most interest?", "opts": [{"L": "A", "text": "Current account"}, {"L": "B", "text": "Savings account"}, {"L": "C", "text": "Overdraft"}, {"L": "D", "text": "Credit card"}], "ans": "B", "exp": "Savings accounts reward you for keeping money in them."}, {"id": "s109", "topic": "6C", "level": 1, "q": "What is an overdraft?", "opts": [{"L": "A", "text": "Extra savings"}, {"L": "B", "text": "Borrowing from your bank account below £0"}, {"L": "C", "text": "A pay rise"}, {"L": "D", "text": "A tax refund"}], "ans": "B", "exp": "An overdraft lets you spend money you don't have, often with fees."}, {"id": "s110", "topic": "7A", "level": 1, "q": "What does the recycling symbol with three arrows mean?", "opts": [{"L": "A", "text": "Reduce, reuse, recycle"}, {"L": "B", "text": "Stop, look, listen"}, {"L": "C", "text": "Buy, sell, trade"}, {"L": "D", "text": "Hot, warm, cold"}], "ans": "A", "exp": "The three arrows show the recycling loop."}, {"id": "s111", "topic": "7A", "level": 1, "q": "Which of these takes longest to break down?", "opts": [{"L": "A", "text": "Banana peel"}, {"L": "B", "text": "Paper"}, {"L": "C", "text": "Plastic bottle"}, {"L": "D", "text": "Apple core"}], "ans": "C", "exp": "Plastic can take hundreds of years."}, {"id": "s112", "topic": "7B", "level": 1, "q": "Which of these produces electricity from sunlight?", "opts": [{"L": "A", "text": "Wind turbine"}, {"L": "B", "text": "Solar panel"}, {"L": "C", "text": "Dam"}, {"L": "D", "text": "Coal plant"}], "ans": "B", "exp": "Solar panels convert sunlight to electricity."}, {"id": "s113", "topic": "7B", "level": 1, "q": "Which uses the least energy to dry clothes?", "opts": [{"L": "A", "text": "Tumble dryer"}, {"L": "B", "text": "Washing line"}, {"L": "C", "text": "Radiator"}, {"L": "D", "text": "Hairdryer"}], "ans": "B", "exp": "Air drying on a line uses no electricity."}, {"id": "s114", "topic": "7C", "level": 1, "q": "What is global warming?", "opts": [{"L": "A", "text": "Earth's average temperature rising"}, {"L": "B", "text": "Summer getting longer"}, {"L": "C", "text": "The Sun moving closer"}, {"L": "D", "text": "More rain in winter only"}], "ans": "A", "exp": "Greenhouse gases trap heat."}, {"id": "s115", "topic": "7C", "level": 1, "q": "Which helps reduce carbon emissions?", "opts": [{"L": "A", "text": "Driving more"}, {"L": "B", "text": "Using public transport"}, {"L": "C", "text": "Leaving lights on"}, {"L": "D", "text": "Flying more"}], "ans": "B", "exp": "Shared transport cuts emissions per person."}, {"id": "s116", "topic": "8A", "level": 1, "q": "How long should a CV usually be?", "opts": [{"L": "A", "text": "1–2 pages"}, {"L": "B", "text": "5 pages"}, {"L": "C", "text": "10 pages"}, {"L": "D", "text": "Half a line"}], "ans": "A", "exp": "Most employers prefer one or two pages."}, {"id": "s117", "topic": "8A", "level": 1, "q": "Which email address looks most professional on a CV?", "opts": [{"L": "A", "text": "partyking99@mail.com"}, {"L": "B", "text": "j.smith@mail.com"}, {"L": "C", "text": "coolkid@mail.com"}, {"L": "D", "text": "xXgamerXx@mail.com"}], "ans": "B", "exp": "Use a simple name-based address."}, {"id": "s118", "topic": "8B", "level": 1, "q": "What should you do before an interview?", "opts": [{"L": "A", "text": "Research the company"}, {"L": "B", "text": "Arrive late"}, {"L": "C", "text": "Wear anything"}, {"L": "D", "text": "Forget your CV"}], "ans": "A", "exp": "Preparation shows you're serious."}, {"id": "s119", "topic": "8B", "level": 1, "q": "What does good body language in an interview include?", "opts": [{"L": "A", "text": "Eye contact and sitting up"}, {"L": "B", "text": "Folding arms"}, {"L": "C", "text": "Looking at your phone"}, {"L": "D", "text": "Slouching"}], "ans": "A", "exp": "Positive body language shows confidence."}], "settings": {"name": "The Betrayal", "pot": 500, "discuss": 3, "qper": 3, "secs": 45}};

/* the host never talks over himself: lines queue; big moments first; stale small comments are dropped */
const RECENT=[],HQ=[];let hostGap=false;
const PRIO={wastraitor:3,wasfaithful:3,faithfulwin:4,traitorwin:4,allfound:4,murdered:3,close:3,topen:3,tclose:3,allopen:3,night:3,nighttraitors:3,nightclose:3,breakfast:3,stand:3,vote:3,point:3,endvote:3,revealyou:3,recruit:3,shield:2,roundtable:2,finalrt:3,mission:2,correct:2,wrong:2,poisoned:3,tie:3,lockin:3};
function host(ev,delay=0,chance=1){const list=HOST[ev];if(!list||Math.random()>chance)return;
  setTimeout(()=>{if(muted)return;if(talking()){HQ.push({ev,p:PRIO[ev]||1,t:Date.now()});HQ.sort((a,b)=>b.p-a.p||a.t-b.t);if(HQ.length>3)HQ.length=3;return}sayNow(ev)},delay)}
function sayNow(ev){const list=HOST[ev];let pool=list.filter(k=>OK[k]&&!RECENT.includes(k));if(!pool.length)pool=list.filter(k=>OK[k]);if(!pool.length){nextHost();return}
  const k=pool[rnd(pool.length)];RECENT.push(k);if(RECENT.length>10)RECENT.shift();hostNow=AUD[k];hostNow.currentTime=0;hostNow.volume=1;duck(true);
  hostNow.onended=()=>{duck(false);nextHost()};hostNow.play().catch(()=>nextHost())}
function nextHost(){if(muted){HQ.length=0;return}while(HQ.length){const h=HQ.shift();if(Date.now()-h.t<(h.p>=3?15000:h.p===2?7000:3500)){hostGap=true;setTimeout(()=>{hostGap=false;sayNow(h.ev)},450);return}}}

/* ---------- music: generative dark castle score (no file needed). Moods: day, tense, night ---------- */
const MUS={on:true,gain:null,bus:null,next:0,step:0,timer:0,base:.22,mood:'day'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[50,53,57,62],[46,50,53,58],[43,46,50,55],[45,49,52,57]]; // Dm  Bb  Gm  A
function startMusic(){if(!MUS.on||muted||MUS.gain||!ac())return;
  MUS.gain=actx.createGain();MUS.gain.gain.value=.0001;MUS.gain.connect(actx.destination);
  MUS.bus=actx.createBiquadFilter();MUS.bus.type='lowpass';MUS.bus.frequency.value=1400;MUS.bus.connect(MUS.gain);
  MUS.gain.gain.setTargetAtTime(MUS.base,actx.currentTime,2);MUS.next=actx.currentTime+.2;MUS.step=0;MUS.timer=setInterval(schedMusic,60)}
function stopMusic(){if(!MUS.gain)return;clearInterval(MUS.timer);const g=MUS.gain;g.gain.setTargetAtTime(.0001,actx.currentTime,.4);setTimeout(()=>g.disconnect(),2000);MUS.gain=null}
function duck(on){if(MUS.gain)MUS.gain.gain.setTargetAtTime(on?MUS.base*.15:MUS.base,actx.currentTime,.4)}
function mood(m){MUS.mood=m;if(MUS.bus)MUS.bus.frequency.setTargetAtTime(m==='tense'?2200:m==='night'?700:1400,actx.currentTime,1)}
function schedMusic(){const beat=1;while(MUS.next<actx.currentTime+.4){musStep(MUS.step,MUS.next);MUS.next+=beat/2;MUS.step++}}
function pad(f,t,dur,vol,type='sawtooth'){const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();o.type=type;o2.type=type;o.frequency.value=f;o2.frequency.value=f;o2.detune.value=9;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.35);g.gain.setTargetAtTime(.0001,t+dur*.7,dur*.25);o.connect(g);o2.connect(g);g.connect(MUS.bus);o.start(t);o2.start(t);o.stop(t+dur*1.6);o2.stop(t+dur*1.6)}
function thud(t,vol,f0=90,f1=38,dur=.5){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MUS.gain);o.start(t);o.stop(t+dur)}
function musStep(s,t){const b=s%16,ch=PROG[Math.floor(s/16)%4],m=MUS.mood;
  if(b===0){ch.forEach((n,i)=>pad(mtof(n),t,8.5,m==='night'?.012:.02,i?'triangle':'sawtooth'));pad(mtof(ch[0]-24),t,8.5,.05,'sine')}
  if(m!=='night'&&b===0)thud(t,.5,70,32,1.2);
  if(m==='tense'&&(b%2===0)){thud(t,.45,62,40,.22);thud(t+.22,.3,58,38,.2)}
  if(m==='day'&&(b===6||b===12)&&Math.random()<.6)pad(mtof(ch[3]+12+[0,2,3][rnd(3)]),t,1.8,.012,'sine');
  if(m==='night'&&b===8&&Math.random()<.5)pad(mtof(ch[0]+36),t,3,.008,'sine')}

function pickQ(){const pref=Math.min(3,S.round);const qs=BANK.questions;
  const tiers=[qs.filter(q=>q.level===pref),qs.filter(q=>Math.abs(q.level-pref)===1),qs];
  for(const t of tiers){const fresh=t.filter(q=>!S.used.has(q.id));if(fresh.length){const q=fresh[rnd(fresh.length)];S.used.add(q.id);return q}}
  S.used.clear();const q=qs[rnd(qs.length)];if(q)S.used.add(q.id);return q}

/* ---------- setup ---------- */
function togglePick(id){const i=S.picked.indexOf(id);if(i>=0){if(S.picked.length>3)S.picked.splice(i,1)}else S.picked.push(id);if(S.picked.length<5)S.traitorsStart=1;render()}
const QSECS=()=>+BANK.settings.secs||45,QPER=()=>+BANK.settings.qper||3;
const roundsCap=n=>Math.max(1,Math.min(roundsFor(S.minutes),n-2));
const living=()=>S.teams.map((t,k)=>k).filter(k=>!S.teams[k].ghost);
const tLeft=()=>S.traitors-S.bannedT;
const voters=()=>living().filter(k=>k!==S.poisoned);
function traitorsControl(){const L=living().length,T=tLeft();return T>0&&T>=L-T}
function startGame(){ac();startMusic();hush();
  S.teams=S.picked.map(id=>({...hById(id),ghost:false,out:null,role:null,rec:[],ok:0,att:0}));S.rounds=roundsCap(S.teams.length);S.round=1;S.pot=0;S.traitors=S.traitorsStart;S.daggers=S.traitorsStart;
  S.bannedT=0;S.bannedF=0;S.murdered=0;S.shield=-1;S.poisoned=-1;S.used=new Set();S.log=[];S.chron=[];S.elapsed=0;S.final=false;S.paused=false;S.winner=null;S.votes={};S.revote=false;S.voteAmong=null;
  $('setup').classList.add('hide');chron(`The game begins: ${S.teams.length} houses. ${S.traitors===1?'One house is':'Two houses are'} secretly the Traitors.`);choosing()}

/* ---------- scripted sequences (eyes-closed moments) ---------- */
let stepTimer=0;
function scene({title,card,floor,say,dark,mood:md,auto,next,btns,loops}){clearTimeout(stepTimer);S.step=title;
  if(title)$('ftitle').innerHTML=title;if(card!=null){$('card').innerHTML=card;flipCard()}floorBig(floor||'');setDark(dark);if(md)mood(md);
  stopLoops();(loops||[]).forEach(k=>loop(k,true));if(say)host(say);
  setActs(btns||(next?[act(next.label,next.fn,next.cls||'')]:[]),[]);render();
  if(auto)stepTimer=setTimeout(function w(){if(S.paused){stepTimer=setTimeout(w,500);return}auto.fn()},auto.ms)}
function flipCard(){const c=$('card');c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip')}
const tutor=t=>`<div class="sub" style="color:var(--gold2);font-size:40px;margin-top:24px">TUTOR: ${t}</div>`;
const hb=k=>`<span class="mini">${crest(S.teams[k].id)}</span>${S.teams[k].short}`;

function choosing(){S.phase='choosing';
  scene({title:'THE CHOOSING',card:`<div class="big">Close your eyes.</div><div class="mid" style="margin-top:30px">Everyone. Heads down. No peeking.</div>`,floor:`<div class="big">EYES<br>CLOSED</div>`,
    say:'close',dark:true,mood:'night',loops:['sfx_heartbeat'],next:{label:'Next ›',fn:choose2}})}
function choose2(){const two=S.traitors>1;
  scene({title:'THE CHOOSING',card:`<div class="big" style="font-size:96px">The Traitors are being chosen…</div><div class="mid" style="margin-top:20px">Stay still. Keep your eyes closed.</div>${tutor(`choose <b>${two?'TWO houses':'ONE house'}</b> and tap every member of ${two?'them':'it'} on the shoulder. ${two?'They are':'That house is'} the Traitors. Remember which.`)}`,
    say:'choosing',dark:true,loops:['sfx_heartbeat'],next:{label:'Done ›',fn:choose3}})}
function choose3(){let n=10;const tick=()=>{if(!S.step.startsWith('THE CHOOSING'))return;$('ccount')&&($('ccount').textContent=n);if(n-->0)setTimeout(tick,1000)};
  scene({title:'THE CHOOSING',card:`<div class="big" style="color:#ff6b75">Traitors… open your eyes.</div><div class="mid" style="margin-top:20px">${S.traitors>1?'Look around. Find the other Traitor house.':'Look at your housemates. You are the Traitors.'}</div><div class="big" id="ccount" style="margin-top:20px">10</div>`,
    say:'topen',dark:true,auto:{ms:11000,fn:choose4},next:{label:'Skip ›',fn:choose4,cls:'alt'}});tick()}
function choose4(){scene({title:'THE CHOOSING',card:`<div class="big">Traitors, close your eyes.</div>`,say:'tclose',dark:true,auto:{ms:5000,fn:choose5},next:{label:'Skip ›',fn:choose5,cls:'alt'}})}
function choose5(){play('sfx_gong',{vol:.8});const two=S.traitors>1;
  scene({title:'THE CHOOSING',card:`<div class="big">Everyone… open your eyes.</div><div class="mid" style="margin-top:30px;color:#ff6b75">${two?'Two houses':'One house'} among you ${two?'are':'is'} the Traitors.</div><div class="sub">Every right answer grows the prize pot. Banish the Traitors before the end – or they steal it all.</div>`,
    floor:'',say:'allopen',dark:false,mood:'day',next:{label:'Begin the first mission ›',fn:startMission,cls:'go'}});banner(two?'TWO HOUSES<br>ARE LYING':'ONE HOUSE<br>IS LYING')}

/* ---------- missions: every house answers every question, standing on a floor zone ---------- */
function startMission(){S.phase='mission';S.mq=0;S.shield=-1;S.final=S.round>=S.rounds;
  scene({title:`MISSION · ROUND ${S.round}${S.final?' (FINAL)':''}`,card:`<div class="big" style="font-size:100px">Mission ${S.round}</div><div class="mid" style="margin-top:20px">${QPER()} questions. <b>Every house answers every question</b> by standing on its answer.</div>
    <div class="sub">✓ Each house that's right adds <b style="color:var(--gold2)">${money(potStep())}</b> to the pot.<br>Most right answers wins the 🛡 <b>shield</b> – safe from the Traitors tonight.<br>Watch who leads you to the wrong answer…</div>`,say:'mission',mood:'day',next:{label:'First question ›',fn:askMission,cls:'go'}})}
function askMission(){S.q=pickQ()||{id:'none',q:'No questions loaded. Tutor: ask one out loud.',opts:[],ans:'',exp:''};S.qLeft=QSECS();S.revealed=false;S.wrong=new Set();S.phase='question';S.step='q';floorBig('');
  $('ftitle').innerHTML=`MISSION · ROUND ${S.round}`;play('sfx_scroll',{vol:.6});mood('tense');setActs([],[act('Lock in now ›',lockIn,'go')]);render();flipCard()}
function lockIn(){if(S.phase!=='question')return;S.phase='lock';let n=3;const voiced=OK.host_lockin===1&&!muted;if(voiced)sayNow('lockin');setActs([],[]);render();
  setTimeout(function t(){if(S.phase!=='lock')return;if(n>0){floorBig(`<div class="count">${n}</div>`);play('sfx_tick',{vol:.6});n--;setTimeout(t,voiced?1050:1000)}else{floorBig('<div class="big">STAND<br>STILL!</div>');setTimeout(()=>{floorBig('');revealQ()},voiced?1300:700)}},voiced?1900:0)}
function revealQ(){S.phase='mark';S.revealed=true;play('sfx_gong',{vol:.6});markActs();render()}
function markActs(){setActs(S.teams.map((t,k)=>act(`${S.wrong.has(k)?'✗':'✓'} ${hb(k)}`,()=>{S.wrong.has(k)?S.wrong.delete(k):S.wrong.add(k);markActs();render()},S.wrong.has(k)?'no':'go')),[act('Confirm ›',confirmMark,'')])}
function confirmMark(){if(S.phase!=='mark')return;let right=0;const qn=S.mq+1;
  S.teams.forEach((t,k)=>{const ok=!S.wrong.has(k);t.att++;if(ok){t.ok++;right++}t.rec.push({r:S.round,q:qn,ok});S.log.push({time:new Date().toLocaleTimeString('en-GB'),round:S.round,question:S.q.q,house:t.name,correct:ok?'Yes':'No',qid:S.q.id})});
  const add=right*potStep();S.pot+=add;if(add){play('sfx_correct',{vol:.7});bumpPot()}else play('sfx_wrong',{vol:.6});
  host(right>=S.teams.length/2?'correct':'wrong',300,.8);
  const wrongNames=S.teams.filter((t,k)=>S.wrong.has(k)).map(t=>t.short);
  chron(`Q${qn}: ${right} of ${S.teams.length} houses right (+${money(add)})${wrongNames.length?'. Wrong: '+wrongNames.join(', '):''}.`);
  S.lastRight=right;S.phase='mresult';S.mq++;mood('day');
  setActs([S.mq<QPER()?act('Next question ›',askMission,'go'):act('Finish the mission ›',endMission,'go')],[]);render()}
function bumpPot(){const a=document.querySelector('#pot .amt');if(a){a.classList.remove('bump');void a.offsetWidth;a.classList.add('bump')}}
function endMission(){const L=living(),score=k=>S.teams[k].rec.filter(x=>x.r===S.round&&x.ok).length;
  const won=S.log.filter(l=>l.round===S.round&&l.correct==='Yes').length*potStep(),max=S.teams.length*QPER()*potStep();
  let sh;const best=L.length?Math.max(...L.map(score)):0;
  if(best>0){const top=L.filter(k=>score(k)===best);S.shield=top[rnd(top.length)];const t=S.teams[S.shield];sh=`🛡 The shield goes to <b>${esc(t.name)}</b> – ${best} right${top.length>1?' (drawn from the tied houses)':''}. The Traitors can't touch them tonight.`;chron(`🛡 Shield: ${t.short}.`);host('shield',800)}
  else sh='Nobody got one right. No shield tonight.';
  FL.mode='table';
  scene({title:'MISSION COMPLETE',card:`<div class="big" style="font-size:96px">${money(won)} of ${money(max)} won</div><div class="mid" style="margin-top:20px">${sh}</div><div class="sub">Every wrong answer cost the pot. Honest mistakes… or sabotage?</div>`,floor:crestRing(),mood:'day',
    next:{label:S.final?'The final Round Table ›':'Go to the Round Table ›',fn:()=>startRT(),cls:'go'}})}

/* ---------- round table and the house vote ---------- */
function evidence(){return `<div class="evt">${S.teams.map((t,k)=>{const r=t.rec.filter(x=>x.r===S.round);
  return `<div class="${t.ghost?'gh':''}"><span class="mini">${crest(t.id)}</span><b>${esc(t.short)}</b><span class="marks">${r.map(x=>x.ok?'<i class="y">✓</i>':'<i class="n">✗</i>').join('')||'–'}</span><span class="tot">${t.att?Math.round(t.ok/t.att*100)+'% overall':''}</span><span class="tag">${t.ghost?(t.out==='murdered'?'👻 murdered':`👻 banished${t.role==='traitor'?' · TRAITORS':' · faithful'}`):k===S.poisoned?'☠ no vote today':''}</span></div>`}).join('')}</div>`}
function startRT(again){S.phase='roundtable';S.disc=again?60:(+BANK.settings.discuss||3)*60;S.discOn=true;
  scene({title:S.final?'THE FINAL ROUND TABLE':'THE ROUND TABLE',card:`<div class="qh">Discuss · which house is lying? <span class="qclock" id="dclock"></span></div>${evidence()}
    <div class="starters"><div>“I suspect House ___ because…”</div><div>“House ___ led us to the wrong answer.”</div><div>“I trust House ___ because…”</div><div>“The evidence shows…”</div></div>`,
    floor:crestRing(),say:S.final&&!again?'finalrt':'roundtable',mood:'tense',btns:[act('Pause',toggleDisc,'alt'),act('+1 min',()=>{S.disc+=60;renderDisc()},'alt'),act('Time to vote ›',startVote,'go')]});renderDisc()}
function toggleDisc(){S.discOn=!S.discOn;S.actA[0].label=S.discOn?'Pause':'Resume';render()}
function renderDisc(){const d=$('dclock');if(d){const m=Math.floor(S.disc/60),s=S.disc%60;d.textContent=`${m}:${String(s).padStart(2,'0')}`;d.classList.toggle('low',S.disc<=15)}}
const candidates=()=>S.voteAmong||living();
function tallyHTML(){return `<div class="ev" style="margin-top:18px">${candidates().map(k=>`<div><span class="mini">${crest(S.teams[k].id)}</span>${esc(S.teams[k].short)}: <b style="color:var(--gold2);font-size:52px">${S.votes[k]||0}</b></div>`).join('')}</div>`}
function startVote(){S.discOn=false;S.phase='vote';S.votes={};S.vq=voters();S.vi=0;host('vote');mood('tense');nextVoter()}
function nextVoter(){if(S.vi>=S.vq.length){tallyVotes();return}const v=S.vq[S.vi],t=S.teams[v],opts=candidates().filter(k=>k!==v);
  scene({title:S.revote?'THE REVOTE':'THE VOTE',card:`<div class="mid"><span class="mini" style="width:100px;height:112px;display:inline-block;vertical-align:middle">${crest(t.id)}</span> <b>${esc(t.name)}</b>: who do you vote to banish?</div><div class="sub">Agree as a house, then say it out loud.${S.poisoned>=0?` ☠ ${esc(S.teams[S.poisoned].short)} is poisoned and can't vote today.`:''}</div>${tallyHTML()}${tutor(`vote ${S.vi+1} of ${S.vq.length} – tap their choice.`)}`,
    floor:crestRing(),mood:'tense',btns:opts.map(k=>act(hb(k),()=>castVote(v,k),'')).concat([act('Abstain',()=>castVote(v,-1),'alt')])})}
function castVote(v,k){if(k>=0)S.votes[k]=(S.votes[k]||0)+1;play('sfx_bell',{vol:.35});chron(k>=0?`${S.teams[v].short} votes for ${S.teams[k].short}.`:`${S.teams[v].short} abstains.`);S.vi++;setActs([],[]);
  $('card').innerHTML=`<div class="mid"><b>${esc(S.teams[v].name)}</b> votes for…</div><div class="big" style="margin-top:20px">${k>=0?esc(S.teams[k].name):'nobody'}</div>${tallyHTML()}`;flipCard();floorBig(crestRing());render();setTimeout(nextVoter,2300)}
function tallyVotes(){const c=candidates(),max=Math.max(0,...c.map(k=>S.votes[k]||0));
  if(!max){S.revote=false;S.voteAmong=null;noBanish();return}
  const top=c.filter(k=>(S.votes[k]||0)===max);
  if(top.length===1){S.revote=false;S.voteAmong=null;banish(top[0]);return}
  if(!S.revote){S.revote=true;S.voteAmong=top;
    scene({title:'A TIE',card:`<div class="big" style="font-size:100px">A tie.</div><div class="mid" style="margin-top:20px">Between ${top.map(k=>esc(S.teams[k].name)).join(' and ')}.</div><div class="sub">Vote again – this time only for one of them.</div>`,floor:crestRing(),say:'tie',next:{label:'Revote ›',fn:startVote,cls:'go'}})}
  else{S.revote=false;S.voteAmong=null;noBanish()}}
function noBanish(){S.poisoned=-1;chron('No house was banished.');
  scene({title:'THE VOTE',card:`<div class="big" style="font-size:100px">No decision.</div><div class="mid">Nobody is banished this time.</div>`,mood:'day',floor:crestRing(),next:afterBanishNext()})}
function banish(k){S.banK=k;const t=S.teams[k];
  scene({title:'BANISHED',card:`<div class="mid"><b>${esc(t.name)}</b>, you have been banished.</div><div class="big" style="font-size:96px;margin-top:20px">Stand together.</div><div class="mid" style="margin-top:20px">Tell everyone… are you <span style="color:#ff6b75">Traitors</span>… or <span style="color:#f4f7ff">Faithful</span>?</div>${tutor('when they have said it, tap the truth.')}`,
    floor:`<div class="crestbig">${crest(t.id)}</div>`,say:'stand',mood:'tense',loops:['sfx_drumroll'],btns:[act('🗡 They are TRAITORS',()=>reveal(true),'no'),act('🛡 They are FAITHFUL',()=>reveal(false),'sil')]})}
function reveal(isT){const k=S.banK,t=S.teams[k];stopLoops();t.ghost=true;t.out='banished';t.role=isT?'traitor':'faithful';S.poisoned=-1;if(S.shield===k)S.shield=-1;
  if(isT){S.bannedT++;play('sfx_traitor',{vol:.9});play('sfx_gasp',{vol:.6});host('wastraitor',600);revealAll('🗡 TRAITORS','traitor');chron(`Banished: ${t.short} – TRAITORS!`)}
  else{S.bannedF++;play('sfx_faithful',{vol:.9});play('sfx_gasp',{vol:.6});host('wasfaithful',600);revealAll('🛡 FAITHFUL','faithful');chron(`Banished: ${t.short} – Faithful.`)}
  const left=tLeft();
  scene({title:isT?'TRAITORS!':'FAITHFUL…',card:`<div class="big ${isT?'traitor':'faithful'}">${isT?'🗡 TRAITORS':'🛡 FAITHFUL'}</div><div class="mid" style="margin-top:20px">${isT?`Well done, Faithful. ${left?`${left} Traitor house still hides among you.`:'That was the last Traitor house!'}`:'You have banished an innocent house. The Traitors are still out there.'}</div><div class="sub">${esc(t.name)} are now 👻 ghosts: they still answer mission questions, but can never vote.</div>`,
    floor:`<div class="big ${isT?'traitor':'faithful'}">${isT?'TRAITORS':'FAITHFUL'}</div>`,mood:'day',
    next:left<=0?{label:'The Traitors are gone ›',fn:()=>winners(true),cls:'go'}:traitorsControl()?{label:'Next ›',fn:()=>winners(false,'control'),cls:'no'}:afterBanishNext()})}
function afterBanishNext(){return S.final?{label:'Next ›',fn:endVote,cls:'go'}:{label:'Night falls ›',fn:night1,cls:'alt'}}

/* ---------- night: poison (one Round Table without a vote) or the dagger (murder, one per Traitor house) ---------- */
function night1(){S.phase='night';play('sfx_bell',{vol:.7});setTimeout(()=>play('sfx_wolf',{vol:.5}),2500);
  scene({title:'NIGHT',card:`<div class="big">Night falls on the castle.</div><div class="mid" style="margin-top:20px">Everyone, close your eyes.</div>`,say:'night',dark:true,mood:'night',next:{label:'Next ›',fn:night2}})}
function night2(){const sh=S.shield>=0?S.teams[S.shield]:null,targets=living().filter(k=>k!==S.shield);
  scene({title:'NIGHT',card:`<div class="big" style="color:#ff6b75;font-size:90px">Traitors… open your eyes.</div><div class="mid" style="margin-top:10px">Point at the house you want to attack.</div>
    <div class="sub">☠ <b>Poison</b> (hold up 1 finger): that house can't vote at the next Round Table.<br>${S.daggers>0?`🗡 <b>Dagger</b> (make a fist): that house is murdered – ghosts for good. Daggers left: ${S.daggers}.`:'No daggers left – poison only.'}${sh?`<br>Not ${esc(sh.name)} – they have the 🛡 shield.`:''}</div>${tutor('tap the house they point at.')}`,
    say:'nighttraitors',dark:true,loops:['sfx_heartbeat'],btns:targets.map(k=>act(hb(k),()=>nightType(k),''))})}
function nightType(k){S.nightTarget=k;
  scene({title:'NIGHT',card:`<div class="mid">Target: <b>${esc(S.teams[k].name)}</b></div>${tutor(S.daggers>0?'poison (1 finger) or dagger (fist)?':'poison it is – no daggers left.')}`,dark:true,loops:['sfx_heartbeat'],
    btns:[act('☠ Poison',()=>{S.nightType='poison';night3()},'alt')].concat(S.daggers>0?[act('🗡 Dagger',()=>{S.nightType='murder';night3()},'no')]:[]).concat([act('Back',night2,'')])})}
function night3(){scene({title:'NIGHT',card:`<div class="big">Traitors, close your eyes.</div><div class="mid" style="margin-top:20px">Sleep well… if you can.</div>`,say:'nightclose',dark:true,auto:{ms:5000,fn:breakfast},next:{label:'Morning ›',fn:breakfast,cls:'alt'}})}
function breakfast(){S.phase='breakfast';play('sfx_door',{vol:.7});
  scene({title:'BREAKFAST',card:`<div class="big">Good morning.</div><div class="mid" style="margin-top:20px">Everyone, open your eyes. Breakfast is served…</div><div class="mid" style="color:#ff6b75">but one house looks very pale.</div>`,say:'breakfast',dark:false,mood:'day',next:{label:'Reveal the victim ›',fn:nightReveal,cls:'go'}})}
function nightReveal(){const k=S.nightTarget,t=S.teams[k];
  if(S.nightType==='murder'){t.ghost=true;t.out='murdered';S.daggers--;S.murdered++;play('sfx_gasp',{vol:.8});host('murdered',300);revealAll('🗡 MURDERED','traitor');chron(`Murdered in the night: ${t.short}.`);
    scene({title:'MURDERED',card:`<div class="big traitor" style="font-size:110px">${esc(t.name)}</div><div class="mid" style="margin-top:14px">was murdered in the night.</div><div class="sub">They are now 👻 ghosts: they still answer mission questions, but can never vote.</div>`,floor:`<div class="crestbig" style="filter:grayscale(1)">${crest(t.id)}</div>`,
      next:traitorsControl()?{label:'Next ›',fn:()=>winners(false,'control'),cls:'no'}:{label:'Next mission ›',fn:nextRound,cls:'go'}})}
  else{S.poisoned=k;play('sfx_gasp',{vol:.6});host('poisoned',300);revealAll('☠ POISONED','traitor');chron(`Poisoned in the night: ${t.short} – no vote at the next Round Table.`);
    scene({title:'POISONED',card:`<div class="big" style="font-size:110px">${esc(t.name)}</div><div class="mid" style="margin-top:10px">has been <b style="color:#ff6b75">poisoned</b>.</div><div class="sub">They still answer questions and can talk at the Round Table – but they can't vote today.</div>`,floor:`<div class="crestbig">${crest(t.id)}</div>`,next:{label:'Next mission ›',fn:nextRound,cls:'go'}})}}
function nextRound(){S.round++;startMission()}

/* ---------- the end ---------- */
function endVote(){S.phase='endvote';
  scene({title:'THE END?',card:`<div class="mid">Do you believe every Traitor house is gone?</div><div class="sub" style="font-size:52px;color:var(--txt)">Each house: hands up to <b style="color:var(--gold2)">END THE GAME</b>…<br>or to <b style="color:#ff6b75">BANISH AGAIN</b>.</div>${tutor('every voting house must agree to end – one house for “banish again” means another vote.')}`,
    floor:crestRing(),say:'endvote',mood:'tense',btns:[act('End the game ›',endGame,'go'),act('Banish again',()=>startRT(true),'no')]})}
function endGame(){S.phase='finale';stopLoops();const all=tLeft()<=0;
  scene({title:'THE REVEAL',card:`<div class="big">Traitors…</div><div class="mid" style="margin-top:20px">${all?'Every Traitor house has been found.':'If your house is still hiding… stand up now.'}</div>`,say:all?'allfound':'revealyou',mood:'tense',loops:['sfx_drumroll'],
    next:{label:'Reveal the winners ›',fn:()=>winners(tLeft()<=0),cls:'go'}})}
function winners(faithful,reason){stopLoops();setDark(false);S.phase='end';S.winner=faithful?'faithful':'traitor';const left=tLeft();
  play(faithful?'sfx_faithful':'sfx_traitor',{vol:.9});play('sfx_gong',{vol:.8});host(faithful?'faithfulwin':'traitorwin',700);
  revealAll(faithful?'THE FAITHFUL WIN':'THE TRAITORS WIN',faithful?'faithful':'traitor');
  chron(faithful?`The Faithful win ${money(S.pot)}.`:`The Traitors steal ${money(S.pot)}.`);
  const why=faithful?'Every Traitor house was found. The pot is shared by the Faithful houses.':reason==='control'?'The Traitors now have as many votes as the Faithful – nobody can banish them. They take the pot.':`${left} Traitor house${left>1?'s':''} stayed hidden to the end and steal the whole pot.`;
  scene({title:faithful?'THE FAITHFUL WIN':'THE TRAITORS WIN',card:`<div class="big ${faithful?'faithful':'traitor'}" style="font-size:110px">${faithful?'🛡 The Faithful win':'🗡 The Traitors win'}</div><div class="big" style="color:var(--gold2);font-size:150px">${money(S.pot)}</div>
    <div class="sub">${why}<br>Mission answers: ${S.log.filter(l=>l.correct==='Yes').length} right out of ${S.log.length}.</div>`,
    floor:`<div class="big ${faithful?'faithful':'traitor'}" style="font-size:260px">${faithful?'FAITHFUL':'TRAITORS'}<br>WIN</div>`,mood:'day',

function missedList(){const n={};S.log.forEach(r=>{if(r.correct==='No'&&r.qid!=='none')n[r.qid]=(n[r.qid]||0)+1});

async function unzip(buf){const d=new DataView(buf),u8=new Uint8Array(buf),files={};let e=buf.byteLength-22;
  while(e>=0&&d.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Not an Excel file');
  let p=d.getUint32(e+16,true);const n=d.getUint16(e+10,true);const td=new TextDecoder();
  for(let k=0;k<n;k++){const method=d.getUint16(p+10,true),cs=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),xl=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),off=d.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;const ds=off+30+d.getUint16(off+26,true)+d.getUint16(off+28,true);files[name]={method,raw:u8.slice(ds,ds+cs)}}
  return async name=>{const f=files[name];if(!f)return null;if(f.method===0)return new TextDecoder().decode(f.raw);
    const s=new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()}}
async function readXlsx(buf){const get=await unzip(buf),X=t=>new DOMParser().parseFromString(t,'application/xml');
  const wb=X(await get('xl/workbook.xml')),rels=X(await get('xl/_rels/workbook.xml.rels'));const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const ssx=await get('xl/sharedStrings.xml');const ss=ssx?[...X(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};const out={};
  for(const sh of wb.getElementsByTagName('sheet')){let t=relMap[sh.getAttribute('r:id')]||'';t=t.startsWith('/')?t.slice(1):'xl/'+t;const x=await get(t);if(!x)continue;const grid=[];
    for(const row of X(x).getElementsByTagName('row')){const r=[];for(const c of row.getElementsByTagName('c')){const ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
      if(ty==='s'&&v)val=ss[+v.textContent]||'';else if(ty==='inlineStr')val=[...c.getElementsByTagName('t')].map(z=>z.textContent).join('');else if(v)val=v.textContent;r[col(c.getAttribute('r'))]=val}
      grid[(+row.getAttribute('r')||grid.length+1)-1]=r}
    const head=(grid[0]||[]).map(h=>String(h||'').trim());out[sh.getAttribute('name').trim().toLowerCase()]=grid.slice(1).filter(Boolean).map(r=>{const o={};head.forEach((h,i)=>{if(h)o[h]=r[i]==null?'':r[i]});return o})}
  return out}
function parseWorkbook(sheets){const get=n=>sheets[n]||[];const out=JSON.parse(JSON.stringify(SAMPLE));
  get('settings').forEach(r=>{const k=String(r.Setting||'').trim().toLowerCase(),v=r.Value;if(k==='game name'&&String(v).trim())out.settings.name=String(v).trim();if(k==='pot per correct answer')out.settings.pot=+v||500;if(k==='discussion minutes')out.settings.discuss=+v||3;if(k==='questions per mission')out.settings.qper=+v||3;if(k==='seconds per question')out.settings.secs=+v||45});
  const qs=get('questions').filter(r=>String(r.Question||'').trim()).map((r,n)=>{const opts=['A','B','C','D'].map(L=>({L,text:String(r['Option '+L]||'').trim()})).filter(o=>o.text);
    let ans=String(r.Answer||'').trim();if(opts.length&&/^[a-d]$/i.test(ans))ans=ans.toUpperCase();return {id:'x'+n,topic:String(r.Topic||'ANY').trim().toUpperCase()||'ANY',level:parseInt(r.Level)||1,q:String(r.Question).trim(),opts,ans,exp:String(r.Explanation||'').trim()}});
