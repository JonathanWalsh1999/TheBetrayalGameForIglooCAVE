<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Betrayal – Igloo CAVE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#D9B45A;--gold2:#F3D98B;--blood:#B3202F;--silver:#D7DEE8;--ink:#07060a;--glass:rgba(16,12,18,.88);--line:rgba(217,180,90,.28);--txt:#EEE7DA;--muted:#A79F93}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Inter',Arial,sans-serif;color:var(--txt)}
#stage{position:absolute;left:0;top:0;width:12566px;height:4516px;transform-origin:0 0}
.cin{font-family:'Cinzel',Georgia,serif}
#hall{position:absolute;left:0;top:0;width:12566px;height:1080px}
#floor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;overflow:hidden;background:#050407}
#floorcv{position:absolute;left:0;top:0;width:2847px;height:3436px}
.candle{position:absolute;width:26px;height:90px;background:linear-gradient(#efe4cf,#b9a98c);border-radius:6px 6px 3px 3px;z-index:3}
.candle::before{content:'';position:absolute;left:3px;top:-46px;width:20px;height:44px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#fff6c9,#ffb43a 55%,rgba(255,120,0,0) 72%);animation:flick 1.6s infinite alternate}
.candle::after{content:'';position:absolute;left:-140px;top:-200px;width:306px;height:306px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,70,.22),rgba(255,140,40,0) 65%);animation:glow 2.3s infinite alternate;pointer-events:none}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
@keyframes glow{0%{opacity:.7}100%{opacity:1}}
.panel{position:absolute;background:var(--glass);border:3px solid var(--line);border-radius:28px;box-sizing:border-box;padding:26px 34px;overflow:hidden;z-index:4}
.panel h2{margin:0 0 14px;font:800 40px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:4px}
.walltitle{position:absolute;top:34px;height:140px;display:flex;align-items:center;justify-content:center;font:900 96px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:10px;text-shadow:0 0 40px rgba(217,180,90,.35),0 6px 0 #000;z-index:4;text-align:center}
.walltitle small{display:block;font:600 40px Inter,Arial;letter-spacing:2px;color:var(--muted)}
/* houses */
.house{top:200px;width:530px;height:840px;padding:24px;text-align:center}
.house .crest{width:250px;height:280px;margin:0 auto}
.house .crest svg{width:100%;height:100%}
.house .hn{font:800 46px Cinzel,Georgia,serif;margin-top:6px;line-height:1.05}
.house .st{font-size:34px;color:var(--muted);margin-top:10px;min-height:46px}
.house .rec{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.house .rec div{display:flex;justify-content:space-between;font:700 34px Inter,Arial;padding:6px 16px;border-radius:12px;background:rgba(255,255,255,.05)}
.house .rec .y{color:#9FE3B8}.house .rec .n{color:#FF9AA2}
.house.active{border-color:var(--gold);box-shadow:0 0 0 6px var(--gold),0 0 80px rgba(217,180,90,.5)}
.house.shield{border-color:var(--silver);box-shadow:0 0 0 6px var(--silver),0 0 80px rgba(215,222,232,.45)}
.house.empty{opacity:.12}
.badge{display:inline-block;font:800 30px Inter,Arial;padding:6px 16px;border-radius:12px;margin:4px}
.badge.sh{background:var(--silver);color:#111}.badge.po{background:#3a1a40;color:#f0c8ff;border:2px solid #9a5fb0}
.house.ghost .crest{filter:grayscale(1);opacity:.45}
.house .rec i{font-style:normal}.house .rec i.y,.evt i.y{color:#9FE3B8}.house .rec i.n,.evt i.n{color:#FF9AA2}
.evt{display:flex;flex-direction:column;gap:6px;margin-top:6px}.evt div{display:flex;align-items:center;gap:20px;font:600 36px Inter,Arial;padding:2px 16px;border-radius:12px;background:rgba(255,255,255,.04)}.evt div.gh{opacity:.5}
.evt .mini{width:50px;height:56px}.evt .mini svg{width:100%;height:100%}.evt b{width:200px}.evt .marks{width:260px;font-size:44px;letter-spacing:8px}.evt i{font-style:normal}.evt .tot{width:260px;color:var(--muted)}.evt .tag{color:var(--gold2)}.badge.gh{background:#2a2433;color:#d9d2ff;border:2px solid #6c5f8a}
/* front */
#card{left:3476px;top:200px;width:2767px;height:660px;border-color:var(--gold);padding:36px 50px}
#card.flip{animation:flip .55s cubic-bezier(.2,.9,.3,1.15)}
@keyframes flip{0%{transform:perspective(2500px) rotateX(-70deg);opacity:0}100%{transform:none;opacity:1}}
.qh{font:800 34px Cinzel,Georgia,serif;color:var(--gold);letter-spacing:3px;margin-bottom:12px}
.qq{font:700 64px Inter,Arial;line-height:1.15;margin-bottom:22px}
.big{font:900 120px Cinzel,Georgia,serif;line-height:1.05;text-align:center}
.mid{font:700 58px Inter,Arial;line-height:1.25;text-align:center}
.sub{font:600 44px Inter,Arial;line-height:1.3;color:var(--muted);text-align:center;margin-top:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{background:#1d1620;border:3px solid #4a3b44;border-radius:16px;padding:14px 22px;font-size:42px;cursor:pointer;line-height:1.15;display:flex;gap:18px;align-items:center}
.opt b{flex:0 0 auto;font-family:Cinzel,Georgia,serif;color:var(--gold)}
.opt.right{background:#173323;border-color:#9FE3B8}.opt.wrong{background:#3a1218;border-color:#FF9AA2;animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.exp{margin-top:16px;font-size:38px;line-height:1.3;color:var(--muted)}
.oc{display:flex;gap:16px;margin:0 0 18px}.oc span{flex:1;font:700 36px Inter,Arial;padding:10px 18px;border-radius:16px;border:4px solid;text-align:center}
.qclock{float:right;font:800 80px Cinzel,Georgia,serif;color:var(--gold);margin-top:-18px;font-variant-numeric:tabular-nums}
.qclock.low{color:#FF9AA2;animation:bump .5s infinite}
@keyframes bump{30%{transform:scale(1.15)}}
.dock{position:absolute;top:884px;height:180px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px;z-index:6}
.btn{font:800 46px Cinzel,Georgia,serif;border:none;border-radius:18px;padding:0 40px;height:150px;cursor:pointer;background:var(--gold);color:#1a1205;box-shadow:0 6px 0 rgba(0,0,0,.6)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.6)}
.dock.many .btn{font-size:38px;height:96px;padding:0 24px;border-radius:14px}
.btn.go{background:#2E8B57;color:#fff}.btn.no{background:var(--blood);color:#fff}.btn.alt{background:#3E4A7A;color:#fff}.btn.sil{background:var(--silver);color:#111}
.btn.sm{font-size:32px;height:76px;padding:0 24px;border-radius:12px}
.btn .mini{width:60px;height:66px;display:inline-block;vertical-align:middle;margin-right:10px}
.btn .mini svg{width:100%;height:100%}
.starters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.starters div{font:600 40px Inter,Arial;padding:10px 20px;border-radius:16px;border:3px dashed var(--line);color:var(--gold2)}
.ev{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.ev div{font:700 40px Inter,Arial;padding:10px 20px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.ev .mini{width:56px;height:62px}.ev svg{width:100%;height:100%}
/* right + back */
#pot{left:6323px;top:200px;width:1700px;height:840px;text-align:center;padding-top:50px}
#pot .amt{font:900 260px Cinzel,Georgia,serif;color:var(--gold2);text-shadow:0 0 80px rgba(243,217,139,.45);line-height:1.1;font-variant-numeric:tabular-nums}
#pot .amt.bump{animation:bump .7s}
#status{left:8063px;top:200px;width:1616px;height:840px}
.steps{display:flex;flex-direction:column;gap:12px;margin:10px 0 24px}
.steps div{font:800 48px Cinzel,Georgia,serif;color:#5d5560;padding:8px 20px;border-radius:14px}
.steps div.on{color:#1a1205;background:var(--gold)}
.stat{font:600 40px Inter,Arial;margin:8px 0;color:var(--txt)}.stat b{color:var(--gold2)}
#clock{left:9759px;top:200px;width:1360px;height:420px}
#clock .t{font:900 150px Cinzel,Georgia,serif;line-height:1;font-variant-numeric:tabular-nums}
#chron{left:9759px;top:650px;width:1360px;height:390px}
#chron div{font-size:32px;line-height:1.25;padding:7px 0;border-bottom:1px solid var(--line)}
#rules{left:11159px;top:200px;width:1367px;height:840px}
#rules p{font-size:36px;line-height:1.3;margin:0 0 16px}
#rules b{color:var(--gold2)}
/* setup */
#setup{left:3476px;top:186px;width:2767px;height:880px;border-color:var(--gold);z-index:7}
.pick{display:flex;gap:16px;flex-wrap:wrap}
.co{width:240px;height:240px;border-radius:20px;background:#1d1620;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px 14px;box-sizing:border-box;position:relative;border:5px solid transparent;text-align:center}
.co .mini{width:140px;height:156px;margin-bottom:4px}.co .mini svg{width:100%;height:100%}
.co b{font:800 32px Cinzel,Georgia,serif}
.co.on{border-color:var(--gold);background:#2c2214}
.setrow{font-size:38px;margin:14px 0 10px;color:var(--muted)}
.chooser{display:flex;gap:14px;flex-wrap:wrap}
.hide{display:none!important}
/* floor */
#fzones{position:absolute;inset:0;display:grid;gap:24px;padding:24px;box-sizing:border-box;z-index:2}
.fz{border-radius:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px;box-sizing:border-box;color:#fff;border:16px solid rgba(255,255,255,.35);transition:opacity .5s,transform .5s;cursor:pointer;overflow:hidden}
.fz .fl{font:900 520px/1 Cinzel,Georgia,serif;display:flex;align-items:center;gap:60px}
.fz .fl i{font-style:normal;font-size:300px;opacity:.9}
.fz .ft{font:700 130px/1.15 Inter,Arial;margin-top:40px;max-height:900px;overflow:hidden}
.fz.dark{color:#0a0a0a}.fz.right{border:40px solid #fff;transform:scale(1.03);box-shadow:0 0 200px #fff}
.fz.dim{opacity:.15}.fz.picked{opacity:.55;border-style:dashed}
.fz .fv{font:900 200px Cinzel,Georgia,serif;margin-top:30px}
#fbig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3;pointer-events:none;padding:120px;box-sizing:border-box}
#fbig .big{font-size:330px}#fbig .mid{font-size:150px}
#fbig .crestbig{width:1300px;height:1450px}#fbig .crestbig svg{width:100%;height:100%}
/* night / dark overlay over the walls */
#dark{position:absolute;left:0;top:0;width:12566px;height:4516px;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s;z-index:20}
#dark.on{opacity:.94}
.night #card,.night .dock,.night #floor,.night #ftitle{z-index:21}
.reveal{position:absolute;top:0;height:1080px;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:30;pointer-events:none;text-align:center}
.reveal .big{font-size:260px;letter-spacing:10px;animation:rv 1.4s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rv{0%{transform:scale(2.4);opacity:0;filter:blur(30px)}100%{transform:none;opacity:1;filter:none}}
.traitor{color:#ff5a66;text-shadow:0 0 90px rgba(255,40,60,.7),0 8px 0 #000}
.faithful{color:#f4f7ff;text-shadow:0 0 90px rgba(200,220,255,.7),0 8px 0 #000}
#banner{position:absolute;left:3436px;top:0;width:2847px;height:1080px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40}
#banner div{font:900 180px Cinzel,Georgia,serif;color:var(--gold2);-webkit-text-stroke:6px #000;paint-order:stroke fill;animation:banner 2.6s ease-out forwards;text-align:center;line-height:1}
@keyframes banner{0%{transform:scale(1.5);opacity:0;letter-spacing:50px}18%{transform:scale(1);opacity:1;letter-spacing:6px}85%{opacity:1}100%{opacity:0}}
.count{font:900 600px Cinzel,Georgia,serif;color:var(--gold2);animation:rv .6s}
/* trailer intro */
#intro{position:absolute;left:0;top:0;width:12566px;height:4516px;z-index:85;pointer-events:none}
.iw{position:absolute;top:0;height:1080px;background:rgba(4,3,6,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:40px;overflow:hidden}
#ifloor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(4,3,6,.6)}
.it{font:900 185px Cinzel,Georgia,serif;color:#fff;line-height:1.08;letter-spacing:4px}.it.gold{color:var(--gold2)}
.is{font:600 62px Inter,Arial;color:var(--muted);margin-top:26px;line-height:1.25}
.in{animation:inz .7s cubic-bezier(.2,.9,.3,1.1)}
@keyframes inz{0%{transform:scale(1.4);opacity:0;filter:blur(24px)}100%{transform:none;opacity:1;filter:none}}
.icrests{display:flex;gap:40px;justify-content:center}.icrests span{width:300px;height:336px;animation:inz .6s both}.icrests svg{width:100%;height:100%}
#ipause{position:absolute;left:5440px;top:960px;pointer-events:auto;z-index:90;width:400px}
#iskip{position:absolute;left:5860px;top:960px;pointer-events:auto;z-index:90}
#ipaused{position:absolute;left:3436px;top:0;width:2847px;height:940px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(3,2,5,.88);z-index:89;font:900 220px Cinzel,Georgia,serif;color:#fff;pointer-events:none}
#ipaused div{font:600 64px Inter,Arial;color:var(--muted);margin-top:20px}
/* v4: players wall, join QR, vote lists */
#players{position:absolute;left:40px;top:200px;width:3356px;height:840px;display:grid;gap:14px;z-index:4;align-content:start}
.pl{background:var(--glass);border:3px solid var(--line);border-radius:20px;padding:8px 20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative;cursor:default}
.pl .nm{font:800 50px Inter,Arial;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:110px;line-height:1.15}
.pl .mk{font:800 40px Inter,Arial;letter-spacing:8px;min-height:44px;color:var(--muted)}
.pl .mk .y{color:#9FE3B8}.pl .mk .n{color:#FF9AA2}.pl .mk .u{color:#6a6270}
.pl .mk small{font:600 30px Inter;letter-spacing:0;color:var(--muted);margin-left:14px}
.pl .tg{position:absolute;right:16px;top:10px;font-size:46px;letter-spacing:4px}
.pl.out{opacity:.4}.pl.out .nm{text-decoration:line-through}
.pl.sh{border-color:var(--silver);box-shadow:0 0 0 5px var(--silver)}
.pl.done{border-color:#9FE3B8;box-shadow:0 0 0 4px #2E8B57}
.pl.off .nm{color:#8d8592}
.pl.kick{cursor:pointer}.pl.kick:hover{border-color:#ff6b75}
.pl .role{font:800 34px Cinzel,Georgia,serif}
.pl.small .nm{font-size:40px}.pl.small .mk{font-size:32px;min-height:34px}.pl.small .tg{font-size:36px}
#noplayers{position:absolute;left:40px;top:200px;width:3356px;height:840px;display:flex;align-items:center;justify-content:center;flex-direction:column;font:700 64px Inter;color:var(--muted);text-align:center;z-index:4}
.qrbox{background:#fff;border-radius:24px;padding:18px;display:inline-block;line-height:0}
.qrbox svg{display:block;width:100%;height:100%}
.joinurl{font:700 40px Inter,Arial;color:var(--gold2);word-break:break-all}
.code{font:900 130px Cinzel,Georgia,serif;color:#fff;letter-spacing:24px;line-height:1}
.vlist{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 30px;margin-top:10px}
.vlist div{font:700 38px Inter,Arial;padding:4px 14px;border-radius:12px;background:rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:inz .5s}
.vlist div b{color:var(--gold2)}
.tally{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:16px}
.tally span{font:800 46px Inter,Arial;padding:10px 24px;border-radius:16px;background:#3a1218;border:3px solid #FF9AA2}
.prog{font:800 64px Inter,Arial;color:var(--gold2);text-align:center;margin-top:16px}
.opt .cnt{margin-left:auto;font:800 40px Inter;color:var(--gold2);white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div id="stage">
  <canvas id="hall" width="3142" height="270"></canvas>
  <div id="floor"><canvas id="floorcv" width="1424" height="1718"></canvas><div id="fzones" class="hide"></div><div id="fbig"></div></div>
  <div id="candles"></div>

  <div class="walltitle" style="left:0;width:3436px" id="ptitle">THE PLAYERS</div>
  <div id="players"></div>

  <div class="walltitle" id="ftitle" style="left:3436px;width:2847px">THE BETRAYAL</div>
  <div class="panel" id="card"></div>
  <div class="dock" id="dockA" style="left:3476px;width:1344px"></div>
  <div class="dock" id="dockB" style="left:4900px;width:1343px"></div>
  <div class="panel" id="setup"></div>

  <div class="walltitle" style="left:6283px;width:3436px">THE PRIZE POT</div>
  <div class="panel" id="pot"></div>
  <div class="panel" id="status"></div>

  <div class="walltitle" style="left:9719px;width:2847px">THE CASTLE</div>
  <div class="panel" id="clock"></div>
  <div class="panel" id="chron"></div>
  <div class="panel" id="rules"></div>

  <div id="dark"></div>
  <div id="reveals"></div>
  <div id="banner"></div>
  <div id="intro" class="hide"><div class="iw" style="left:0;width:3436px"></div><div class="iw" style="left:3436px;width:2847px"></div><div class="iw" style="left:6283px;width:3436px"></div><div class="iw" style="left:9719px;width:2847px"></div><div id="ifloor"></div>
    <button id="ipause" class="btn sm" onclick="pauseIntro()">❚❚ Pause</button><button id="iskip" class="btn sm alt" onclick="endIntro(true)">Skip intro ›</button><div id="ipaused" class="hide">PAUSED<div>Press ▶ Play to carry on</div></div></div>
</div>
<input type="file" id="file" accept=".xlsx" class="hide">
<script src="lib/relay.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="lib/qrcode.js"></script>
<script>
const SAMPLE = {"questions": [{"id": "s0", "topic": "1A", "level": 1, "q": "Which planet is closest to the Sun?", "opts": [{"L": "A", "text": "Venus"}, {"L": "B", "text": "Mercury"}, {"L": "C", "text": "Mars"}, {"L": "D", "text": "Earth"}], "ans": "B", "exp": "Mercury has the smallest orbit of all the planets."}, {"id": "s1", "topic": "1B", "level": 1, "q": "Which organ pumps blood around the body?", "opts": [{"L": "A", "text": "Lungs"}, {"L": "B", "text": "Liver"}, {"L": "C", "text": "Heart"}, {"L": "D", "text": "Kidneys"}], "ans": "C", "exp": "The heart pumps blood through the arteries and veins."}, {"id": "s2", "topic": "2A", "level": 1, "q": "What is the capital city of Wales?", "opts": [{"L": "A", "text": "Swansea"}, {"L": "B", "text": "Cardiff"}, {"L": "C", "text": "Newport"}, {"L": "D", "text": "Bangor"}], "ans": "B", "exp": "Cardiff has been the capital of Wales since 1955."}, {"id": "s3", "topic": "2B", "level": 1, "q": "What is the longest river in the UK?", "opts": [{"L": "A", "text": "Thames"}, {"L": "B", "text": "Severn"}, {"L": "C", "text": "Trent"}, {"L": "D", "text": "Tyne"}], "ans": "B", "exp": "The Severn runs about 220 miles from Wales into the Bristol Channel."}, {"id": "s4", "topic": "2C", "level": 1, "q": "What is the capital of Australia?", "opts": [{"L": "A", "text": "Sydney"}, {"L": "B", "text": "Melbourne"}, {"L": "C", "text": "Canberra"}, {"L": "D", "text": "Perth"}], "ans": "C", "exp": "Canberra was purpose-built as the capital."}, {"id": "s5", "topic": "3A", "level": 1, "q": "How many wives did Henry VIII have?", "opts": [{"L": "A", "text": "4"}, {"L": "B", "text": "5"}, {"L": "C", "text": "6"}, {"L": "D", "text": "8"}], "ans": "C", "exp": "Henry VIII married six times."}, {"id": "s6", "topic": "3B", "level": 1, "q": "In which year did the Second World War end?", "opts": [{"L": "A", "text": "1918"}, {"L": "B", "text": "1939"}, {"L": "C", "text": "1945"}, {"L": "D", "text": "1950"}], "ans": "C", "exp": "The war ended in 1945."}, {"id": "s7", "topic": "3C", "level": 1, "q": "Which invention powered many factories in the Industrial Revolution?", "opts": [{"L": "A", "text": "Steam engine"}, {"L": "B", "text": "Electric motor"}, {"L": "C", "text": "Petrol engine"}, {"L": "D", "text": "Solar panel"}], "ans": "A", "exp": "Steam engines drove machines in mills and factories."}, {"id": "s8", "topic": "4A", "level": 1, "q": "Which of these makes the strongest password?", "opts": [{"L": "A", "text": "Your pet's name"}, {"L": "B", "text": "A long mix of words, numbers and symbols"}, {"L": "C", "text": "Your birthday"}, {"L": "D", "text": "password123"}], "ans": "B", "exp": "Long, random combinations are much harder to guess or crack."}, {"id": "s9", "topic": "4B", "level": 1, "q": "What does CPU stand for?", "opts": [{"L": "A", "text": "Central Processing Unit"}, {"L": "B", "text": "Computer Power Unit"}, {"L": "C", "text": "Central Program Utility"}, {"L": "D", "text": "Core Processing Upload"}], "ans": "A", "exp": "The CPU carries out a computer's instructions."}, {"id": "s10", "topic": "4C", "level": 1, "q": "What does 'www' stand for in a web address?", "opts": [{"L": "A", "text": "World Wide Web"}, {"L": "B", "text": "Wide World Web"}, {"L": "C", "text": "Web World Wide"}, {"L": "D", "text": "World Web Window"}], "ans": "A", "exp": "The World Wide Web was invented by Tim Berners-Lee."}, {"id": "s11", "topic": "5A", "level": 1, "q": "How many portions of fruit and veg a day does the NHS recommend?", "opts": [{"L": "A", "text": "At least 3"}, {"L": "B", "text": "At least 5"}, {"L": "C", "text": "At least 7"}, {"L": "D", "text": "At least 10"}], "ans": "B", "exp": "The NHS '5 A Day' guidance."}, {"id": "s12", "topic": "5B", "level": 1, "q": "Which number do you call in a UK emergency?", "opts": [{"L": "A", "text": "101"}, {"L": "B", "text": "111"}, {"L": "C", "text": "999"}, {"L": "D", "text": "911"}], "ans": "C", "exp": "999 (or 112) for emergencies; 111 is non-urgent medical help, 101 is non-emergency police."}, {"id": "s13", "topic": "5C", "level": 1, "q": "How much moderate activity should adults aim for each week (NHS)?", "opts": [{"L": "A", "text": "30 minutes"}, {"L": "B", "text": "75 minutes"}, {"L": "C", "text": "150 minutes"}, {"L": "D", "text": "300 minutes"}], "ans": "C", "exp": "At least 150 minutes of moderate activity, or 75 minutes vigorous."}, {"id": "s14", "topic": "6A", "level": 1, "q": "What is a budget?", "opts": [{"L": "A", "text": "A plan for your income and spending"}, {"L": "B", "text": "A type of bank account"}, {"L": "C", "text": "A loan"}, {"L": "D", "text": "A tax"}], "ans": "A", "exp": "A budget helps you see where your money goes."}, {"id": "s15", "topic": "6B", "level": 1, "q": "On a UK payslip, what does 'NI' stand for?", "opts": [{"L": "A", "text": "National Income"}, {"L": "B", "text": "National Insurance"}, {"L": "C", "text": "Net Income"}, {"L": "D", "text": "New Investment"}], "ans": "B", "exp": "National Insurance contributions are taken from your pay."}, {"id": "s16", "topic": "6C", "level": 1, "q": "What is 'interest' on a savings account?", "opts": [{"L": "A", "text": "A fee you pay the bank"}, {"L": "B", "text": "Money the bank pays you for saving"}, {"L": "C", "text": "A type of tax"}, {"L": "D", "text": "Your account number"}], "ans": "B", "exp": "Banks pay interest as a reward for keeping your money with them."}, {"id": "s17", "topic": "7A", "level": 1, "q": "Which of these can usually go in household recycling?", "opts": [{"L": "A", "text": "Clean glass bottles"}, {"L": "B", "text": "Nappies"}, {"L": "C", "text": "Crisp packets"}, {"L": "D", "text": "Used tissues"}], "ans": "A", "exp": "Clean glass bottles and jars are widely recycled."}, {"id": "s18", "topic": "7B", "level": 1, "q": "Which of these is a renewable energy source?", "opts": [{"L": "A", "text": "Coal"}, {"L": "B", "text": "Wind"}, {"L": "C", "text": "Natural gas"}, {"L": "D", "text": "Oil"}], "ans": "B", "exp": "Wind won't run out, unlike fossil fuels."}, {"id": "s19", "topic": "7C", "level": 1, "q": "Which gas contributes most to human-caused climate change?", "opts": [{"L": "A", "text": "Oxygen"}, {"L": "B", "text": "Nitrogen"}, {"L": "C", "text": "Carbon dioxide"}, {"L": "D", "text": "Helium"}], "ans": "C", "exp": "Burning fossil fuels releases carbon dioxide."}, {"id": "s20", "topic": "8A", "level": 1, "q": "What should a CV include?", "opts": [{"L": "A", "text": "Your bank details"}, {"L": "B", "text": "Your skills and experience"}, {"L": "C", "text": "Your passwords"}, {"L": "D", "text": "Your favourite film"}], "ans": "B", "exp": "A CV shows employers what you can offer."}, {"id": "s21", "topic": "8B", "level": 1, "q": "What's a good thing to do at the end of an interview?", "opts": [{"L": "A", "text": "Ask a question about the role"}, {"L": "B", "text": "Check your phone"}, {"L": "C", "text": "Ask when you can book a holiday"}, {"L": "D", "text": "Say nothing"}], "ans": "A", "exp": "Asking a question shows genuine interest."}, {"id": "s22", "topic": "U1", "level": 2, "q": "Which gas do plants take in for photosynthesis?", "opts": [{"L": "A", "text": "Oxygen"}, {"L": "B", "text": "Carbon dioxide"}, {"L": "C", "text": "Nitrogen"}, {"L": "D", "text": "Hydrogen"}], "ans": "B", "exp": "Plants use carbon dioxide, water and light to make glucose."}, {"id": "s23", "topic": "U1", "level": 2, "q": "Which blood cells help fight infection?", "opts": [{"L": "A", "text": "Red blood cells"}, {"L": "B", "text": "White blood cells"}, {"L": "C", "text": "Platelets"}, {"L": "D", "text": "Plasma"}], "ans": "B", "exp": "White blood cells are part of the immune system."}, {"id": "s24", "topic": "U1", "level": 3, "q": "Why does Earth have seasons?", "opts": [{"L": "A", "text": "Its distance from the Sun changes"}, {"L": "B", "text": "Its axis is tilted"}, {"L": "C", "text": "The Moon's gravity"}, {"L": "D", "text": "The Sun gets hotter in summer"}], "ans": "B", "exp": "The tilt changes how directly sunlight hits each half of the planet."}, {"id": "s25", "topic": "U2", "level": 2, "q": "Which is the largest ocean?", "opts": [{"L": "A", "text": "Atlantic"}, {"L": "B", "text": "Indian"}, {"L": "C", "text": "Pacific"}, {"L": "D", "text": "Arctic"}], "ans": "C", "exp": "The Pacific covers about a third of Earth's surface."}, {"id": "s26", "topic": "U2", "level": 2, "q": "What is the highest mountain in the UK?", "opts": [{"L": "A", "text": "Yr Wyddfa (Snowdon)"}, {"L": "B", "text": "Ben Nevis"}, {"L": "C", "text": "Scafell Pike"}, {"L": "D", "text": "Slieve Donard"}], "ans": "B", "exp": "Ben Nevis in Scotland is 1,345 m high."}, {"id": "s27", "topic": "U2", "level": 3, "q": "Why were many cities built next to rivers?", "opts": [{"L": "A", "text": "Rivers are quieter"}, {"L": "B", "text": "For water, trade and transport"}, {"L": "C", "text": "Rivers stop flooding"}, {"L": "D", "text": "It was the law"}], "ans": "B", "exp": "Rivers supplied water and were the main trade routes."}, {"id": "s28", "topic": "U3", "level": 2, "q": "Who was the last Tudor monarch?", "opts": [{"L": "A", "text": "Henry VIII"}, {"L": "B", "text": "Edward VI"}, {"L": "C", "text": "Mary I"}, {"L": "D", "text": "Elizabeth I"}], "ans": "D", "exp": "Elizabeth I died in 1603, ending the Tudor line."}, {"id": "s29", "topic": "U3", "level": 2, "q": "In which year did the First World War begin?", "opts": [{"L": "A", "text": "1905"}, {"L": "B", "text": "1914"}, {"L": "C", "text": "1918"}, {"L": "D", "text": "1939"}], "ans": "B", "exp": "The war began in 1914."}, {"id": "s30", "topic": "U3", "level": 3, "q": "Why did many people move to towns during the Industrial Revolution?", "opts": [{"L": "A", "text": "To find work in factories"}, {"L": "B", "text": "Farming was banned"}, {"L": "C", "text": "Towns were cleaner"}, {"L": "D", "text": "To avoid tax"}], "ans": "A", "exp": "New factories created jobs while farm work declined."}, {"id": "s31", "topic": "U4", "level": 2, "q": "What is phishing?", "opts": [{"L": "A", "text": "A fake message trying to trick you into giving information"}, {"L": "B", "text": "A type of computer fan"}, {"L": "C", "text": "A fast internet connection"}, {"L": "D", "text": "A way to back up files"}], "ans": "A", "exp": "Phishing messages pretend to be trusted organisations."}, {"id": "s32", "topic": "U4", "level": 2, "q": "Which of these is an input device?", "opts": [{"L": "A", "text": "Monitor"}, {"L": "B", "text": "Printer"}, {"L": "C", "text": "Keyboard"}, {"L": "D", "text": "Speaker"}], "ans": "C", "exp": "Input devices send data into the computer."}, {"id": "s33", "topic": "U4", "level": 3, "q": "Why should you install software updates?", "opts": [{"L": "A", "text": "They make the screen brighter"}, {"L": "B", "text": "They fix security weaknesses"}, {"L": "C", "text": "They delete old files"}, {"L": "D", "text": "They slow down hackers' internet"}], "ans": "B", "exp": "Updates patch known vulnerabilities."}, {"id": "s34", "topic": "U5", "level": 2, "q": "What does CPR stand for?", "opts": [{"L": "A", "text": "Cardiopulmonary resuscitation"}, {"L": "B", "text": "Central pulse recovery"}, {"L": "C", "text": "Chest pressure routine"}, {"L": "D", "text": "Cardiac pressure relief"}], "ans": "A", "exp": "CPR keeps blood and oxygen moving until help arrives."}, {"id": "s35", "topic": "U5", "level": 2, "q": "Which nutrient is the body's main source of energy?", "opts": [{"L": "A", "text": "Carbohydrates"}, {"L": "B", "text": "Vitamins"}, {"L": "C", "text": "Minerals"}, {"L": "D", "text": "Fibre"}], "ans": "A", "exp": "Carbohydrates are broken down into glucose for energy."}, {"id": "s36", "topic": "U5", "level": 3, "q": "Why is warming up before exercise important?", "opts": [{"L": "A", "text": "It burns more calories"}, {"L": "B", "text": "It prepares muscles and reduces injury risk"}, {"L": "C", "text": "It makes you taller"}, {"L": "D", "text": "It isn't important"}], "ans": "B", "exp": "Warm muscles are more flexible and less likely to strain."}, {"id": "s37", "topic": "U6", "level": 2, "q": "What is the difference between gross and net pay?", "opts": [{"L": "A", "text": "Gross is after deductions"}, {"L": "B", "text": "Net is after deductions"}, {"L": "C", "text": "They're the same"}, {"L": "D", "text": "Net includes bonuses"}], "ans": "B", "exp": "Net pay is what actually reaches your bank account."}, {"id": "s38", "topic": "U6", "level": 2, "q": "What does APR show you?", "opts": [{"L": "A", "text": "The yearly cost of borrowing"}, {"L": "B", "text": "Your account number"}, {"L": "C", "text": "Your credit score"}, {"L": "D", "text": "Your monthly salary"}], "ans": "A", "exp": "APR helps you compare loans and credit cards."}, {"id": "s39", "topic": "U6", "level": 3, "q": "Why is an emergency fund useful?", "opts": [{"L": "A", "text": "It covers unexpected costs without borrowing"}, {"L": "B", "text": "It earns the highest interest"}, {"L": "C", "text": "It improves your payslip"}, {"L": "D", "text": "It replaces insurance"}], "ans": "A", "exp": "Savings for emergencies stop surprise bills becoming debt."}, {"id": "s40", "topic": "U7", "level": 2, "q": "What does 'carbon footprint' mean?", "opts": [{"L": "A", "text": "Total greenhouse gases caused by a person or activity"}, {"L": "B", "text": "The size of your shoes"}, {"L": "C", "text": "The amount of coal in the UK"}, {"L": "D", "text": "A type of tree"}], "ans": "A", "exp": "It measures the climate impact of what we do."}, {"id": "s41", "topic": "U7", "level": 2, "q": "Which light bulb uses the least energy?", "opts": [{"L": "A", "text": "Incandescent"}, {"L": "B", "text": "Halogen"}, {"L": "C", "text": "LED"}, {"L": "D", "text": "Candle"}], "ans": "C", "exp": "LEDs use a fraction of the energy of older bulbs."}, {"id": "s42", "topic": "U7", "level": 3, "q": "Why does reducing food waste help the environment?", "opts": [{"L": "A", "text": "It saves the energy, water and emissions used to produce food"}, {"L": "B", "text": "Food waste is radioactive"}, {"L": "C", "text": "It makes bins lighter"}, {"L": "D", "text": "It doesn't help"}], "ans": "A", "exp": "Wasted food wastes everything that went into growing and transporting it."}, {"id": "s43", "topic": "U8", "level": 2, "q": "What is a cover letter for?", "opts": [{"L": "A", "text": "Explaining why you're right for a specific job"}, {"L": "B", "text": "Listing your hobbies only"}, {"L": "C", "text": "Asking for a pay rise"}, {"L": "D", "text": "Replacing your CV"}], "ans": "A", "exp": "A cover letter tailors your application to the role."}, {"id": "s44", "topic": "U8", "level": 2, "q": "What does the STAR method help you do in an interview?", "opts": [{"L": "A", "text": "Answer with Situation, Task, Action, Result"}, {"L": "B", "text": "Rate the interviewer"}, {"L": "C", "text": "Remember names"}, {"L": "D", "text": "Choose an outfit"}], "ans": "A", "exp": "STAR gives structure to examples of your skills."}, {"id": "s45", "topic": "U8", "level": 3, "q": "Why should you research a company before an interview?", "opts": [{"L": "A", "text": "To show interest and tailor your answers"}, {"L": "B", "text": "To find the manager's address"}, {"L": "C", "text": "It isn't necessary"}, {"L": "D", "text": "To ask for a higher salary"}], "ans": "A", "exp": "Research helps you link your skills to what they need."}, {"id": "s46", "topic": "HUB1", "level": 1, "q": "A team member is struggling to finish their part. What's the best response?", "opts": [{"L": "A", "text": "Ignore it"}, {"L": "B", "text": "Offer help or flag it early"}, {"L": "C", "text": "Redo their work without telling them"}, {"L": "D", "text": "Complain to others"}], "ans": "B", "exp": "Good teams support each other and raise problems early."}, {"id": "s47", "topic": "HUB2", "level": 1, "q": "Which is an example of active listening?", "opts": [{"L": "A", "text": "Interrupting with your own story"}, {"L": "B", "text": "Nodding and summarising what they said"}, {"L": "C", "text": "Looking at your phone"}, {"L": "D", "text": "Planning your reply while they talk"}], "ans": "B", "exp": "Summarising shows you've understood."}, {"id": "s48", "topic": "HUB3", "level": 1, "q": "What's the first step in solving a problem?", "opts": [{"L": "A", "text": "Pick the quickest fix"}, {"L": "B", "text": "Understand the problem clearly"}, {"L": "C", "text": "Find someone to blame"}, {"L": "D", "text": "Give up"}], "ans": "B", "exp": "You can't fix what you don't understand."}, {"id": "s49", "topic": "HUB4", "level": 1, "q": "A customer is angry about a late order. What should you do first?", "opts": [{"L": "A", "text": "Argue back"}, {"L": "B", "text": "Listen and acknowledge their frustration"}, {"L": "C", "text": "Hang up"}, {"L": "D", "text": "Blame the courier"}], "ans": "B", "exp": "Listening calms the situation before you solve it."}, {"id": "s50", "topic": "MATHS", "level": 1, "q": "What is 15% of £80?", "opts": [{"L": "A", "text": "£8"}, {"L": "B", "text": "£12"}, {"L": "C", "text": "£15"}, {"L": "D", "text": "£10"}], "ans": "B", "exp": "10% is £8, 5% is £4, so 15% is £12."}, {"id": "s51", "topic": "MATHS", "level": 1, "q": "A train leaves at 14:45. The journey takes 1 hour 50 minutes. When does it arrive?", "opts": [{"L": "A", "text": "16:25"}, {"L": "B", "text": "16:35"}, {"L": "C", "text": "16:45"}, {"L": "D", "text": "15:35"}], "ans": "B", "exp": "14:45 + 1 h = 15:45, + 50 min = 16:35."}, {"id": "s52", "topic": "MATHS", "level": 1, "q": "What is 3/4 as a percentage?", "opts": [{"L": "A", "text": "34%"}, {"L": "B", "text": "60%"}, {"L": "C", "text": "75%"}, {"L": "D", "text": "80%"}], "ans": "C", "exp": "3 ÷ 4 = 0.75 = 75%."}, {"id": "s53", "topic": "MATHS", "level": 1, "q": "A room is 6 m by 4 m. What is its area?", "opts": [{"L": "A", "text": "10 m²"}, {"L": "B", "text": "20 m²"}, {"L": "C", "text": "24 m²"}, {"L": "D", "text": "48 m²"}], "ans": "C", "exp": "Area = length × width = 24 m²."}, {"id": "s54", "topic": "ENGLISH", "level": 1, "q": "Which word is spelled correctly?", "opts": [{"L": "A", "text": "R const RELAY=(QSP.get('relay')||window.RELAY||'').replace(/\/$/,''),USE_RELAY=!!RELAY&&!QSP.has('p2p')&&!LOCAL;
const ALPH='BCDFGHJKLMNPQRSTVWXZ';
function peerOpts(){const p=QSP.get('peer');if(!p)return {debug:0};const [host,port]=p.split(':');return {host,port:+port||443,path:'/',secure:!/^(localhost|127\.)/.test(host),debug:0}}
function netStart(){S.room=QSP.get('room')||Array.from({length:4},()=>ALPH[rnd(ALPH.length)]).join('');NET.ok=false;
  if(LOCAL){NET.bc=new BroadcastChannel('betrayal-'+S.room);NET.bc.onmessage=e=>{const m=e.data;if(m&&m.to==='host')onNet(m.from,m.data)};NET.ok=true;render();return}
  if(USE_RELAY){relayStart();return}
  if(!window.Peer){NET.err='The phone link file (lib/peerjs.min.js) is missing.';render();return}
  const peer=new Peer('btrl-'+S.room.toLowerCase(),peerOpts());NET.peer=peer;
  peer.on('open',()=>{NET.ok=true;NET.err='';render()});
  peer.on('connection',c=>{c.on('open',()=>{NET.conns[c.peer]=c});c.on('data',d=>{NET.conns[c.peer]=c;onNet(c.peer,d)});c.on('close',()=>offNet(c.peer,c));c.on('error',()=>offNet(c.peer,c))});
  peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy()}catch(x){}netStart();return}if(e.type==='peer-unavailable')return;NET.err='Phone link problem ('+e.type+'). Check the internet connection.';render()});
  peer.on('disconnected',()=>{NET.ok=false;render();setTimeout(()=>{try{peer.reconnect()}catch(x){}},1500)})}
function relayStart(){const open=()=>{const ws=new WebSocket(RELAY+'/room/'+S.room+'?role=host');NET.ws=ws;
    ws.onopen=()=>{NET.ok=true;NET.err='';render();sync()};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(!m||!m.from)return;if(m.closed)offNet(m.from);else onNet(m.from,m.data)};
    ws.onclose=ev=>{if(NET.ws!==ws)return;NET.ok=false;if(ev.code===4000)return;NET.err='Reconnecting the phone link…';render();setTimeout(open,2000)};ws.onerror=()=>{}};open()}
function joinURL(){const u=new URL('play.html',location.href);u.search='?r='+S.room+(LOCAL?'&local':'')+(QSP.get('peer')?'&peer='+QSP.get('peer'):'')+(QSP.get('relay')?'&relay='+encodeURIComponent(QSP.get('relay')):'')+(QSP.has('p2p')?'&p2p':'');return u.href}
function qrSVG(text){try{const q=qrcode(0,'M');q.addData(text);q.make();let s=q.createSvgTag({cellSize:4,margin:0});const n=q.getModuleCount()*4;
  if(!/viewBox/.test(s))s=s.replace('<svg','<svg viewBox="0 0 '+n+' '+n+'"');return s.replace(/ width="[^"]*"/,'').replace(/ height="[^"]*"/,'')}catch(e){return ''}}
function send(cid,data){if(!cid)return;if(LOCAL){NET.bc&&NET.bc.postMessage({to:cid,from:'host',data});return}
  if(USE_RELAY){const w=NET.ws;if(w&&w.readyState===1)try{w.send(JSON.stringify({to:cid,data}))}catch(e){}return}const c=NET.conns[cid];if(c&&c.open)try{c.send(data)}catch(e){}}
const byCid=cid=>players().find(p=>p.cid===cid);
function onNet(cid,d){if(!d||typeof d!=='object')return;
  if(d.t==='hello'){join(cid,d);return}
  const p=byCid(cid)||(d.pid&&S.P[d.pid]&&S.P[d.pid].cid===cid?S.P[d.pid]:null);if(!p)return;
  if(!p.online){p.online=true;render()}
  if(d.t==='seen'){if(S.phase==='roles'&&!p.seen){p.seen=true;render();autoCheck()}}
  else if(d.t==='ans')answer(p,d.L);
  else if(d.t==='self')selfMark(p,!!d.ok);
  else if(d.t==='vote')castVote(p,d.target);
  else if(d.t==='night')nightPick(p,d);
  else if(d.t==='end')endPick(p,d.v)}
function offNet(cid,c){if(c&&NET.conns[cid]!==c)return;delete NET.conns[cid];const p=byCid(cid);if(p){p.online=false;render();autoCheck()}}
const cleanName=n=>String(n||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16);
function uniqueName(name,self){const taken=n=>players().some(q=>q!==self&&q.name.toLowerCase()===n.toLowerCase());if(!taken(name))return name;let k=2;while(taken(name+' '+k))k++;return name+' '+k}
function join(cid,d){const pid=String(d.pid||'').slice(0,60);if(!pid)return;let p=S.P[pid];const name=cleanName(d.name)||'Player';
  if(!p){if(['finale','end'].includes(S.phase)){send(cid,{s:'msg',title:'Game over',msg:'Wait for the next game to start.'});return}
    if(S.order.length>=40){send(cid,{s:'msg',title:'The castle is full',msg:'40 players is the maximum.'});return}
    p={pid,name:uniqueName(name),role:S.phase==='setup'?'':'F',out:false,how:'',poisoned:false,seen:S.phase!=='setup'&&S.phase!=='roles',rec:[],online:true,cid};S.P[pid]=p;S.order.push(pid);
    if(S.phase!=='setup')chron(`${p.name} joined the game late.`);play('sfx_whoosh',{vol:.35})}
  else if(S.phase==='setup'&&name!==p.name)p.name=uniqueName(name,p);
  if(p.cid&&p.cid!==cid&&!LOCAL&&!USE_RELAY){const old=NET.conns[p.cid];if(old)try{old.close()}catch(e){}}
  p.cid=cid;p.online=true;render();if(S.phase==='setup')sync();else sync(p)}
function kick(pid){const p=S.P[pid];if(!p||S.phase!=='setup')return;send(p.cid,{s:'kicked'});delete S.P[pid];S.order=S.order.filter(x=>x!==pid);render();sync()}

/* ---------- what each phone shows: the CAVE sends every player their own screen ---------- */
function me(p){return {name:p.name,role:p.role,out:p.out,poisoned:p.poisoned,shield:S.shield===p.pid,
  mates:p.role==='T'?players().filter(q=>q.role==='T'&&q!==p).map(q=>q.name+(q.out?' (gone)':'')):[]}}
function sync(only){(only?[only]:players()).forEach(p=>{if(p.cid)send(p.cid,Object.assign(screenFor(p),{me:me(p),phase:S.phase}))})}
function screenFor(p){const ph=S.phase,W=(title,msg)=>({s:'wait',title,msg});
  if(ph==='setup')return {s:'lobby',n:S.order.length};
  if(ph==='roles')return {s:'role',seen:p.seen};
  if(ph==='question'||ph==='lock'){if(!S.q.opts.length)return W('Answer out loud','This question has no options. Work out your answer – you will mark yourself when it is revealed.');
    const a=S.ans[p.pid];return {s:'q',qn:S.mq+1,of:QPER(),text:S.q.q,opts:S.q.opts,picked:a?a.L:null,locked:ph==='lock',left:S.qLeft}}
  if(ph==='self'){const a=S.ans[p.pid];return {s:'self',text:S.q.q,ans:S.q.ans,exp:S.q.exp,done:a?a.ok:null}}
  if(ph==='mresult'){const r=p.rec[p.rec.length-1],o=S.q.opts.find(x=>x.L===S.q.ans);
    return {s:'qres',ok:r&&r.r===S.round&&r.q===S.mq?r.ok:null,ans:o?o.L+': '+o.text:S.q.ans,exp:S.q.exp,pot:S.pot,dagger:S.daggerEarned,step:potStep()}}
  if(ph==='vote'){if(p.out)return W('👻 You are a ghost','Ghosts never vote. Watch the walls…');if(p.poisoned)return W('☠ You were poisoned','You can still talk – but you cannot vote this time.');
    return {s:'vote',cands:voteCands().filter(q=>q!==p).map(q=>({pid:q.pid,name:q.name})),picked:S.votes[p.pid]||null,revote:!!S.among}}
  if(ph==='night'){if(p.out)return W('👻 Sleep, ghost','Heads down. The night belongs to the living.');
    if(p.role==='T')return {s:'nightT',cands:victims().map(q=>({pid:q.pid,name:q.name})),daggers:S.daggers,mine:S.night[p.pid]||null,shield:S.shield&&S.P[S.shield]?S.P[S.shield].name:null,
      mates:living().filter(q=>q.role==='T'&&q!==p).map(q=>{const k=S.night[q.pid];return {name:q.name,pick:k&&S.P[k.target]?S.P[k.target].name:null,kind:k?k.kind:null}})};
    return {s:'nightF',cands:living().filter(q=>q!==p).map(q=>({pid:q.pid,name:q.name})),picked:S.sus[p.pid]?S.sus[p.pid].target:null}}
  if(ph==='endvote'){if(p.out)return W('👻 Ghosts don\'t vote','The living decide if the game is over.');return {s:'endvote',picked:S.endv[p.pid]||null}}
  if(ph==='banish'&&S.ban===p.pid)return W('You have been banished','Stand up. Tell everyone: are you a Traitor… or Faithful?');
  if(ph==='end')return {s:'end',winner:S.winner,won:(S.winner==='faithful')===(p.role==='F'),pot:S.pot,right:p.rec.filter(r=>r.ok).length,total:p.rec.length};
  const L={choosing:['Look up','The game is starting.'],mission:['A new mission','Get ready – the question is coming. You will answer here.'],
    roundtable:['The Round Table','Look at the walls. Who got answers wrong? Who is lying? When it is time, you will vote here.'],
    vreveal:['The votes','Look at the walls.'],banish:['Banished…','Look at the centre.'],breakfast:['Good morning','Look at the walls. Who made it through the night?'],finale:['The truth','Look at the walls.']}[ph];
  return W(L?L[0]:'Look up',L?L[1]:'Watch the walls.')}

/* ---------- sound: ElevenLabs clips in assets/audio, with built-in fallbacks ---------- */
const SFX=['sfx_gong','sfx_heartbeat','sfx_bell','sfx_drumroll','sfx_traitor','sfx_faithful','sfx_gasp','sfx_door','sfx_wolf','sfx_tick','sfx_correct','sfx_wrong','sfx_scroll','sfx_whoosh'];
const V=(b,n)=>[b].concat(Array.from({length:n-1},(_,i)=>b+'_'+(i+2)));
const HOST={roles:['host_roles'],allopen:['host_all_open'],mission:V('host_mission',2),correct:V('host_correct',2),dagger:V('host_dagger',2),shield:['host_shield'],roundtable:V('host_roundtable',2),
  vote:['host_vote'],votes:['host_votes_in'],stand:['host_stand'],wastraitor:V('host_was_traitor',2),wasfaithful:V('host_was_faithful',2),secret:['host_secret'],night:['host_night'],breakfast:['host_breakfast'],
  murdered:V('host_murdered',2),poisoned:['host_poisoned'],nomurder:['host_no_murder'],finalrt:['host_final_rt'],endvote:['host_endvote'],revealyou:['host_reveal_yourselves'],tie:['host_tie'],lockin:['host_lockin'],
  faithfulwin:['host_faithful_win'],traitorwin:['host_traitor_win'],outnumber:['host_outnumber']};
const AUD={},OK={};let muted=false,hostNow=null,loopNow={},actx=null;
const INTRO=Array.from({length:11},(_,i)=>'intro_'+(i+1));
[...SFX,...Object.values(HOST).flat(),...INTRO].forEach(k=>{const a=new Audio();a.preload='auto';a.oncanplaythrough=()=>OK[k]=1;a.onerror=()=>OK[k]=0;a.src=`assets/audio/${k}.mp3`;AUD[k]=a});
function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
function beep(freqs,dur=.15,type='sine',vol=.25){if(muted||!ac())return;let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.85})}
const FALLBACK={sfx_gong:()=>beep([98,73],1.6,'sine',.4),sfx_bell:()=>beep([392,196],1.4,'sine',.3),sfx_traitor:()=>beep([147,139,131],.6,'sawtooth',.18),sfx_faithful:()=>beep([294,370,440,587],.35,'triangle',.2),
  sfx_correct:()=>beep([440,554,659],.15,'triangle',.2),sfx_wrong:()=>beep([196,147],.35,'sawtooth',.14),sfx_tick:()=>beep([1200],.04,'square',.08),sfx_scroll:()=>beep([300,500],.08,'sine',.12),sfx_gasp:()=>{},sfx_whoosh:()=>beep([200,600],.12,'sine',.1)};
function talking(){return hostGap||(hostNow&&!hostNow.paused&&!hostNow.ended)}
function play(k,{vol=.8,max=0}={}){if(muted)return null;if(OK[k]!==1){FALLBACK[k]&&FALLBACK[k]();return null}
  if(talking())vol*=.45;const a=AUD[k].cloneNode();a.volume=vol;a.play().catch(()=>{});if(max)setTimeout(()=>a.pause(),max*1000);return a}
function loop(k,on,vol=.6){if(on){if(loopNow[k]||muted)return;if(OK[k]!==1){if(k==='sfx_heartbeat')loopNow[k]=setInterval(()=>beep([60,52],.18,'sine',.35),1000);return}
    const a=AUD[k];a.loop=true;a.volume=vol;a.currentTime=0;a.play().catch(()=>{});loopNow[k]=a}
  else{const a=loopNow[k];if(!a)return;if(typeof a==='number')clearInterval(a);else a.pause();delete loopNow[k]}}
function stopLoops(){Object.keys(loopNow).forEach(k=>loop(k,false))}
/* the host never talks over himself: lines queue; big moments first; stale small comments are dropped */
const RECENT=[],HQ=[];let hostGap=false;
const PRIO={wastraitor:3,wasfaithful:3,faithfulwin:4,traitorwin:4,outnumber:4,murdered:3,roles:3,allopen:3,night:3,breakfast:3,stand:3,vote:3,votes:3,secret:3,endvote:3,revealyou:3,shield:2,roundtable:2,finalrt:3,mission:2,correct:2,dagger:3,poisoned:3,nomurder:3,tie:3,lockin:3};
function host(ev,delay=0,chance=1){const list=HOST[ev];if(!list||Math.random()>chance)return;
  setTimeout(()=>{if(muted)return;if(talking()){HQ.push({ev,p:PRIO[ev]||1,t:Date.now()});HQ.sort((a,b)=>b.p-a.p||a.t-b.t);if(HQ.length>3)HQ.length=3;return}sayNow(ev)},delay)}
function sayNow(ev){const list=HOST[ev];let pool=list.filter(k=>OK[k]&&!RECENT.includes(k));if(!pool.length)pool=list.filter(k=>OK[k]);if(!pool.length){nextHost();return}
  const k=pool[rnd(pool.length)];RECENT.push(k);if(RECENT.length>10)RECENT.shift();hostNow=AUD[k];hostNow.currentTime=0;hostNow.volume=1;duck(true);
  hostNow.onended=()=>{duck(false);nextHost()};hostNow.play().catch(()=>nextHost())}
function nextHost(){if(muted){HQ.length=0;return}while(HQ.length){const h=HQ.shift();if(Date.now()-h.t<(h.p>=3?15000:h.p===2?7000:3500)){hostGap=true;setTimeout(()=>{hostGap=false;sayNow(h.ev)},450);return}}}
function hush(){HQ.length=0;hostGap=false;if(hostNow)hostNow.pause()}

/* ---------- music: generative dark castle score (no file needed). Moods: day, tense, night ---------- */
const MUS={on:true,gain:null,bus:null,next:0,step:0,timer:0,base:.22,mood:'day'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[50,53,57,62],[46,50,53,58],[43,46,50,55],[45,49,52,57]]; // Dm  Bb  Gm  A
function startMusic(){if(!MUS.on||muted||MUS.gain||!ac())return;
  MUS.gain=actx.createGain();MUS.gain.gain.value=.0001;MUS.gain.connect(actx.destination);
  MUS.bus=actx.createBiquadFilter();MUS.bus.type='lowpass';MUS.bus.frequency.value=1400;MUS.bus.connect(MUS.gain);
  MUS.gain.gain.setTargetAtTime(MUS.base,actx.currentTime,2);MUS.next=actx.currentTime+.2;MUS.step=0;MUS.timer=setInterval(schedMusic,60)}
function stopMusic(){if(!MUS.gain)return;clearInterval(MUS.timer);const g=MUS.gain;g.gain.setTargetAtTime(.0001,actx.currentTime,.4);setTimeout(()=>g.disconnect(),2000);MUS.gain=null}
function duck(on){if(MUS.gain)MUS.gain.gain.setTargetAtTime(on?MUS.base*.15:MUS.base,actx.currentTime,.4)}
function mood(m){MUS.mood=m;if(MUS.bus)MUS.bus.frequency.setTargetAtTime(m==='tense'?2200:m==='night'?700:1400,actx.currentTime,1)}
function schedMusic(){const beat=1;while(MUS.next<actx.currentTime+.4){musStep(MUS.step,MUS.next);MUS.next+=beat/2;MUS.step++}}
function pad(f,t,dur,vol,type='sawtooth'){const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();o.type=type;o2.type=type;o.frequency.value=f;o2.frequency.value=f;o2.detune.value=9;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.35);g.gain.setTargetAtTime(.0001,t+dur*.7,dur*.25);o.connect(g);o2.connect(g);g.connect(MUS.bus);o.start(t);o2.start(t);o.stop(t+dur*1.6);o2.stop(t+dur*1.6)}
function thud(t,vol,f0=90,f1=38,dur=.5){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MUS.gain);o.start(t);o.stop(t+dur)}
function musStep(s,t){const b=s%16,ch=PROG[Math.floor(s/16)%4],m=MUS.mood;
  if(b===0){ch.forEach((n,i)=>pad(mtof(n),t,8.5,m==='night'?.012:.02,i?'triangle':'sawtooth'));pad(mtof(ch[0]-24),t,8.5,.05,'sine')}
  if(m!=='night'&&b===0)thud(t,.5,70,32,1.2);
  if(m==='tense'&&(b%2===0)){thud(t,.45,62,40,.22);thud(t+.22,.3,58,38,.2)}
  if(m==='day'&&(b===6||b===12)&&Math.random()<.6)pad(mtof(ch[3]+12+[0,2,3][rnd(3)]),t,1.8,.012,'sine');
  if(m==='night'&&b===8&&Math.random()<.5)pad(mtof(ch[0]+36),t,3,.008,'sine')}
addEventListener('pointerdown',()=>{ac();startMusic()},{once:true});

    c.strokeStyle='rgba(10,8,14,.9)';c.lineWidth=2;c.beginPath();c.moveTo(cx,20);c.lineTo(cx,186);c.moveTo(cx-24,100);c.lineTo(cx+24,100);c.stroke()}});
  let h='';WALLS.forEach(w=>{for(let k=0;k<6;k++){const x=w.x+60+k*(w.w-120)/5;h+=`<div class="candle" style="left:${x}px;top:${980+((k%2)?10:0)}px;animation-delay:${Math.random()}s"></div>`}});$('candles').innerHTML=h})();
let FL={mode:'table',t:0};
const fc=$('floorcv').getContext('2d');

/* ---------- questions ---------- */
function pickQ(){const pref=Math.min(3,S.round);const qs=BANK.questions;
  const tiers=[qs.filter(q=>q.level===pref),qs.filter(q=>Math.abs(q.level-pref)===1),qs];
  for(const t of tiers){const fresh=t.filter(q=>!S.used.has(q.id));if(fresh.length){const q=fresh[rnd(fresh.length)];S.used.add(q.id);return q}}
  S.used.clear();const q=qs[rnd(qs.length)];if(q)S.used.add(q.id);return q}
const QSECS=()=>+BANK.settings.secs||45,QPER=()=>+BANK.settings.qper||3;

/* ---------- scenes ---------- */
let stepTimer=0,acT=0;
function scene({title,card,cardFn,floor,say,dark,mood:md,auto,next,btns,loops}){clearTimeout(stepTimer);S.step=title||S.step;S.cardFn=cardFn||null;
  if(title)$('ftitle').innerHTML=title;if(card!=null||cardFn){$('card').innerHTML=cardFn?cardFn():card;flipCard()}floorBig(floor||'');setDark(dark);if(md)mood(md);
  stopLoops();(loops||[]).forEach(k=>loop(k,true));if(say)host(say);
  setActs(btns||(next?[act(next.label,next.fn,next.cls||'')]:[]),[]);render();sync();
  if(auto)stepTimer=setTimeout(function w(){if(S.paused){stepTimer=setTimeout(w,500);return}auto.fn()},auto.ms)}
function flipCard(){const c=$('card');c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip')}
const tutor=t=>`<div class="sub" style="color:var(--gold2);font-size:40px;margin-top:24px">TUTOR: ${t}</div>`;
const nm=p=>p?esc(p.name):'?';
const online=list=>list.filter(p=>p.online);
const allDone=(list,f)=>{const L=online(list);return L.length>0&&L.every(f)};
/* when every phone that's connected has answered/voted, move on by itself (the tutor can always move on sooner) */
function autoCheck(){clearTimeout(acT);acT=setTimeout(()=>{const ph=S.phase;
  if(ph==='roles'&&allDone(players(),p=>p.seen))rolesDone();
  else if(ph==='question'&&allDone(players(),p=>S.ans[p.pid]))lockIn();
  else if(ph==='self'&&allDone(players(),p=>S.ans[p.pid]))scoreQ();
  else if(ph==='vote'&&allDone(voters(),p=>S.votes[p.pid]))closeVote();
  else if(ph==='night'&&allDone(living(),p=>p.role==='T'?S.night[p.pid]:S.sus[p.pid])&&traitorsAgree())dawn();
  else if(ph==='endvote'&&allDone(living(),p=>S.endv[p.pid]))resolveEnd()},ph2delay())}
const ph2delay=()=>S.phase==='question'?900:S.phase==='night'?2500:1500;

/* ---------- start: roles go to each phone in secret ---------- */
function startGame(){ac();startMusic();hush();const n=S.order.length;
  if(n<MIN_PLAYERS){banner(`NEED ${MIN_PLAYERS}+<br>PLAYERS`);if(S.phase!=='setup')newGame();return}
  const T=Math.max(1,Math.min(tCount(),Math.floor((n-1)/3)));const ids=[...S.order].sort(()=>Math.random()-.5),tids=new Set(ids.slice(0,T));
  players().forEach(p=>Object.assign(p,{role:tids.has(p.pid)?'T':'F',out:false,how:'',poisoned:false,seen:false,rec:[]}));
  Object.assign(S,{traitors:T,rounds:roundsFor(S.minutes),round:1,pot:0,daggers:1,used:new Set(),log:[],chron:[],elapsed:0,final:false,paused:false,winner:null,revote:false,among:null,shield:null,hidden:[],ban:null});
  $('setup').classList.add('hide');chron(`The game begins: ${n} players, ${T} Traitor${T>1?'s':''} hidden among you.`);S.phase='roles';
  scene({title:'WHO ARE YOU?',cardFn:()=>`<div class="big" style="font-size:100px">Look at your phone.</div><div class="mid" style="margin-top:24px">Hide the screen from everyone around you.<br><b style="color:var(--gold2)">Press and hold</b> to discover who you really are.</div>
      <div class="prog">Seen: ${players().filter(p=>p.seen).length} of ${n}</div>`,floor:`<div class="big">EYES ON<br>YOUR PHONE</div><div class="mid" style="margin-top:80px">📱 keep it hidden</div>`,
    say:'roles',dark:true,mood:'night',loops:['sfx_heartbeat'],next:{label:'Everyone has seen it ›',fn:rolesDone,cls:'go'}})}
function rolesDone(){if(S.phase!=='roles')return;S.phase='choosing';play('sfx_gong',{vol:.8});const n=S.traitors;
  scene({title:'THE GAME BEGINS',card:`<div class="big">Look up.</div><div class="mid" style="margin-top:30px;color:#ff6b75">${n} Traitor${n>1?'s are':' is'} among you.</div><div class="sub">Every right answer grows the prize pot. Banish every Traitor before the end – or they steal it all.<br>Forgot your role? <b>Press and hold</b> the button at the bottom of your phone.</div>`,
    say:'allopen',dark:false,mood:'day',next:{label:'Begin the first mission ›',fn:startMission,cls:'go'}});banner(`${n} TRAITOR${n>1?'S':''}<br>AMONG YOU`)}

/* ---------- missions: everyone answers on their phone ---------- */
function startMission(){S.phase='mission';S.mq=0;S.shield=null;S.final=S.round>=S.rounds;
  scene({title:`MISSION · ROUND ${S.round}${S.final?' (FINAL)':''}`,card:`<div class="big" style="font-size:100px">Mission ${S.round}</div><div class="mid" style="margin-top:20px">${QPER()} questions. <b>Answer on your phone.</b> Talk it through first if you like… but who can you trust?</div>
    <div class="sub">✓ Every right answer adds <b style="color:var(--gold2)">${money(potStep())}</b> to the pot.<br>🛡 Most right answers wins the <b>shield</b> (fastest wins a tie) – safe tonight.<br>🗡 If <b>fewer than half</b> get a question right, the Traitors earn a dagger.</div>`,say:'mission',mood:'day',next:{label:'First question ›',fn:askMission,cls:'go'}})}
function askMission(){S.q=pickQ()||{id:'none',q:'No questions loaded. Tutor: ask one out loud.',opts:[],ans:'',exp:''};S.qLeft=QSECS();S.qT0=Date.now();S.revealed=false;S.ans={};S.phase='question';S.cardFn=null;floorBig('');
  $('ftitle').innerHTML=`MISSION · ROUND ${S.round}`;play('sfx_scroll',{vol:.6});mood('tense');setActs([],[act('Lock in now ›',lockIn,'go')]);render();flipCard();sync()}
function answer(p,L){if(S.phase!=='question'||!S.q.opts.some(o=>o.L===L))return;S.ans[p.pid]={L,t:Date.now()-S.qT0};render();autoCheck()}
function lockIn(){if(S.phase!=='question')return;S.phase='lock';host('lockin');play('sfx_tick',{vol:.6});setActs([],[]);render();sync();
  floorBig('<div class="big">ANSWERS<br>LOCKED</div>');setTimeout(()=>{floorBig('');revealQ()},2200)}
function revealQ(){S.revealed=true;play('sfx_gong',{vol:.6});
  if(!S.q.opts.length){S.phase='self';S.ans={};setActs([],[act('Confirm marks ›',scoreQ,'go')]);render();sync();return}
  scoreQ()}
function selfMark(p,ok){if(S.phase!=='self')return;S.ans[p.pid]={ok,t:Date.now()-S.qT0};render();autoCheck()}
function scoreQ(){if(S.phase!=='self'&&S.phase!=='lock')return;const qn=S.mq+1,open=!S.q.opts.length,counts={};let right=0,lr=0,ln=0;
  players().forEach(p=>{const a=S.ans[p.pid],ok=open?!!(a&&a.ok):!!(a&&a.L===S.q.ans);if(a&&a.L)counts[a.L]=(counts[a.L]||0)+1;
    p.rec.push({r:S.round,q:qn,ok,t:a&&a.t!=null?a.t:QSECS()*1000,ghost:p.out});if(ok)right++;if(!p.out){ln++;if(ok)lr++}
    S.log.push({time:new Date().toLocaleTimeString('en-GB'),round:S.round,player:p.name,role:p.role==='T'?'Traitor':'Faithful',question:S.q.q,answer:a?(a.L||(a.ok?'self: right':'self: wrong')):'(no answer)',correct:ok?'Yes':'No',qid:S.q.id})});
  const add=right*potStep();S.pot+=add;S.daggerEarned=ln>0&&lr<ln/2;if(S.daggerEarned)S.daggers++;
  S.lastRes={right,n:players().length,lr,ln,add,counts};S.revealed=true;S.phase='mresult';S.mq++;mood('day');
  if(add){play('sfx_correct',{vol:.7});bumpPot()}else play('sfx_wrong',{vol:.6});
  if(S.daggerEarned){setTimeout(()=>play('sfx_traitor',{vol:.6}),900);host('dagger',300);banner('🗡 +1 DAGGER')}else host('correct',300,.8);
  chron(`Q${qn}: ${right} of ${players().length} right (+${money(add)}).${S.daggerEarned?' 🗡 Under half – the Traitors earn a dagger.':''}`);
  setActs([S.mq<QPER()?act('Next question ›',askMission,'go'):act('Finish the mission ›',endMission,'go')],[]);render();sync()}
function bumpPot(){const a=document.querySelector('#pot .amt');if(a){a.classList.remove('bump');void a.offsetWidth;a.classList.add('bump')}}
const roundRec=p=>p.rec.filter(x=>x.r===S.round);
function endMission(){S.phase='missionend';const won=S.log.filter(l=>l.round===S.round&&l.correct==='Yes').length*potStep();
  const c=living().map(p=>{const r=roundRec(p).filter(x=>x.ok);return {p,ok:r.length,t:r.reduce((s,x)=>s+x.t,0)}}).filter(x=>x.ok>0).sort((a,b)=>b.ok-a.ok||a.t-b.t);
  let sh;if(c.length){const w=c[0];S.shield=w.p.pid;const tie=c.length>1&&c[1].ok===w.ok;
    sh=`🛡 The shield goes to <b>${nm(w.p)}</b> – ${w.ok} right${tie?`, and the fastest (${(w.t/1000).toFixed(1)} s in total)`:''}. The Traitors cannot attack them tonight.`;chron(`🛡 Shield: ${w.p.name}.`);host('shield',800)}
  else sh='Nobody got one right. No shield tonight.';
  scene({title:'MISSION COMPLETE',card:`<div class="big" style="font-size:96px">${money(won)} won</div><div class="mid" style="margin-top:20px">${sh}</div><div class="sub">🗡 The Traitors have <b>${S.daggers}</b> dagger${S.daggers===1?'':'s'}.<br>Look at the players wall: who got answers wrong?</div>`,mood:'day',
    next:{label:S.final?'The final Round Table ›':'Go to the Round Table ›',fn:()=>startRT(),cls:'go'}})}

/* ---------- round table and the phone vote ---------- */
function startRT(again){S.phase='roundtable';S.disc=again?60:(+BANK.settings.discuss||3)*60;S.discOn=true;S.revote=false;S.among=null;
  scene({title:S.final?'THE FINAL ROUND TABLE':'THE ROUND TABLE',card:`<div class="qh">Discuss · who is lying? <span class="qclock" id="dclock"></span></div><div class="mid" style="text-align:left;font-size:48px">The players wall shows every answer: <span style="color:#9FE3B8">✓ right</span> <span style="color:#FF9AA2">✗ wrong</span>.</div>
    <div class="starters"><div>“I suspect ___ because they got ___ wrong.”</div><div>“___ talked us into the wrong answer.”</div><div>“I trust ___ because…”</div><div>“The evidence shows…”</div></div>`,
    say:S.final&&!again?'finalrt':'roundtable',mood:'tense',btns:[act('Pause',toggleDisc,'alt'),act('+1 min',()=>{S.disc+=60;renderDisc()},'alt'),act('Time to vote ›',startVote,'go')]});renderDisc()}

const voteCands=()=>S.among?S.among.map(id=>S.P[id]).filter(p=>p&&!p.out):living();

      return `<div class="big" style="font-size:100px">Vote on your phone.</div><div class="mid" style="margin-top:16px">${S.among?'Revote: only '+S.among.map(id=>nm(S.P[id])).join(' or ')+' can be chosen.':'Who do you vote to banish?'}</div>
      <div class="sub">You can change your vote until it closes. 👻 Ghosts and ☠ poisoned players can't vote.</div><div class="prog">Votes in: ${n} of ${v.length}</div>`},
    say:S.revote?null:'vote',mood:'tense',loops:['sfx_heartbeat'],btns:[act('Close the vote now ›',closeVote,'go')]});autoCheck()}
function castVote(p,target){if(S.phase!=='vote'||p.out||p.poisoned||target===p.pid)return;const t=S.P[target];if(!t||!voteCands().includes(t))return;S.votes[p.pid]=target;render();autoCheck()}
function closeVote(){if(S.phase!=='vote')return;S.phase='vreveal';stopLoops();host('votes');S.vshown=0;
  const list=voters().filter(p=>S.votes[p.pid]&&S.P[S.votes[p.pid]]),show=()=>`<div class="qh">How everyone voted</div><div class="vlist" style="grid-template-columns:repeat(${list.length>18?4:3},1fr)">${list.slice(0,S.vshown).map(p=>`<div>${nm(p)} → <b>${nm(S.P[S.votes[p.pid]])}</b></div>`).join('')}</div>`;
  scene({title:'THE VOTES',cardFn:show,mood:'tense',loops:['sfx_drumroll'],btns:[act('Show all ›',()=>{S.vshown=list.length;tally(list)},'alt')]});
  const step=()=>{if(S.phase!=='vreveal')return;if(S.vshown>=list.length){tally(list);return}S.vshown++;play('sfx_bell',{vol:.3});render();setTimeout(step,list.length>16?700:1100)};setTimeout(step,2200)}
function tally(list){if(S.phase!=='vreveal')return;S.phase='vtally';stopLoops();const c={};list.forEach(p=>{const t=S.votes[p.pid];c[t]=(c[t]||0)+1});
  const ranked=Object.entries(c).sort((a,b)=>b[1]-a[1]),top=ranked.length?ranked[0][1]:0,tied=ranked.filter(r=>r[1]===top).map(r=>r[0]);
  const board=`<div class="qh">How everyone voted</div><div class="vlist" style="grid-template-columns:repeat(${list.length>18?4:3},1fr)">${list.map(p=>`<div>${nm(p)} → <b>${nm(S.P[S.votes[p.pid]])}</b></div>`).join('')}</div><div class="tally">${ranked.slice(0,6).map(([id,k])=>`<span>${nm(S.P[id])}: ${k}</span>`).join('')}</div>`;
  if(!top){scene({title:'THE VOTE',card:board+`<div class="mid">No votes were cast.</div>`,next:{label:'Next ›',fn:noBanish}});return}
  if(tied.length>1){if(!S.revote){host('tie');scene({title:'A TIE',card:board+`<div class="mid" style="margin-top:14px">A tie between ${tied.map(id=>nm(S.P[id])).join(' and ')}. Vote again – only they can be chosen.</div>`,
      btns:[act('Revote ›',()=>{S.revote=true;S.among=tied;startVote()},'go')]});return}
    scene({title:'A TIE AGAIN',card:board+`<div class="mid" style="margin-top:14px">Still tied. Nobody is banished.</div>`,next:{label:'Next ›',fn:noBanish}});return}
  scene({title:'THE VOTE',card:board+`<div class="mid" style="margin-top:14px">The most votes: <b style="color:#ff6b75">${nm(S.P[tied[0]])}</b></div>`,btns:[act(`Banish ${nm(S.P[tied[0]])} ›`,()=>banish(tied[0]),'no')]})}
function clearPoison(){players().forEach(p=>p.poisoned=false)}

  scene({title:'THE VOTE',card:`<div class="big" style="font-size:100px">No decision.</div><div class="mid">Nobody is banished this time.</div>`,mood:'day',next:afterBanishNext()})}
function banish(pid){S.ban=pid;S.phase='banish';const p=S.P[pid];
  scene({title:'BANISHED',card:`<div class="big" style="font-size:110px">${nm(p)}</div><div class="mid" style="margin-top:20px">Stand up. Tell everyone… are you a <span style="color:#ff6b75">Traitor</span>… or <span style="color:#f4f7ff">Faithful</span>?</div>${S.final?'<div class="sub">This is the final round: the castle will keep their secret until the very end.</div>':''}`,

function revealBan(){if(S.phase!=='banish')return;const p=S.P[S.ban];S.phase='banished';p.out=true;p.how='banished';clearPoison();S.revote=false;S.among=null;stopLoops();
  if(S.final){p.hidden=true;S.hidden.push(p.pid);host('secret');chron(`Banished: ${p.name} – role kept secret.`);
    scene({title:'BANISHED',card:`<div class="big" style="font-size:110px">${nm(p)} leaves the castle…</div><div class="mid" style="margin-top:20px">…and takes their secret with them.</div><div class="sub">Traitor or Faithful? You will find out at the very end.</div>`,

  else{play('sfx_faithful',{vol:.9});play('sfx_gasp',{vol:.6});host('wasfaithful',600);revealAll('🛡 FAITHFUL','faithful');chron(`Banished: ${p.name} – Faithful.`)}
  const left=tLeft(),over=left<=0,outn=!over&&left>=fLeft();

    floor:`<div class="big ${isT?'traitor':'faithful'}">${isT?'TRAITOR':'FAITHFUL'}</div>`,mood:'day',
    next:over?{label:'The Traitors are gone ›',fn:()=>winners(true),cls:'go'}:outn?{label:'Next ›',fn:()=>winners(false,'outnumber'),cls:'no'}:afterBanishNext()})}
function afterBanishNext(){return S.final?{label:'Next ›',fn:endVote,cls:'go'}:{label:'Night falls ›',fn:night1,cls:'alt'}}

/* ---------- night: every phone gets a screen, so nobody can spot the Traitors by who is tapping ---------- */
const victims=()=>living().filter(p=>p.role!=='T'&&p.pid!==S.shield);
function traitorsAgree(){const k=living().filter(p=>p.role==='T').map(p=>S.night[p.pid]).filter(Boolean).map(x=>x.target+'|'+x.kind);return new Set(k).size<=1}
function night1(){S.phase='night';S.night={};S.sus={};S.nLeft=75;play('sfx_bell',{vol:.7});setTimeout(()=>play('sfx_wolf',{vol:.5}),2500);
  scene({title:'NIGHT',cardFn:()=>{const L=living(),n=L.filter(p=>p.role==='T'?S.night[p.pid]:S.sus[p.pid]).length;
      return `<div class="big">Night falls on the castle.</div><div class="mid" style="margin-top:20px">Heads down. Eyes on your phone.<br>Traitors… choose your victim.</div><div class="sub">Everyone else: a secret poll – who do you suspect?</div><div class="prog">Choices in: ${n} of ${L.length} · <span id="nclock">${S.nLeft}</span>s</div>`},
    floor:'',say:'night',dark:true,mood:'night',loops:['sfx_heartbeat'],btns:[act('Morning ›',dawn,'alt')]})}
function nightPick(p,d){if(S.phase!=='night'||p.out)return;const t=S.P[d.target];if(!t||t.out||t===p)return;
  if(p.role==='T'){if(!victims().includes(t))return;const kind=d.kind==='dagger'&&S.daggers>0?'dagger':'poison';S.night[p.pid]={target:t.pid,kind};living().filter(q=>q.role==='T').forEach(q=>sync(q))}
  else S.sus[p.pid]={target:t.pid,kind:d.kind==='sure'?'sure':'hunch'};
  render();autoCheck()}
function dawn(){if(S.phase!=='night')return;const c={};
  Object.values(S.night).forEach(x=>{const t=S.P[x.target];if(t&&!t.out&&x.target!==S.shield){const k=x.target+'|'+x.kind;c[k]=(c[k]||0)+1}});
  const ranked=Object.entries(c).sort((a,b)=>b[1]-a[1]),top=ranked.length?ranked[0][1]:0,best=ranked.filter(r=>r[1]===top);
  if(best.length){const [pid,kind]=best[rnd(best.length)][0].split('|');S.nightRes={pid,kind}}else S.nightRes=null;
  const sc={};Object.values(S.sus).forEach(x=>{sc[x.target]=(sc[x.target]||0)+(x.kind==='sure'?2:1)});const sr=Object.entries(sc).sort((a,b)=>b[1]-a[1]);S.suspect=sr.length?{pid:sr[0][0],n:Object.values(S.sus).filter(x=>x.target===sr[0][0]).length}:null;
  S.phase='breakfast';play('sfx_door',{vol:.7});
  scene({title:'BREAKFAST',card:`<div class="big">Good morning.</div><div class="mid" style="margin-top:20px">Breakfast is served…</div><div class="mid" style="color:#ff6b75">Let's see who made it through the night.</div>`,say:'breakfast',dark:false,mood:'day',next:{label:'Reveal ›',fn:nightReveal,cls:'go'}})}

    scene({title:'A QUIET NIGHT',card:`<div class="big" style="font-size:110px">Everyone survived.</div><div class="mid">The Traitors did not strike… this time.</div>${sus}`,next:{label:'Next mission ›',fn:nextRound,cls:'go'}});return}

    const outn=tLeft()>=fLeft();
    scene({title:'MURDERED',card:`<div class="big traitor" style="font-size:120px">${nm(p)}</div><div class="mid" style="margin-top:14px">was murdered in the night.</div><div class="sub">They are now a 👻 ghost: they still answer questions, but can never vote.</div>${sus}`,floor:`<div class="big traitor">${nm(p)}</div>`,
      next:outn?{label:'Next ›',fn:()=>winners(false,'outnumber'),cls:'no'}:{label:'Next mission ›',fn:nextRound,cls:'go'}})}
  else{p.poisoned=true;play('sfx_gasp',{vol:.6});host('poisoned',300);revealAll('☠ POISONED','traitor');chron(`Poisoned in the night: ${p.name} – no vote next time.`);
    scene({title:'POISONED',card:`<div class="big" style="font-size:120px;color:#ff6b75">${nm(p)}</div><div class="mid" style="margin-top:14px">has been poisoned.</div><div class="sub">They can still answer and talk – but they cannot vote at the next Round Table.</div>${sus}`,floor:`<div class="big" style="color:#ff6b75">☠<br>${nm(p)}</div>`,next:{label:'Next mission ›',fn:nextRound,cls:'go'}})}}

/* ---------- the end ---------- */

function resolveEnd(){if(S.phase!=='endvote')return;const v=Object.values(S.endv),e=v.filter(x=>x==='end').length,a=v.length-e;chron(`End vote: ${e} to end, ${a} to banish again.`);

function endGame(){S.phase='finale';stopLoops();S.revi=0;host('revealyou');

  if(H.length){const step=()=>{if(S.phase!=='finale')return;const p=H[S.revi];S.revi++;play(p.role==='T'?'sfx_traitor':'sfx_faithful',{vol:.8});render();
    if(S.revi<H.length)setTimeout(step,3200);else{stopLoops();setActs([act('Reveal the winners ›',()=>winners(tLeft()<=0),'go')],[]);render()}};setTimeout(step,3000)}}
function winners(faithful,reason){stopLoops();setDark(false);S.phase='end';S.winner=faithful?'faithful':'traitor';const T=players().filter(p=>p.role==='T'),left=tLeft();

  revealAll(faithful?'THE FAITHFUL WIN':'THE TRAITORS WIN',faithful?'faithful':'traitor');
  chron(faithful?`The Faithful win ${money(S.pot)}.`:`The Traitors steal ${money(S.pot)}.`);
  const why=faithful?'Every Traitor was found. The Faithful share the glory – and the pot.':reason==='outnumber'?'The Traitors now outnumber the Faithful. The castle is theirs.':`${left} Traitor${left>1?'s':''} stayed hidden to the end and steal${left>1?'':'s'} the whole pot.`;
  scene({title:faithful?'THE FAITHFUL WIN':'THE TRAITORS WIN',card:`<div class="big ${faithful?'faithful':'traitor'}" style="font-size:110px">${faithful?'🛡 The Faithful win':'🗡 The Traitors win'}</div><div class="big" style="color:var(--gold2);font-size:140px">${money(S.pot)}</div>
    <div class="sub">${why}<br>The Traitors were: <b style="color:#ff6b75">${T.map(nm).join(', ')}</b>.<br>Answers: ${S.log.filter(l=>l.correct==='Yes').length} right out of ${S.log.length}.</div>`,
    floor:`<div class="big ${faithful?'faithful':'traitor'}" style="font-size:260px">${faithful?'FAITHFUL':'TRAITORS'}<br>WIN</div>`,mood:'day',

function missedList(){const n={};S.log.forEach(r=>{if(r.correct==='No'&&r.qid!=='none')n[r.qid]=(n[r.qid]||0)+1});

/* ---------- timers ---------- */

function kickTap(pid){if(S.kickArm===pid){S.kickArm=null;kick(pid);return}S.kickArm=pid;render();setTimeout(()=>{if(S.kickArm===pid){S.kickArm=null;render()}},4000)}
/* ---------- rendering ---------- */
const QPH=['question','lock','self','mresult'];
function nameRing(){const L=players();if(S.phase==='setup'||!L.length)return '';const n=L.length,R=n>20?1250:1150,fs=n>24?62:n>14?76:90;
  return '<div data-ring style="position:absolute;inset:0">'+L.map((p,k)=>{const a=k/n*6.283-1.5708,x=1423+Math.cos(a)*R,y=1718+Math.sin(a)*R*1.12;

function renderPot(){$('pot').innerHTML=`<h2>Prize pot</h2><div class="amt">${money(S.pot)}</div><div class="sub" style="font-size:46px">Every right answer adds <b style="color:var(--gold2)">${money(potStep())}</b>.<br>Banish every Traitor and the Faithful win it.<br>Fail… and <b style="color:#ff6b75">the Traitors steal it all.</b></div>`}
function renderStatus(){const steps=['Mission','Round Table','Night','Breakfast'],cur={mission:0,question:0,lock:0,self:0,mresult:0,missionend:0,roundtable:1,vote:1,vreveal:1,vtally:1,banish:1,banished:1,endvote:1,again:1,finale:1,night:2,breakfast:3}[S.phase];
