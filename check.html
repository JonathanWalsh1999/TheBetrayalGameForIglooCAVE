<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Betrayal – network check</title>
<style>
body{margin:0;background:#0a080c;color:#EEE7DA;font:17px/1.45 Inter,Arial,sans-serif;padding:18px}
h1{font:900 26px Georgia,serif;color:#F3D98B;margin:0 0 6px}
p{color:#A79F93;margin:6px 0 14px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:#17121a;margin:8px 0;border:2px solid #333}
.row b{flex:1}.row span{font-weight:800;white-space:nowrap}
.ok{border-color:#2E8B57}.ok span{color:#9FE3B8}.bad{border-color:#B3202F}.bad span{color:#FF9AA2}
#sum{margin-top:16px;padding:14px;border-radius:12px;background:#1d1722;font-weight:700}
</style></head><body>
<h1>Network check</h1>
<p>Open this on a phone connected to the network you want to use (e.g. college Wi-Fi). It takes about 15 seconds. Then screenshot the results.</p>
<div id="list"></div><div id="sum">Checking…</div>
<script>
/* Checks what this network allows. Nothing is sent or saved anywhere – it only tries to reach a few services. */
const T=[
 ['Normal websites (HTTPS)', ()=>reach('https://www.google.com/favicon.ico')],
 ['Phone link server (0.peerjs.com)', ()=>ws('wss://0.peerjs.com/peerjs?key=peerjs&id=chk'+Math.random().toString(36).slice(2,9)+'&token=t')],
 ['Direct links (WebRTC via STUN)', ()=>ice([{urls:'stun:stun.l.google.com:19302'}],'srflx')],
 ['Relayed links (TURN, port 3478)', ()=>ice([{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}],'relay')],
 ['Cloudflare (workers.dev relay)', ()=>reach('https://www.cloudflare.com/favicon.ico')],
 ['Google Firebase', ()=>reach('https://www.gstatic.com/firebasejs/favicon.ico',true)],
];
const timeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(false),ms))]);
function reach(u,anyReply){return timeout(fetch(u,{mode:'no-cors',cache:'no-store'}).then(()=>true).catch(()=>false),8000)}
function ws(u){return timeout(new Promise(r=>{try{const s=new WebSocket(u);s.onmessage=()=>{r(true);s.close()};s.onopen=()=>setTimeout(()=>{r(true);s.close()},500);s.onerror=()=>r(false)}catch(e){r(false)}}),8000)}
function ice(servers,type){return timeout(new Promise(r=>{try{const pc=new RTCPeerConnection({iceServers:servers});pc.createDataChannel('x');let hit=false;
  pc.onicecandidate=e=>{if(e.candidate&&e.candidate.candidate.includes(' typ '+type+' ')){hit=true;r(true);pc.close()}if(!e.candidate&&!hit){r(false);pc.close()}};
  pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>r(false))}catch(e){r(false)}}),10000)}
(async()=>{const L=document.getElementById('list');const res={};
  for(const [name,fn] of T){const d=document.createElement('div');d.className='row';d.innerHTML=`<b>${name}</b><span>…</span>`;L.appendChild(d);
    const ok=await fn();res[name]=ok;d.classList.add(ok?'ok':'bad');d.querySelector('span').textContent=ok?'✓ allowed':'✗ blocked'}
  const v=Object.values(res);const peer=v[1],direct=v[2],turn=v[3];
  document.getElementById('sum').textContent=!peer?'The phone link server is blocked on this network.':(!direct&&!turn)?'Direct phone links are blocked on this network – the game needs a relay.':'This network looks OK for the current phone link.';})();
</script></body></html>
