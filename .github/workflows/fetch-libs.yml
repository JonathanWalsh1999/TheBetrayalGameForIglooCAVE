name: Fetch libraries
on:
  push:
    paths: ['tools/lib-manifest.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files listed in the manifest
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          m = json.load(open('tools/lib-manifest.json'))
          for path, url in m.items():
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              try:
                  urllib.request.urlretrieve(url, path); print('ok', path, os.path.getsize(path))
              except Exception as e:
                  print('FAILED', path, e)
          PY
          echo '{}' > tools/lib-manifest.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib tools/lib-manifest.json
          git commit -m "Add vendored libraries" || echo "nothing to commit"
          git push
